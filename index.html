  <!-- JS-Skript Teil 2: Steuerung                                           -->
  <!--                                                                      -->
  <!-- Flugzustand, Kollisionserkennung, Bedienelemente des Panels          -->
  <!-- (Sicht-Umschalter, FPV-Ausrichtung, Kursmodus, Kamerawinkel-Rad),    -->
  <!-- Toast-Meldungen, Frameschleife renderLoop() und der Start der App.    -->
  <!-- ===================================================================== -->
<script>
  var pos={"x":0, "y":0, "z":0, "vx":0, "vy":0, "vz":0, "turn":0};
  // aktuell gehaltene Flugbefehle ('up','dn','tl','tr','mf','mb','ml','mr'), gespeist aus
  // Tastatur UND den Tastenkappen im Panel. Ein SET statt eines Einzelwerts, damit jede
  // Kombination im selben Frame ausgewertet werden kann - eine Pfeiltaste plus eine WASD-Taste
  // (steigen beim Beschleunigen, drehen beim Fliegen), zwei WASD-Tasten usw. Gegenläufige
  // Tasten (W+S, links/rechts) heben sich einfach auf null auf. Bewusst global wie pos.
  var held=new Set();
  // Tastenkürzel -> Flugbefehl, gemeinsam von den keydown- und keyup-Handlern genutzt
  function keyCmd(k){
    return {w:"mf", s:"mb", a:"ml", d:"mr",
            arrowup:"up", arrowdown:"dn", arrowleft:"tl", arrowright:"tr"}[k]||null;
  }
  // Einmal-Flag: die Erfolgsmeldung blendet sich nur einmal ein
  var successShown=false;
  // Kursmodus: 'parcours' (Standard: drei Ringe + Pfosten + Durchflugzähler) oder 'training'
  // (einfacher Flug von Platz 1 zu Platz 2, keine Ringe, keine Pfosten). Umschaltbar über das Knopp-Paar
  // in der Hinweiszeile des Panels; ein Wechsel startet die Szene immer mit einem
  // ganz neuen Kurs neu (gleicher Weg wie ein Klick auf die Erfolgsmeldung).
  var courseMode='parcours';
  // Kameramodus: false = Überblick (Orbit-Steuerung), true = Ego-Sicht an der Nase klebend
  var fpv=false;
  // FPV-Kameraneigung in Grad: negativ = nach oben schauen, positiv = nach unten schauen (-30..90),
  // gesteuert über das weiße Winkelrad zwischen den Pfeil- und WASD-Tastenfeldern
  var fpvTilt=0;
  var fpvTiltQ=new THREE.Quaternion();// Arbeits-Quaternion, jeden Frame wiederverwendet (keine Allokation pro Frame)
  var fpvAxisX=new THREE.Vector3(1,0,0);
  // FPV-Kameraausrichtung: 'starr' = starr auf der Drohne (volles Nicken/Rollen geht ins Bild),
  // 'gimbal' = Gieren folgt, Nicken/Rollen mit Trägheit gedämpft (wie ein 2-Achsen-Gimbal),
  // 'welt' = Ausrichtung an den Weltkoordinaten fest (nur Gieren folgt, Horizont immer waagerecht)
  var fpvAlign='starr';
  var fpvAlignQ=new THREE.Quaternion(); // geglättete Gimbal-Ausrichtung, jeden Frame wiederverwendet
  var fpvTargetQ=new THREE.Quaternion();// Arbeitswert: gewünschte Ausrichtung des aktuellen Frames
  var fpvLevelE=new THREE.Euler(0,0,0,'YXZ');// Arbeitswert: nur-Gier-Ausrichtung (weltfest)
  var obstacles=[];// Ringe + Pfosten des aktuellen Kurses, jeden Frame geprüft
  var lastCollision='';// '' | 'ring' | 'post' - Art des letzten Aufpralls
  var collisionCount=0;// wie eschadlos es seit dem Laden der Seite zuging? (Anzahl der Aufpralle)
  var droneColR=-1;// Kollisionskugel der Drohne, einmalig aus dem Begrenzungsbox gemessen
  var droneColCY=4;// Mitte dieser Kugel über dem Ursprung der Drohnengruppe
  var crashAt=-1e9, crashTimer=null;// -1e9: ein Aufprall direkt nach dem Laden darf eine Meldung auslösen
  // kurze rote Kollisionsmeldung: blendet sich nach 1,6 s selbst aus UND ist per Klick
  // schließbar (Handler in setupControls()), so der Pilot einfach weiterfliegt. Sperre, damit
  // eine an ein Hindernis gedrückte Drohne sie nicht jeden Frame spammt.
  function showCrash(text){
    const now=performance.now();
    if(now-crashAt<1200) return;
    crashAt=now;
    const el=document.getElementById('crashToast');
    if(!el) return;
    document.getElementById('crashTitle').textContent=text;
    el.classList.add('show');
    clearTimeout(crashTimer);
    crashTimer=setTimeout(function(){ el.classList.remove('show'); },1600);
  }
  // ---- Ring-Durchflugzähler (von renderLoop gelesen): welcher der 3 Ringe des aktuellen Kurses
  // wurde schon DURCHFLOGEN? ringPrevSide[i] hält den signierten Abstand der
  // Drohnenmitte von Ringebene i im Vorframe -> Vorzeichenwechsel = Ebene gekreuzt,
  // und wenn die Kreuzung in der Öffnung stattfand (nicht irgendwo außerhalb des Rings), zählt
  // der Ring. resetScene() setzt alles für den neuen Kurs zurück.
  var passedRings=[false,false,false];
  var ringPrevSide=[null,null,null];
  var ringPassCount=0;
  function updateRingBadge(){
    const el=document.getElementById('ringBadge');
    if(!el) return;
    // Trainingsmodus hat überhaupt keine Ringe -> das Zähler-Badge bleibt ausgeblendet
    el.style.display=(courseMode==='training')?'none':'';
    if(ringPassCount>=3){
      el.textContent='3 von 3 Ringen - jetzt landen!';
      el.classList.add('done');
    }else{
      el.textContent='Ringe: '+ringPassCount+' von 3';
      el.classList.remove('done');
    }
  }
  // Abstand eines Punkts zum Mittellinienkreis eines Rings (ohne Kontaktschwelle). Derselbe
  // Formel wie der Ring-Zweig in obstacleContact unten; die Ausweichschleife nutzt sie, um auf einen
  // exakten Freiraum zu steuern, nicht nur zu "irgendwo außerhalb".
  function ringGap(o, sx, sy, sz){
    const dx=sx-o.x, dy=sy-o.y, dz=sz-o.z;
    const a=dx*o.ax+dy*o.ay+dz*o.az;// Anteil entlang der Ringachse
    const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// Anteil in der Ringebene
    const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);// Abstand von der Ringachse
    return Math.sqrt((rl-o.R)*(rl-o.R)+a*a);
  }
  // Kontaktprüfung der Drohnenkugel (Mitte sx/sy/sz) an EINEM Hindernis. Liefert null
  // bei ausreichendem Freiraum, sonst ein kleines Info-Objekt mit dem gemessenen Abstand
  // und der Geometrie, die zum Herausdrücken nötig ist. Genutzt von der Frame-Prüfung in
  // renderLoop und von der Ausweichschleife, die eine bereits in Kontakt geratene Drohne befreit.
  function obstacleContact(o, sx, sy, sz){
    if(o.kind==='ring'){
      // Abstand der Drohnenmitte vom Mittellinienkreis des Torus
      const dx=sx-o.x, dy=sy-o.y, dz=sz-o.z;
      const a=dx*o.ax+dy*o.ay+dz*o.az;// Anteil entlang der Ringachse
      const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// Anteil in der Ringebene
      const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);// Abstand von der Ringachse
      const d=Math.sqrt((rl-o.R)*(rl-o.R)+a*a);
      const need=o.tube+droneColR;
      if(d<need) return {kind:'ring', o:o, d:d, need:need, dx:dx, dy:dy, dz:dz,
                         rx:rx, ry:ry, rz:rz, rl:rl};
    }else{
      // Abstand der Drohnenmitte vom vertikalen Pfosten-Segment
      const cy=Math.max(o.y0,Math.min(o.y1,sy));
      const dx=sx-o.x, dy=sy-cy, dz=sz-o.z;
      const rr=o.r+droneColR;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2<rr*rr) return {kind:'post', o:o, d:Math.sqrt(d2), need:rr, dx:dx, dy:dy, dz:dz};
    }
    return null;
  }

  function setupControls(){
    // Orbit-Steuerung erzeugen (Ziehen mit linker/rechter Maustaste, Rad usw. bewegt die Kamera)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    //controls.target.set(0,7,0);// Alternative: Ziel leicht über dem Boden - nicht verwendet
    controls.target=drone.position;
    controls.update();
    controls.enablePan=false;
    // Zoomen (Rad / Pinch) und Umlenken (Ziehen / ein Finger) sind AKTIVIERT: die Standardansicht ist
    // zu nah, um das Meer am fernen Rand zu zeigen; der Pilot muss daher zurückzoomen
    // und um die Drohne kreisen können, um die Küste mit ihren beiden Buchten zu sehen. minDistance
    // hält die Kamera außerhalb der Rotorspannweite (28 Einheiten) statt im Modell.
    controls.enableZoom=true;
    controls.enableRotate=true;
    controls.minDistance=20;
    // Zoom nach außen endet bei 4000: mit Drone-Versatz (~400) bleibt die Kamera sicher
    // INNERHALB der Himmelkuppel (HORIZON_R=8000) - von dort ist der Horizont überall
    // nahtlos zu sehen und die far-Plane (2 x HORIZON_R) schneidet die Kuppel nie auf
    controls.maxDistance=4000;

    // Flugtasten: der Tastendruck wird geschluckt (preventDefault), damit der Browser ihn
    // nicht seiner Suchleiste übergibt oder mit den Pfeilen die Seite scrollt.
    // Tastenkombinationen mit Modifikatoren (Ctrl/Cmd/Alt, z.B. Ctrl+F) bleiben bewusst unangetastet.
    // Jede Taste fügt ENTWEDER ihren eigenen Befehl in `held` ein oder entfernt ihn, daher funktioniert
    // jede Kombination gleichzeitig (eine Pfeiltaste + eine WASD-Taste, zwei WASD-Tasten, ...) und
    // das Loslassen einer Taste hebt nie eine noch gehaltene auf.
    const flightKeys=["w","s","a","d","arrowup","arrowdown","arrowleft","arrowright"];
    document.addEventListener("keydown", e => {
      const k=(e.key||"").toLowerCase();// fasst auch Shift+W / Großschreib-Taste -> "W"
      if(flightKeys.includes(k) && !e.ctrlKey && !e.metaKey && !e.altKey){
        e.preventDefault();
        e.stopPropagation();
        const c=keyCmd(k);
        if(c) held.add(c);// idempotent: die Tastatur-Wiederholung löst keydown mehrfach aus
      }
    });
    document.addEventListener("keyup", e => {
      const c=keyCmd((e.key||"").toLowerCase());
      if(c) held.delete(c);// nur der Befehl DIESER Taste wird gelöst, andere bleiben aktiv
      // bewusst NICHT an Modifikatoren gekoppelt: ein Loslassen muss immer ankommen
    });
    // ein verlorenes Fenster (Alt+Tab, Tab-Wechsel) kann keyup-Events verschlucken -> das Set leeren,
    // damit kein Befehl für immer kleben bleibt
    window.addEventListener("blur", function(){ held.clear(); });
    document.addEventListener("visibilitychange", function(){ if(document.hidden) held.clear(); });

    document.getElementById('landedToast').addEventListener('click',resetScene);
    // Klick auf die Kollisionsmeldung: sofort ausblenden -> der Pilot setzt den Flug fort
    // (der Selbstausblende-Timer von showCrash wird abgebrochen, damit er nicht später feuert)
    document.getElementById('crashToast').addEventListener('click',function(){
      this.classList.remove('show');
      clearTimeout(crashTimer);
    });
    updateRingBadge();// Zählertext einmalig beim Start zeichnen

    // dreistufiger FPV-Ausrichtungsschalter: starr (starr auf der Drohne) | Gimbal (gedämpft) |
    // Welt (weltfest). Die Zeile ist außerhalb der FPV-Sicht abgedunkelt.
    const alignRow=document.getElementById('alignRow');
    // Betreten des Gimbal-Modus: bei der AKTUELLEN Kameraausrichtung ansetzen (Neigung entfernt),
    // ein Moduswechsel springt nie - die Ansicht gleitet danach zum Ziel
    const snapGimbal=function(){
      fpvAlignQ.copy(camera.quaternion);
      if(fpvTilt!==0){
        // die lokale Kopfneigung herausrechnen, sie wird nach der Ausrichtung jeden Frame neu gesetzt
        fpvAlignQ.multiply(fpvTiltQ.setFromAxisAngle(fpvAxisX, fpvTilt*Math.PI/180));
      }
    };
    const setAlign=function(mode){
      if(mode===fpvAlign) return;
      fpvAlign=mode;
      if(mode==='gimbal'&&fpv) snapGimbal();
      [].forEach.call(alignRow.querySelectorAll('.align-bt'),function(b){
        const on=(b.getAttribute('data-align')===mode);
        b.classList.toggle('is-on',on);
        b.setAttribute('aria-pressed',on?'true':'false');
      });
    };
    alignRow.addEventListener('click',function(e){
      const b=e.target.closest?e.target.closest('.align-bt'):null;
      if(b) setAlign(b.getAttribute('data-align'));
    });

    // Sichtschalter im Bedienpanel: Überblick <-> Ego-Sicht.
    // Beim Betreten der FPV wird der weltbezogene Versatz der Überblickskamera relativ zur
    // Drohne gespeister, beim Verlassen wird genau dieser Versatz wiederhergestellt (gleicher Abstand und Richtung,
    // nur wo immer die Drohne jetzt ist) - die Ansicht geht nach langem FPV-Flug nie verloren.
    const camBackOffset=new THREE.Vector3();
    const viewToggle=document.getElementById('viewToggle');
    const setFpv=function(on){
      if(on===fpv) return;
      if(on){
        camBackOffset.copy(camera.position).sub(drone.position);
        fpv=true;
        if(fpvAlign==='gimbal') snapGimbal();// weiterhin fließend aus der aktuellen Ansicht
      }else{
        fpv=false;
        camera.position.copy(drone.position).add(camBackOffset);
        controls.update();// Orbit-Steuerung übernimmt wieder: Blick auf die Drohne
      }
      viewToggle.classList.toggle('is-on',fpv);
      viewToggle.setAttribute('aria-pressed',fpv?'true':'false');
      document.getElementById('viewLabel').textContent=fpv?'Sicht: FPV (Nase)':'Sicht: Überblick';
      alignRow.classList.toggle('is-dim',!fpv);// Ausrichtung zählt nur in der FPV-Sicht
    };
    viewToggle.addEventListener('click',function(){ setFpv(!fpv); });

    // Kursmodus-Schalter: parcours (drei Ringe + Pfosten + Durchflugzähler) <-> training
    // (einfacher Flug von Platz 1 zu Platz 2, keine Ringe, keine Pfosten). Ein Wechsel startet die
    // Szene neu: Drohne zurück auf Platz 1, Kamera zurück auf die Startansicht, ganz neuer Kurs -
    // exakt derselbe Neustart wie ein Klick auf die Erfolgsmeldung.
    const modeSw=document.getElementById('modeSw');
    const setCourseMode=function(mode){
      if(mode===courseMode) return;
      courseMode=mode;
      [].forEach.call(modeSw.querySelectorAll('.mode-bt'),function(b){
        const on=(b.getAttribute('data-mode')===mode);
        b.classList.toggle('is-on',on);
        b.setAttribute('aria-pressed',on?'true':'false');
      });
      resetScene();// Neustart mit frischem Kurs; buildRings() beachtet courseMode
    };
    modeSw.addEventListener('click',function(e){
      const b=e.target.closest?e.target.closest('.mode-bt'):null;
      if(b) setCourseMode(b.getAttribute('data-mode'));
    });

    // weißes Rollrad für den FPV-Kamerakopf: -30° (nach oben) .. +90° (gerade nach unten auf den
    // Landeplatz). Das Rad ragt nur aus einem schmalen rechteckigen Schlitz heraus; es lässt sich
    // durch Ziehen entlang des Schlitzes, über das Mausrad oder über die Pfeiltasten bewegen. Die Pfeiltasten werden
    // hier geschluckt (stopPropagation), solange das Rad fokussiert ist, damit sie die Kamera neigen
    // anstatt die Drohne zu steuern.
    const TILT_MIN=-30, TILT_MAX=90, TILT_SPAN=TILT_MAX-TILT_MIN;
    const SCALE_TRAVEL=150;// px, die der Marker auf dem Maßstab läuft (Skalenhöhe 156 - 2 x 3)
    const knob=document.getElementById('tiltKnob');
    const tiltNeedle=document.getElementById('tiltNeedle');
    const setTilt=function(v){
      fpvTilt=Math.max(TILT_MIN,Math.min(TILT_MAX,Math.round(v)));
      // der Marker gleitet auf dem Maßstab (oben = -30°, unten = +90°) und die Rändelung des
      // Rads wandert mit, sodass die Rippen sichtbar durch den Schlitz laufen
      tiltNeedle.style.transform='translateY('+((fpvTilt-TILT_MIN)/TILT_SPAN*SCALE_TRAVEL).toFixed(1)+'px)';
      knob.style.setProperty('--spinY',(fpvTilt*1.1).toFixed(1)+'px');
      knob.setAttribute('aria-valuenow',String(fpvTilt));
      knob.setAttribute('aria-valuetext',fpvTilt+' Grad');
    };
    // am Schlitz ziehen: Finger nach unten = weiter nach unten schauen, Finger nach oben = nach oben schauen
    // (0,8° pro Pixel -> der volle Bereich -30..90° spannt das 150 px lange Rad)
    let dragY=null;
    knob.addEventListener('pointerdown',function(e){
      dragY=e.clientY;
      try{ knob.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    knob.addEventListener('pointermove',function(e){
      if(dragY===null) return;
      const dy=e.clientY-dragY;
      dragY=e.clientY;
      setTilt(fpvTilt + dy*0.8);
    });
    const endDrag=function(){ dragY=null; };
    knob.addEventListener('pointerup',endDrag);
    knob.addEventListener('pointercancel',endDrag);
    knob.addEventListener('wheel',function(e){
      e.preventDefault();// Drehen am Rad darf die Seite nicht scrollen
      setTilt(fpvTilt + Math.sign(e.deltaY)*3);// Rad nach unten = weiter nach unten schauen
    },{passive:false});
    knob.addEventListener('keydown',function(e){
      let step=0;
      if(e.key==='ArrowUp') step=-3;        // weiter nach oben schauen
      else if(e.key==='ArrowRight') step=6; // im Uhrzeigersinn drehen = nach unten
      else if(e.key==='ArrowDown') step=3;  // weiter nach unten schauen
      else if(e.key==='ArrowLeft') step=-6;
      else if(e.key==='Home'){ setTilt(0); e.preventDefault(); e.stopPropagation(); return; }
      if(step!==0){
        setTilt(fpvTilt+step);
        e.preventDefault();
        e.stopPropagation();// nicht zusätzlich die dokumentweiten Flugtasten auslösen
      }
    });
    setTilt(fpvTilt);// Maßstabmarker und Rändelversatz einmalig beim Start zeichnen

  }

  function renderLoop () {
    if(!fpv) controls.update();// in der FPV wird die Kamera gesetzt -> die Orbit-Steuerung darf nicht dagegenarbeiten
    // Propellerblätter (Rotoren) drehen
    drone1.rotation.y+=Math.PI/8;
    drone2.rotation.y+=Math.PI/8;
    drone3.rotation.y+=Math.PI/8;
    drone4.rotation.y+=Math.PI/8;

    // langsame Wolken-Drift (springt um, noch weit außerhalb des Bilds)
    for(let i=0;i<clouds.children.length;i++){
      let cl=clouds.children[i];
      cl.position.x+=1.5;
      if(cl.position.x>9000){cl.position.x=-9000;}
    }

    // hintere (rote) und vordere (blaue) Markierung alle 0,5 s blinken lassen
    let blinkOn=Math.floor((performance.now()-blinkStart)/500)%2===0;
    md3.visible=blinkOn;
    md4.visible=blinkOn;

    // Wellenanimation: die Normalen-Textur wandert über die Meeresoberfläche, angetrieben von der ECHTEN
    // verstrichenen Zeit (gedeckelt, damit ein Hintergrund-Tab die Wellen beim Aktivieren nicht vorspringen lässt)
    if(waterMesh){
      const nowT=performance.now();
      if(waterPrevT>0){
        waterMesh.material.uniforms.time.value+=Math.min((nowT-waterPrevT)/1000,0.1);
      }
      waterPrevT=nowT;
    }
    
    let limit=1.0;
    
    pos.vx *= 0.95;
    pos.vy *= 0.95;
    pos.vz *= 0.95;
    // jeder aktuell gehaltene Befehl wirkt im SELBEN Frame - unabhängige if-Blöcke
    // statt einer else-if-Kette, damit z.B. eine Pfeiltaste und eine WASD-Taste zusammen fliegen
    // (steigen beim Beschleunigen, drehen beim Fahren). Gegenläufige Tasten ergeben netto 0.
    if(held.has("up")){
      pos.vy+=0.1;
      if(pos.vy>limit){pos.vy=limit;}
    }
    if(held.has("dn")){
      pos.vy-=0.1;
      if(pos.vy<-limit){pos.vy=-limit;}
    }
    if(held.has("tl")){
      pos.turn += Math.PI/72;
    }
    if(held.has("tr")){
      pos.turn -= Math.PI/72;
    }
    if(held.has("mf")){
      pos.vz+=0.1;
      if(pos.vz>limit){pos.vz=limit;}
    }
    if(held.has("mb")){
      pos.vz-=0.1;
      if(pos.vz<-limit){pos.vz=-limit;}
    }
    if(held.has("ml")){
      pos.vx-=0.1;
      if(pos.vx<-limit){pos.vx=-limit;}
    }
    if(held.has("mr")){
      pos.vx+=0.1;
      if(pos.vx>limit){pos.vx=limit;}
    }

    pos.y += pos.vy;
    // Boden: die Drohne darf weder unter den Boden noch INS Gelände sinken - Hügel ragen
    // über y=0 hinaus, daher wird der alte flache y=0-Test ein echter Geländetest (Plätze und Start-
    // scheibe bleiben wegen max auf 0). Das Abprallverhalten bleibt unverändert. Über dem Meer
    // meldet groundY() die WASSEROBERFLÄCHE, die Drohne landet also auf dem Wasser, nicht auf dem Grund.
    const gy=groundY(pos.x,pos.z);
    if(pos.y<gy){
      pos.y -=pos.vy;
      pos.vy=-pos.vy*0.5;
      if(pos.y<gy) pos.y=gy;// Sicherheitsnetz für große Schritte
    }
    // Spritz: eine kurze rote Meldung, wenn die Drohne das Meer berührt - genau wie
    // ein Ringaufprall (gleiche showCrash, gleicher Klick-zum-Schließen). waterTouched begrenzt es auf
    // eine Meldung pro Tauchgang, Treiben auf den Wellen löst sie also nicht jedes Mal aus; das
    // Uferband zählt nie, weil die Drohne dort ÜBER der Wasserlinie ruht.
    if(isWater(pos.x,pos.z)&&pos.y<=WATER_LEVEL+0.05){
      if(!waterTouched){ waterTouched=true; showCrash('Drohne gewassert!'); }
    }else{
      waterTouched=false;
    }
    const preX=pos.x, preY=pos.y, preZ=pos.z;// Start dieses Bewegungsschritts (für das Zurückspringen)
    pos.x += Math.cos(-pos.turn-Math.PI/2)*pos.vz;
    pos.z += Math.sin(-pos.turn-Math.PI/2)*pos.vz;
    pos.x += Math.cos(-pos.turn)*pos.vx;
    pos.z += Math.sin(-pos.turn)*pos.vx;

    // ---- Kollisionsanalyse: Ringe und Pfosten des aktuellen Kurses. Die Drohne wird als
    // Kugel um ihre Mitte modelliert (Radius = halbe Rotorspannweite, einmalig aus der
    // Begrenzungsbox gemessen). Ein Ring ist sein Mittellinienkreis, ein Pfosten ein vertikales Segment.
    // Bei einem Treffer wird die Drohne auf den Beginn dieses Bewegungsschritts zurückgesetzt, die
    // Geschwindigkeit auf null gesetzt, eine kurze rote Meldung erscheint (siehe showCrash) und eine Ausweichschleife schiebt
    // die Drohne aus jedem noch bestehenden Kontakt HERAUS - ohne diesen Schub liegt die
    // Position des Schrittstarts noch in einer Kontakthülle (der tiefe Rand eines Rings reicht bei
    // kurzem Pfosten durch das Gelände), die Meldung würde schon im nächsten
    // Frame wieder erscheinen und die Drohne könnte nie wegsteuern (sie war festgeklemmt). Genau
    // durch die Mitte eines Rings bleibt kollisionsfrei: die Öffnung (Radius 21) ist breiter als die
    // Drohnenkugel, gefährlich sind nur das Randrohr und der Pfosten darunter.
    if(obstacles.length){
      if(droneColR<0){
        const b=new THREE.Box3().setFromObject(drone);
        droneColR=0.5*Math.max(b.max.x-b.min.x,b.max.z-b.min.z);
        droneColCY=0.5*(b.min.y+b.max.y)-drone.position.y;
      }
      const sx=pos.x, sy=pos.y+droneColCY, sz=pos.z;
      let hitKind='';//'ring' | 'post' - erster Kontakt dieses Frames (er steuert die Meldung)
      for(let i=0;i<obstacles.length&&!hitKind;i++){
        const c=obstacleContact(obstacles[i], sx, sy, sz);
        if(c) hitKind=c.kind;
      }
      if(hitKind){
        pos.x=preX; pos.y=preY; pos.z=preZ;// zurück auf die sichere Position des Frame-Beginns
        pos.vx=0; pos.vy=0; pos.vz=0;// sofort anhalten, der Pilot muss um das Hindernis herumsteuern
        // Ausweichen: die Drohne aus jedem noch bestehenden Kontakt HERAUS schieben. Ohne den Schub
        // kann die Position des Schrittstarts in einer Kontakthülle liegen (der tiefe Rand eines Rings
        // reicht bei kurzem Pfosten DURCH das Gelände), die Meldung würde
        // schon im nächsten Frame wieder erscheinen und jeder Bewegungsschritt würde erneut zurückgenommen -
        // die Drohne war festgeklemmt und nicht mehr steuerbar. Jede Runde drückt aus EINEM
        // Kontakt heraus (Flächennormale bis Kontaktabstand + ESC) und prüft erneut; gekettete
        // Kontakte (Ringhülle <-> der Pfosten darunter) sind so im selben Frame beseitigt,
        // collisionCount zählt dabei nur einmal. Würde die Normale die
        // Drohne INS Gelände drücken, gleitet sie seitlich heraus - sonst würde
        // das Gelände sie im nächsten Frame direkt wieder in die Hülle pressen.
        const ESC=1.0;// zusätzlicher Freiraum (Welteinheiten) über den Kontaktabstand hinaus
        for(let round=0;round<6;round++){
          const gy=groundY(pos.x,pos.z);
          if(pos.y<gy) pos.y=gy;// die Ausweichbewegung nie unter das Gelände lassen
          let c=null;// erster Kontakt an der aktuellen Ausweichposition
          for(let i=0;i<obstacles.length&&!c;i++){
            c=obstacleContact(obstacles[i], pos.x, pos.y+droneColCY, pos.z);
          }
          if(!c) break;// frei - Ausweichen abgeschlossen
          const o=c.o, need=c.need+ESC;
          if(c.kind==='ring'){
            // Einheits-Ausweichrichtung: vom nächsten Punkt des Mittellinienkreises
            // durch die Drohnenmitte; sitzt die Drohne genau AUF dem Kreis, ist dieser
            // Vektor verschwunden -> die radiale Richtung in der Ebene verwenden (verlässt das Rohr ebenfalls)
            let ux=c.dx, uy=c.dy, uz=c.dz, dl=c.d;
            if(c.rl>1e-6){
              ux-=o.R*c.rx/c.rl; uy-=o.R*c.ry/c.rl; uz-=o.R*c.rz/c.rl;
              dl=Math.sqrt(ux*ux+uy*uy+uz*uz);
            }
            if(dl<1e-6&&c.rl>1e-6){ux=c.rx/c.rl; uy=c.ry/c.rl; uz=c.rz/c.rl; dl=1;}
            let tx=pos.x, ty=pos.y+droneColCY, tz=pos.z;
            if(dl>1e-6){
              const k=(need-c.d)/dl;
              tx+=ux*k; ty+=uy*k; tz+=uz*k;
            }
            if(ty<groundY(tx,tz)){
              // der Normalschub würde unterirdisch enden (Drohne unter einem tiefen Rand): stattdessen
              // seitlich heraus - weg von der Pfostensäule oder ENTLANG DER RINGACHSE, wenn
              // die Drohne genau auf der Säule sitzt (der Abstand wächst dort linear, während
              // er seitlich quer zur Achse nur quadratisch wächst). y bleibt erhalten oder wird
              // auf steigendes Gelände angehoben, damit das Gelände sie nicht zurück in die Hülle presst.
              let hx=pos.x-o.x, hz=pos.z-o.z;
              const hl=Math.hypot(hx,hz);
              if(hl>1e-6){hx/=hl; hz/=hl;}
              else {hx=o.ax; hz=o.az;}// entlang der Achse (waagerecht, Einheitslänge)
              let found=false;
              for(let t=0.5;t<=40;t+=0.5){
                const qx=pos.x+hx*t, qz=pos.z+hz*t;
                const cyy=Math.max(pos.y, groundY(qx,qz))+droneColCY;
                if(ringGap(o,qx,cyy,qz)>=need){tx=qx; tz=qz; ty=cyy; found=true; break;}
              }
              if(!found){tx=pos.x; ty=pos.y+droneColCY; tz=pos.z;}// behalten, nächste Runde erneut versuchen
            }
            pos.x=tx; pos.y=ty-droneColCY; pos.z=tz;
          }else{
            // Pfosten: die Ausweichrichtung ist waagerecht oder nach oben und kann nie
            // unterirdisch enden, daher ist der einfache Normalschub hier immer sicher
            const dl=Math.sqrt(c.dx*c.dx+c.dy*c.dy+c.dz*c.dz);
            if(dl>1e-6){
              const k=(need-c.d)/dl;
              pos.x+=c.dx*k; pos.y+=c.dy*k; pos.z+=c.dz*k;
            }else{
              pos.x+=need;// Sonderfall: genau auf der Pfostenachse -> seitlich hinausdrücken
            }
          }
        }
        lastCollision=hitKind;
        collisionCount++;
        showCrash(hitKind==='ring'?'Kollision mit dem Ring!':'Kollision mit dem Pfosten!');
      }

      // ---- Ring-Durchflugzähler: signierter Abstand der Drohnenmitte von jeder Ringebene.
      // Bei VorzeichenWECHSEL wurde die Ebene gekreuzt; der Abstand in der Ebene verrät
      // ob das in der Öffnung (gezählt) oder außerhalb des Rings
      // geschah (ignoriert, z.B. Vorbeiflug über dem Ring). Jeder Ring zählt höchstens einmal.
      // Ein Frame mit gerade stattgefundenem Aufprall wird übersprungen - die Drohne wurde zurückgeschleudert.
      const cx=pos.x, cy2=pos.y+droneColCY, cz=pos.z;
      let ringIdx=0;
      for(let i=0;i<obstacles.length;i++){
        const o=obstacles[i];
        if(o.kind!=='ring') continue;
        const dx=cx-o.x, dy=cy2-o.y, dz=cz-o.z;
        const a=dx*o.ax+dy*o.ay+dz*o.az;// signierter Abstand von der Ringebene
        const s=(a>=0)?1:-1;
        if(!hitKind && ringPrevSide[ringIdx]!==null && ringPrevSide[ringIdx]!==s && !passedRings[ringIdx]){
          const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// Anteil in der Ringebene
          const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);
          if(rl<o.R-o.tube){// in der Öffnung gekreuzt -> echter Durchflug durch den Ring
            passedRings[ringIdx]=true;
            ringPassCount++;
            updateRingBadge();
          }
        }
        ringPrevSide[ringIdx]=s;
        ringIdx++;
      }
    }

    drone.position.set(pos.x,pos.y,pos.z);
    drone.rotation.set(-pos.vz*Math.PI/8, pos.turn, -pos.vx*Math.PI/8);

    // Ego-Sicht: die Kamera sitzt auf der Nase der Drohne. Wie sich ihre Ausrichtung
    // ableitet, hängt vom Ausrichtungsschalter ab:
    //   starr   - starr auf der Drohne: jedes Nicken/Rollen der Drohne geht ins Bild
    //   Gimbal  - Gieren folgt der Drohne, Nicken/Rollen sind mit Trägheit gedämpft (Slerp auf eine
    //            waagerechte Ausrichtung, 18 % der Drohnen-Neigung bleibt als Restkopplung)
    //   Welt    - Ausrichtung an den Weltkoordinaten fest: nur das Gieren folgt, der
    //            Horizont bleibt immer waagerecht
    // Das Neigerad ist eine LOKALE Kopfneigung und wird in jedem Modus nach der Ausrichtung angewendet.
    // Versatz: knapp über Deckhöhe (Deckeloberkante 5,01) und 0,35 VOR der Nasenkante (z ~ -4,7),
    // sonst füllt das eigene Deck das Bild, sobald der Kopf nach unten nickt. Direkt vor
    // der Nase sieht der Blick nach unten den Boden (und den Landeplatz) ungestört.
    if(fpv){
      camera.position.set(0,5.5,-5.35).applyQuaternion(drone.quaternion).add(drone.position);
      if(fpvAlign==='welt'){
        // weltfest: nur Gieren (das Gieren der Drohne ist genau pos.turn), Nicken/Rollen = 0
        camera.quaternion.setFromEuler(fpvLevelE.set(0,pos.turn,0,'YXZ'));
      }else if(fpvAlign==='gimbal'){
        // gewünschte Ausrichtung: waagerechter Horizont, 18 % der Drohnen-Neigung eingekoppelt
        fpvTargetQ.setFromEuler(fpvLevelE.set(0,pos.turn,0,'YXZ')).slerp(drone.quaternion,0.18);
        // exponentielles Glätten = Gimbal-Trägheit (~0,15 s Zeitkonstante bei 60 fps)
        fpvAlignQ.slerp(fpvTargetQ,0.14);
        camera.quaternion.copy(fpvAlignQ);
      }else{
        // starr auf der Drohne: vollständige Ausrichtung, genau wie zuvor
        camera.quaternion.copy(drone.quaternion);
      }
      if(fpvTilt!==0){
        // Kamerakopf lokal neigen: eine POSITIVE X-Drehung hebt den Blick, daher wird
        // eine Absichtsneigung als negative Drehung um die lokale X-Achse angewendet
        camera.quaternion.multiply(fpvTiltQ.setFromAxisAngle(fpvAxisX, -fpvTilt*Math.PI/180));
      }
    }

    // Erfolgsmeldung: beim ersten Aufsetzen nahe dem 2. Landeplatz einblenden
    if(!successShown && pos.y<0.6 && Math.hypot(pos.x-pad2.x, pos.z-pad2.z)<14){
      successShown=true;
      document.getElementById("landedToast").classList.add("show");
    }

    renderer.render(scene, camera);

  }

  // ==== Start der Anwendung =================================================
  // Reihenfolge: erst die 3D-Szene aufbauen (Teil 1), dann die Bedienelemente
  // verdrahten (Teil 2) und zum Schluss die Frameschleife starten (~30 fps).
  function main(){
    buildScene();// Teil 1: Aufbau der 3D-Szene
    setupControls();// Teil 2: Steuerung
    blinkStart=performance.now();// Uhr für das Lichtblinken beim Start der Demo starten
    setInterval(renderLoop,33);
  }
  window.addEventListener('DOMContentLoaded', main, false);

  window.addEventListener('load',function(){
    // Tastenkappen im Panel: Drücken fügt den Befehl der Kappe in `held` ein, Loslassen entfernt
    // NUR diesen Befehl - zwei Kappen können gleichzeitig gehalten werden (Multi-Touch auf den
    // Pfeil- und WASD-Feldern), Loslassen einer hebt nie die andere auf. Touch-Events
    // bleiben an dem Element, auf dem der Touch begann, daher sind touchend/touchcancel pro
    // Element exakt. Eine Maus ist ein einzelner Zeiger: das window-weite mouseup löst
    // die zuletzt mit der Maus gedrückte Kappe - das fängt auch ein Loslassen AUßerHALB des
    // Knopfs ab (Maus auf Kappe, wegziehen, loslassen). Befehlsname == Element-ID.
    let mouseCap=null;// Befehl, den die Maus aktuell gedrückt hält
    ["up","dn","tl","tr","mf","mb","ml","mr"].forEach(function(id){
      const el=document.getElementById(id);
      if(!el) return;
      el.addEventListener("mousedown",function(e){
        e.preventDefault();// keine Textauswahl / kein Ziehen der Kappe
        mouseCap=id; held.add(id);
      });
      el.addEventListener("touchstart",function(e){
        e.preventDefault();// unterdrückt auch die von einem Touch nachgebildeten Maus-Events
        held.add(id);
      });
      el.addEventListener("touchend",function(){ held.delete(id); });
      el.addEventListener("touchcancel",function(){ held.delete(id); });
    });
    window.addEventListener("mouseup",function(){
      if(mouseCap){ held.delete(mouseCap); mouseCap=null; }
    });
  });

</script>

        <div class="t-hint">Klick: neuer Kurs</div>
      </div>
      <!--
Kollisionsmeldung (Ring / Pfosten): blendet sich nach 1,6 s oder per Klick aus
-->
      <div class="crash-toast" id="crashToast" role="status">
        <span id="crashTitle">Kollision!</span>
      </div>
      <!--
Ringzähler: dauerhaft oben auf dem Canvas sichtbar
-->
      <div class="ring-badge" id="ringBadge" role="status">Ringe: 0 von 3</div>
      </div>
      <!-- ===== Bereich: Steuerungspanel ===== -->
      <div class="ctrl-panel">
        <div class="ctrl-title">Steuerung</div>
        <!--
Sicht-Umschalter: Überblick (Standard) <-> Ego-Sicht von der Nase der Drohne
-->
        <div class="view-row">
          <button type="button" class="cbt view-bt" id="viewToggle" aria-pressed="false" aria-label="Kamera umbeschalten">
            <span class="cam-dot"></span><span id="viewLabel">Sicht: Überblick</span>
          </button>
        </div>
        <!--
FPV-Kameraausrichtung, dreistufig: starr (starr auf der Drohne) | Gimbal (gedämpft) | Welt
             (weltfest). Außerhalb der FPV-Sicht abgedunkelt, denn sie wirkt nur in der FPV-Sicht.
-->
        <div class="align-row is-dim" id="alignRow" role="group" aria-label="FPV-Kameraausrichtung">
          <button type="button" class="cbt align-bt is-on" data-align="starr" aria-pressed="true">starr</button>
          <button type="button" class="cbt align-bt" data-align="gimbal" aria-pressed="false">Gimbal</button>
          <button type="button" class="cbt align-bt" data-align="welt" aria-pressed="false">Welt</button>
        </div>
        <div class="ctrl-pads">
        <table class="pad">
          <tr>
            <td>
            </td>
            <td>
              <a class="cbt" id="up" aria-label="Steigen">↑</a>
            </td>
            <td>
            </td>
          </tr>
          <tr>
            <td>
              <a class="cbt" id="tl" aria-label="Links drehen">←</a>
            </td>
            <td>
            </td>
            <td>
              <a class="cbt" id="tr" aria-label="Rechts drehen">→</a>
            </td>
          </tr>
          <tr>
            <td>
            </td>
            <td>
              <a class="cbt" id="dn" aria-label="Sinken">↓</a>
            </td>
            <td>
            </td>
          </tr>
        </table>
        <!-- weißes Rollrad in einem schmalen rechteckigen Schlitz zwischen den Pfeiltasten und den
             WASD-Tasten: Beschriftung über dem Rad, Maßstab rechts daneben -->
        <div class="pitch">
          <div class="pitch-label">Kamerawinkel</div>
          <div class="pitch-body">
            <div class="pitch-stage">
              <div class="pitch-wheel" id="tiltKnob" role="slider" tabindex="0"
                   aria-label="Kamerawinkel in der FPV-Sicht"
                   aria-valuemin="-30" aria-valuemax="90" aria-valuenow="0" aria-valuetext="0 Grad, geradeaus"></div>
            </div>
            <div class="pitch-scale" aria-hidden="true">
              <span class="pitch-needle" id="tiltNeedle"></span>
            </div>
          </div>
        </div>
        <table class="pad">
          <tr>
            <td>
            </td>
            <td>
              <a class="cbt" id="mf" aria-label="Vorwärts">W</a>
            </td>
            <td>
            </td>
          </tr>
          <tr>
            <td>
              <a class="cbt" id="ml" aria-label="Seitwärts links">A</a>
            </td>
            <td>
            </td>
            <td>
              <a class="cbt" id="mr" aria-label="Seitwärts rechts">D</a>
            </td>
          </tr>
          <tr>
            <td>
            </td>
            <td>
              <a class="cbt" id="mb" aria-label="Rückwärts">S</a>
            </td>
            <td>
            </td>
          </tr>
        </table>
      </div>
      <div class="hints">
        <div class="hint hint-lights">
          <span class="hint-side"><span class="dot dot-red"></span> Schlusslicht</span>
          <span class="hint-mid">
            <span class="mode-sw" id="modeSw" role="group" aria-label="Flugmodus">
              <button type="button" class="cbt mode-bt is-on" data-mode="parcours" aria-pressed="true">Parcours</button>
              <button type="button" class="cbt mode-bt" data-mode="training" aria-pressed="false">Training</button>
            </span>
          </span>
          <span class="hint-side">Frontlicht <span class="dot dot-blue"></span></span>
        </div>
        <div class="keys">
          <span class="key"><kbd>↑</kbd> Steigen</span>
          <span class="key"><kbd>↓</kbd> Sinken</span>
          <span class="key"><kbd>←</kbd> links drehen</span>
          <span class="key"><kbd>→</kbd> rechts drehen</span>
          <span class="key"><kbd>W</kbd> vorwärts</span>
          <span class="key"><kbd>S</kbd> rückwärts</span>
          <span class="key"><kbd>A</kbd> seitwärts links</span>
          <span class="key"><kbd>D</kbd> seitwärts rechts</span>
        </div>
      </div>
      </div>
    </section>
