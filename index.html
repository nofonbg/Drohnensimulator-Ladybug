  <!-- JS-Skript Teil 1: Aufbau der 3D-Szene                                -->
  <!--                                                                      -->
  <!-- Enthält alle three.js-Objekte in EINEM Abschnitt, in der            -->
  <!-- Reihenfolge:                                                         -->
  <!--   1. WELT    - Szene, Kamera, Renderer, Himmel, Licht, Wolken,       -->
  <!--                Materialien, Grundgeometrien, Gelände und Wasser      -->
  <!--   2. OBJEKTE - beide Landeplatten, rote Kurslinie, Ringe mit         -->
  <!--                Pfosten, Kurslicht und die Drohne                      -->
  <!-- main() ruft zuerst buildScene() (dieser Block) und danach            -->
  <!-- setupControls() (Teil 2, Steuerung) auf.                             -->
  <!-- ===================================================================== -->
<script>
  var controls;
  var scene,camera,renderer;
  // ---- Globale Szenenobjekte: von buildScene() angelegt und von renderLoop()
  // (Bereich Steuerung) pro Frame benutzt - deshalb bewusst global deklariert.
  var drone,drone1,drone2,drone3,drone4;// Drohnengruppe und die vier Rotorgruppen
  var md0,md1,md2,md3,md4,md5,md6,md7,md8;// Rumpf, Träger, Markierungen, Landebeine
  var md11,md12,md21,md22,md31,md32,md41,md42;// Rotorblätter der vier Rotoren
  var clouds,blinkStart;// Wolkengruppe und Startzeitpunkt des Lichtblinkens
  var sky;// Himmelkuppel (sky.jpg-Textur), folgt der Kamera - siehe renderLoop()
  // 2. Landeplatz: wird in buildScene() mit einer Zufallsposition (Welt-x/z) gefüllt
  var pad2={"x":0, "z":0};
  // ---- Horizont-Maße: EINE Zahl für Boden, Wasser UND Himmel -----------------
  // Bodenscheibe und Himmelkuppel teilen sich diesen Radius (konzentrisch auf dem
  // Ursprung, beide enden auf y=0). Dadurch trifft an der Horizontkante genau die
  // Bodenkante auf die Kuppelkante - von überall INNERHALB der Kugel trifft jeder
  // Blickstrahl ent Boden/Wasser oder Himmel, es bleibt keine Lücke (nahtlos).
  // Nachjustieren genügt hier - Scheibe, Kuppel, Wasser-Polygon, Kamera-Weit (far)
  // und Zoom-Begrenzung ziehen automatisch mit.
  const HORIZON_R=8000;// Radius der Himmelkuppel (Halbkugel) in Welteinheiten
  const GROUND_R=HORIZON_R+16;// Bodenscheibe ragt 16 Einheiten über die Kuppel hinaus:
  // ihre 256 Facetten-Kanten liegen dann überALL über den 64 Kuppel-Facetten, es kann
  // kein Schlitzenzwischenstich ans Hellblau von scene.background durchblitzen
  const GROUND_SPOKES=256;// Speichen der Bodenscheibe (Ring-Übergänge teilen Vertices -> keine Risse)
  // Geländehöhe an einer Welt-x/z-Position: in buildScene() als Closure über das
  // Bodenhöhengitter angelegt und von der Routenlinie, den Ringpfosten sowie der
  // Bodenkollision in renderLoop() genutzt - bewusst global wie die Wolken.
  var floorY=null;// Geländehöhe an einer Welt-x/z-Position, in buildScene() angelegt
  // ---- Wasser: die Landschaftsänderung. Die Küstenlinie zieht sich ein Drittel vor
  // dem FERNEN Rand der früheren 1000x1000-Landschaft entlang (z = -167 statt -500) und schneidet ZWEI
  // Buchten unterschiedlicher Größe ins Land; von der Küste läuft das Meer BIS ZUM SCHEIBENRAND
  // (Horizont, Nutzerentscheidung). Alle Werte sind in Terrain-Einheiten, also exakt den
  // Koordinaten, die floorY() liefert (das Boden-Mesh liegt selbst auf Welt-y = -1, daher wird
  // die Wasseroberfläche eine Einheit tiefer gerendert - siehe waterMesh.position.y in buildScene()).
  var COAST_Z=-167;// gerade Küstenlinie: Meer, wo z < coastZ(x); Land, wo z > coastZ(x)
  var WATER_LEVEL=-1.5;// Wasseroberfläche in Terrain-Einheiten (gerendert als Welt-y = WATER_LEVEL-1)
  var WATER_SEABED=-4.5;// Meeresboden in Terrain-Einheiten -> darüber 3 Einheiten Wassertiefe
  // weiche Bucht: 0 außerhalb von |x-cx| >= hw, `depth` in der Mitte, Kosinus-Übergang ohne Kanten
  const bayBump=(x,cx,hw,depth)=>{
    const dx=Math.abs(x-cx);
    if(dx>=hw) return 0;
    return depth*0.5*(1+Math.cos(Math.PI*dx/hw));
  };
  // Küstenlinie der aktuellen Landschaft: die gerade Streifenkante plus die beiden Buchten, beide
  // INLAND geschnitten (nach +z): eine GROSSE Bucht im Westen (reicht bis z = -57) und eine deutlich
  // KLEINERE im Osten (reicht bis z = -112) - die Größen unterscheiden sich absichtlich
  const coastZ=(x)=>
    COAST_Z
    +bayBump(x,-150,130,110)// große Bucht: Mündung 260 breit, 110 tief
    +bayBump(x, 170, 85, 55);// kleine Bucht: Mündung 170 breit, 55 tief
  // wahr, wo die Wasserfläche existiert - steuert das Aushöhlen des Geländes, die Flugphysik und
  // die Spritz-Meldung; Ufer, Wasser-Mesh und Kollision stimmen dadurch immer überein
  const isWater=(x,z)=>z<coastZ(x);
  // Bodenhöhe FÜR DIE FLUGPHYSIK: an Land genau das Gelände wie bisher (nie
  // unter 0), im Meeresbereich die WASSEROBERFLÄCHE - die Drohne ruht AUF dem Wasser
  // statt auf den Meeresboden zu sinken. Das angehobene Uferband gewinnt weiterhin, weil max()
  // jeden Boden behält, der über die Wasserlinie hinausragt.
  const groundY=(x,z)=>{
    const h=floorY(x,z);
    return isWater(x,z)?Math.max(h,WATER_LEVEL):Math.max(h,0);
  };
  var waterMesh=null;// THREE.Water-Meeresoberfläche, in buildScene() erzeugt, in renderLoop() animiert
  var waterPrevT=0;// letzter Zeitstempel der Wellenanimation (ms), 0 = noch kein Frame gesehen
  var waterTouched=false;// die Drohne liegt bereits auf dem Meer (nur eine Spritzmeldung pro Tauchgang)
  // Neustart der Szene (neuer Kurs): wird in buildScene() angelegt, weil es die
  // Bau-Funktionen der Szene braucht; die Steuerung ruft es auf (Klick auf die
  // Erfolgsmeldung und Wechsel zwischen Parcours und Training).
  var resetScene=null;
  function buildScene(){
    // Ziel-Canvas holen und dessen Breite/Höhe auslesen
    let can=document.getElementById('can');
    let w = 600;// Breite (Canvas-Pixel)
    let h = 600;// Höhe (Canvas-Pixel)

    // ==== WELT =================================================================
    // Alles, was die Umgebung ausmacht: Szene, Kamera, Renderer, Himmel, Licht,
    // Wolken, Materialien, Grundgeometrien, Gelände und Wasser.
    // ===========================================================================
    //■ Szene (Container für alle 3D-Objekte)
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xccddff);

    //■ Kamera
    //THREE.PerspectiveCamera( Sichtfeld (Grad), Seitenverhältnis, nahste Entfernung, fernste Entfernung );
    // far = 2 x HORIZON_R: die Kamera (max. Abstand 4000, siehe setupControls) sieht auch
    // die Kuppel-Hinterseite (Abstand + Kuppelradius) noch vollständig vor der far-Plane
    camera = new THREE.PerspectiveCamera(25, w/h, 1, HORIZON_R*2);
    camera.position.set(0, 100, 150);// Startposition der Kamera setzen
    //camera.rotation.set(0,8,0);// Kameradrehung auf (0,0,0) Grad - auskommentiert, die Kamera blickt per lookAt()
    camera.lookAt(new THREE.Vector3(0, 0, 0));// Kamera auf den Ursprung (0,0,0) ausrichten
    scene.add(camera);// Kamera zur Szene hinzufügen (Pflicht bei FPV-Kameraführung)

    //■ Renderer (zeichnet die Szene auf das Canvas)
    renderer = new THREE.WebGLRenderer({canvas:can, antialias: true});// Kantenglättung (antialiasing) aktiviert
    renderer.setSize(w, h);
    // Schattenkarten aktivieren
    renderer.shadowMap.enabled = true;
    //renderer.setClearColor(0x000000, 1);// Hintergrundfarbe - auskommentiert, scene.background (siehe oben) liefert das Hellblau hinter dem Himmel

    //■ Himmel: sky.jpg als Textur auf einer Halbkugel (statt Sky.js)
    // sky.jpg ist ein 2:1-Equirect-Panorama (1200x600): obere Bildhälfte = Himmel
    // von Zenit bis Horizont, untere Bildhälfte = Wasserspiegelung. Auf der Halbkugel
    // (theta 0..90°) wird nur die obere Hälfte gezeigt:
    //   * Kugel-uv.y läuft von 1 (Zenit, theta=0) bis 0 (Rand der Kalotte, theta=90°)
    //   * Bild-v (flipY) = 1 ist die Bildoberkante (Zenit), 0.5 die Bildmitte (Horizont)
    //   * offset.y=0.5 + repeat.y=0.5 bildet Zenit->1 und Horizont->0.5 ab, dazwischen
    //     läuft es linear - also exakt die equirectwinkeltreue Projektion
    //   * u=0..1 spannt die volle Kugelrunde (360°), wrapS=RepeatWRapping verhindert
    //     einen Nahtstich am Schnitt u=0/1 (Rückseite der Kugel)
    let skyTex=new THREE.TextureLoader().load('sky.jpg');
    skyTex.wrapS=THREE.RepeatWrapping;
    skyTex.offset.set(0,0.5);
    skyTex.repeat.set(1,0.5);
    // Halbkugel mit Radius HORIZON_R, FEST auf dem Ursprung (konzentrisch zur Bodenscheibe,
    // Kalottenkante auf y=0 = Bodenniveau): Kuppel und Boden teilen die Horizontkante
    // (GROUND_SPOKES = gleiche Winkelteilung wie die Bodenscheibe, damit die Facetten
    // der beiden Kanten deckungsgleich verlaufen). thetaLength reicht 30 Einheiten (~0.2°)
    // unter den Horizont: dieser Saum fängt alle Blickstrahl ab, die zwischen der
    // Kuppelkante (y=0) und der tiefer liegenden Wasserkante (y=-2.5) hindurchgehen -
    // ohne ihn blitzte am Horizont eine hauchdünne Linie von scene.background durch.
    let skyGeo=new THREE.SphereGeometry(HORIZON_R,GROUND_SPOKES,32,0,Math.PI*2,
                                        0,Math.PI/2+Math.asin(30/HORIZON_R));
    let skyMat=new THREE.MeshBasicMaterial({
      map:skyTex,
      side:THREE.BackSide,   // von INNEN sichtbar - die Betrachter stehen in der Kugel
      fog:false,
      depthWrite:false       // rein hintergrund: kein Tiefenwert, nichts kann dahinter liegen
    });
    sky=new THREE.Mesh(skyGeo,skyMat);
    sky.renderOrder=-1;// zuerst zeichnen, dann decken alle Objekte die Kuppel korrekt ab
    scene.add(sky);

    //■ Kumulus-Wolken (prozedurale Alphatextur auf kamera-zuwendenden Sprites)
    // Als DataTexture statt über eine 2D-Leinwand gebaut: Safari kann eine erst spät
    // gerasterte Canvas als Müllbytes (Farbrauschen) hochladen, Rohpixeldaten sind sicher.
    function makeCloudTexture(){
      const size=256;
      const data=new Uint8Array(size*size*4);
      // Lappen im Sprite-Raum: v = 0 ist der UNTERE Wolkenrand, v = 1 der obere
      const lobes=[[0.50,0.38,0.30],[0.30,0.36,0.20],[0.70,0.36,0.20],
                   [0.40,0.53,0.22],[0.60,0.54,0.19],[0.50,0.65,0.15],
                   [0.22,0.44,0.13],[0.78,0.44,0.13]];
      for(let py=0;py<size;py++){
        const v=(py+0.5)/size;
        for(let px=0;px<size;px++){
          const u=(px+0.5)/size;
          let a=0;
          for(let i=0;i<lobes.length;i++){
            const dx=(u-lobes[i][0])/lobes[i][2];
            const dy=(v-lobes[i][1])/lobes[i][2];
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d<1){
              // gleiche Alphakurve wie die alten radialen Canvas-Verläufe:
              // 0,95 im Kern, 0,70 bei 55 % des Radius, 0 am Rand
              const t=d<0.55 ? (0.95+(0.70-0.95)*(d/0.55))
                             : (0.70*(1-(d-0.55)/0.45));
              a=t+a*(1-t);// source-over: die Lappen verschmelzen zu einer Wolkenmasse
            }
          }
          // Kumulus haben eine flache Unterseite: unter v = 0,336 ausblenden (bei v = 0,078 weg)
          if(v<0.336){
            let t=(v-0.078)/0.258;
            if(t<0){t=0;}
            if(t>1){t=1;}
            t=t*t*(3-2*t);
            a*=t;
          }
          const o=(py*size+px)*4;
          data[o]=255; data[o+1]=255; data[o+2]=255;
          data[o+3]=(a*255)|0;
        }
      }
      const tex=new THREE.DataTexture(data,size,size,THREE.RGBAFormat);
      tex.flipY=false;// Daten stehen von unten nach oben im Speicher, kein vertikaler Flip nötig
      tex.minFilter=THREE.LinearFilter;// weiche Kanten (DataTexture nutzt sonst Nearest-Filterung)
      tex.magFilter=THREE.LinearFilter;
      tex.generateMipmaps=false;
      tex.wrapS=THREE.ClampToEdgeWrapping;
      tex.wrapT=THREE.ClampToEdgeWrapping;
      tex.needsUpdate=true;
      return tex;
    }
    let cloudTex=makeCloudTexture();
    clouds=new THREE.Group;// global, damit renderLoop die Gruppe driftet (wie drone/drone1..4)
    blinkStart=0;// globaler Startzeitpunkt für das Blinken von Rück-/Frontlicht
    let cloudData=[[-2600, 750,-5200,1400],[ 1800,1050,-6400,1200],[-900,1500,-7800,1700],
                   [ 3400,1250,-4300,1100],[-4200,1000,-3600,1300],[  700, 700,-3100, 900],
                   [ 4800,1600,-7200,1600],[-2000,1900,-8800,1500],[ 2500, 850, 3800,1200],
                   [-3300,1150, 5000,1400],[ 1000,1400, 6800,1300],[-5400, 950, -900,1100],
                   [ 5400,1300, 1600,1250]];
    for(let i=0;i<cloudData.length;i++){
      let d=cloudData[i];
      let sp=new THREE.Sprite(new THREE.SpriteMaterial({
        map:cloudTex, transparent:true, opacity:0.9, depthWrite:false, color:0xffffff
      }));
      sp.position.set(d[0],d[1],d[2]);
      sp.scale.set(d[3],d[3]*0.5,1);// Kumulus sind breiter als sie hoch sind
      clouds.add(sp);
    }
    scene.add(clouds);

    //■ Lichtquellen ------------------------------------------------
    // Umgebungslicht (Licht auf jedes Objekt aus jeder Richtung), damit unbeleuchtete Flächen nie schwarz werden
    // bewusst schwach gehalten: je weniger Fülllicht, desto stärker der Hell-Dunkel-Relief des Geländes
    var AmbientLight=new THREE.AmbientLight(0xffffff,0.10);
    scene.add( AmbientLight );// Umgebungslicht zur Szene hinzufügen

    // Scheinwerfer direkt von oben (Farbe, Intensität, Reichweite, Winkel, Weichzeichnung[0-1], Abfall[1,1])
    // wirkt als weiches Oberlicht, damit die Drohne direkt darunter ihren Schatten behält
    const spotLight=new THREE.SpotLight(0xffffff, 1.1, 4000,Math.PI/40, 0.8, 0.8);
    spotLight.position.set(0,3000,0);
    spotLight.target.position.set(0,0,0);
    spotLight.castShadow=true;// Schattenwurf aktivieren
    spotLight.shadow.mapSize.width = 4096;  // feinere Schatten: 4096x4096 Schattenkarte
    spotLight.shadow.mapSize.height = 4096; // feinere Schatten: 8192 (Alternative, hier nicht verwendet)
    spotLight.shadow.radius=1;  // Schatten weichzeichnen (shadow.radius)
    scene.add(spotLight);
    scene.add(spotLight.target);

    // flach streifende "Sonne" von links: trifft das Gelände unter flachem Winkel (~12°), daher werden
    // lichtzugewandte Hänge hell und abgewandte Hänge dunkel -> starker Relief
    const sunLight=new THREE.DirectionalLight(0xfff3e0, 3.2);
    sunLight.position.set(-1500,329,380);
    sunLight.target.position.set(0,0,0);
    sunLight.castShadow=true;// Gelände und Drohne werfen Schatten auf den Boden
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left=-750;   // Schattenkamera deckt den gesamten Spielbereich ab (der
                                        // Rand der Bodenscheibe bleibt absichtlich ohne Schatten)
    sunLight.shadow.camera.right=750;
    sunLight.shadow.camera.top=750;
    sunLight.shadow.camera.bottom=-750;
    sunLight.shadow.camera.near=100;
    sunLight.shadow.camera.far=3000;
    sunLight.shadow.bias=-0.0004;       // verhindert Schatten-Artefakte (Acne) auf dem Boden
    sunLight.shadow.normalBias=1.0;     // verhindert Selbstschatten-Streifen auf sanften Hängen
    sunLight.shadow.radius=1;
    scene.add(sunLight);
    scene.add(sunLight.target);
    
    // Punktlicht (auskommentiert)                    Farbe    Intensität Reichweite Abfall
    //light = new THREE.PointLight( 0xffffff, 0.1, 4, 2 );// nicht verwendet
    //scene.add( light );// nicht verwendet


    //■ Materialien
    // durchsichtig (weiß, Deckkraft 0,3)
    let mt1=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,transparent:true,opacity:0.3
    });
    // blau
    let mt2=new THREE.MeshLambertMaterial({
      color:0x0022cc,side:THREE.FrontSide
    });
    // rot
    let mt3=new THREE.MeshBasicMaterial({
      color:0xff3333, 
      side:THREE.FrontSide
    });
    // Landeplatz-Fläche: texturiert mit landing.png
    // (das Bild hat einen Alphakanal -> transparente Stellen zeigen den Boden darunter)
    let padTexture=new THREE.TextureLoader().load('landing.png');
    let mt4=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      map:padTexture,
      transparent:true,// Alphakanal von landing.png beachten
      alphaTest:0.1,   // vollständig transparente Pixel werden verworfen -> keine Sortier-Artefakte
    });
    // blau
    let mt5=new THREE.MeshBasicMaterial({
      color:0x6666ff, 
      side:THREE.FrontSide
    });
    // Boden
    let floorTexture=new THREE.TextureLoader().load('flag_g.jpg');// JPEG 512x512: 152 KB statt 2,5 MB als PNG
    floorTexture.wrapS=THREE.RepeatWrapping;
    floorTexture.wrapT=THREE.RepeatWrapping;
    // angeben, wie oft sich die Textur wiederholt
    floorTexture.repeat.set(8,8);
    // Anisotropie: an der flachen Horizontsicht wird die Textur über sehr spitze Winkel
    // abgetastet - mit 16-facher Anisotropie bleibt der Boden dort deutlich schärfer
    // (statt streifig weichgezeichneten Fernbändern)
    floorTexture.anisotropy=16;
    let mt6=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      map:floorTexture,
    });
    // weiß
    let mt7=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,transparent:false,opacity:1.0
    });
    // grau -> Stahl: bläulicher Schimmer, damit die Drohne sich vom Boden abhebt
    // (Phong statt Lambert: nur Phong kennt den Glanzpunkt für den Metalllook)
    let mt8=new THREE.MeshPhongMaterial({
      color:0x9fb9dd, specular:0xc2d8f7, shininess:48, side:THREE.FrontSide
    });
    // dunkelgrau -> hellgrauer Kunststoff (matt, nur schwacher Schimmer)
    let mt9=new THREE.MeshPhongMaterial({
      color:0xd2d5da, specular:0x666666, shininess:10, side:THREE.FrontSide
    });
    // Deckel: die Marienkäfer-Zeichnung auf dem Rumpf
    // (deckel.png hat einen Alphakanal -> die Bildecken bleiben offen)
    let deckelTexture=new THREE.TextureLoader().load('deckel.png');
    let mt10=new THREE.MeshLambertMaterial({
      color:0xffffff, side:THREE.FrontSide,
      map:deckelTexture,
      transparent:true,// Alphakanal von deckel.png beachten
      alphaTest:0.1,   // vollständig transparente Pixel werden verworfen -> keine Sortier-Artefakte
    });
    // glänzend schwarz: Landebeine und Propellerblätter, wie Beine und Fühler eines Marienkäfers
    // (Phong: schwarze Streuung + starker, enger Glanzpunkt = nasser Glanz)
    let mt11=new THREE.MeshPhongMaterial({
      color:0x0a0a0a, specular:0x9a9a9a, shininess:70, side:THREE.FrontSide
    });


    // Quader-Grundgeometrie (Einheitswürfel 1x1x1, wird skaliert)
    let bg=new THREE.BoxGeometry(1,1,1);
    // Kugel-Grundgeometrie (vollständig)
    let sg =new THREE.SphereGeometry(0.5,16,16,0,      Math.PI,  0,Math.PI);
    // Kugel-Grundgeometrie (nur Halbkugel)
    let sg2=new THREE.SphereGeometry(0.5,16,16,Math.PI,Math.PI*2,0,Math.PI);
    // Flächen-Grundgeometrie (Einheitsquadrat 1x1)
    let pg=new THREE.PlaneGeometry(1,1,1,1);
    // Zylinder-Grundgeometrie (Einheitszylinder)
    let cg=new THREE.CylinderGeometry(1,1,1,32,1,false,0,Math.PI*2);

    // abgerundeter Kasten: jeder Vertex, der weniger als r von einer Kante oder Ecke entfernt liegt, wird auf
    // die umgebende Zylinder-/Kugelfläche Radius r gezogen -> leicht abgerundete Kanten
    function rbox(w,h,d,r){
      const hx=w/2, hy=h/2, hz=d/2;
      const ix=hx-r, iy=hy-r, iz=hz-r;
      // fein genug unterteilen, damit der Rundungsstreifen eigene Vertices bekommt
      const seg=v=>Math.max(2, Math.min(40, Math.ceil(v/(2*r))));
      const g=new THREE.BoxGeometry(w,h,d,seg(w),seg(h),seg(d));
      const p=new THREE.Vector3(), q=new THREE.Vector3(), nv=new THREE.Vector3();
      const pos=g.attributes.position, nor=g.attributes.normal;
      for(let i=0;i<pos.count;i++){
        p.fromBufferAttribute(pos,i);
        q.set(Math.min(ix,Math.max(-ix,p.x)), Math.min(iy,Math.max(-iy,p.y)), Math.min(iz,Math.max(-iz,p.z)));
        nv.copy(p).sub(q);
        if(nv.lengthSq()>1e-12){
          nv.normalize();
          pos.setXYZ(i, q.x+nv.x*r, q.y+nv.y*r, q.z+nv.z*r);
          nor.setXYZ(i, nv.x, nv.y, nv.z);
        }
      }
      pos.needsUpdate=true;
      nor.needsUpdate=true;
      return g;
    }

    // abgerundeter Zylinder: das Profil (Radius gegenüber Höhe) bekommt am
    // oberen und unteren Rand einen Bogen statt einer scharfen 90°-Kante, dann wird es um Y gedreht
    function rcyl(R,h,r,seg){
      r=Math.min(r, R*0.9, h*0.45);
      const pts=[];
      const add=(x,y)=>{
        const p=pts[pts.length-1];
        if(!p || Math.abs(p.x-x)>1e-9 || Math.abs(p.y-y)>1e-9) pts.push(new THREE.Vector2(x,y));
      };
      const arc=(cx,cy,a0,a1,n)=>{
        for(let i=0;i<=n;i++){
          const a=a0+(a1-a0)*i/n;
          add(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
        }
      };
      add(0,-h/2);            // Unterdeckel (Mitte -> Kante)
      add(R-r,-h/2);
      arc(R-r,-h/2+r, -Math.PI/2, 0, 6);   // abgerundeter Unterrand
      add(R, h/2-r);          // gerader Zylindermantel
      arc(R-r, h/2-r, 0, Math.PI/2, 6);    // abgerundeter Oberrand
      add(0, h/2);            // Oberdeckel (Kante -> Mitte)
      return new THREE.LatheGeometry(pts, seg);
    }
    //let planeGeometry=new THREE.PlaneGeometry(0.1, 0.1, 1, 1);// Altbestand, unbenutzt
    //let sphereGeometry =new THREE.SphereGeometry(0.05,16,16,0,2*Math.PI);// Altbestand, unbenutzt

    // Boden: KREISSCHEIBE statt Quadrat (1000x1000) - die runde Außenkante liegt auf
    // Radius GROUND_R exakt auf der Himmelkuppel, dadurch trifft der Boden nahtlos auf
    // den Himmel (siehe HORIZON_R im Kopfbereich). Aufbau als Speiche-Raster: alle Ringe
    // teilen dieselben GROUND_SPOKES-Winkel, dadurch gibt es zwischen den Ringen keine
    // Risse (geteilte Vertices) und die Außenkante ist ein gleichmäßiges 256-Eck.
    // Ringradien: innen so dicht wie das alte Gitter (6.25), ab 600 grob anwachsend -
    // das Fernfeld ist nur noch sanft gewellt (die Feinoaktaven blendet terrainHeightAt() dort aus).
    const groundRadii=[0];
    for(let rr=6.25;rr<596;rr+=6.25) groundRadii.push(rr);
    for(let rr=600;rr<GROUND_R;rr=Math.min(rr*1.045+2,GROUND_R)) groundRadii.push(rr);
    // ^^ endet, sobald GROUND_R erreicht ist (Math.min erzwingt den exakten Endwert, kein Doppelring)
    const gRings=groundRadii.length;
    const gVerts=gRings*GROUND_SPOKES;
    const gPos=new Float32Array(gVerts*3);// Positionen; die Z-Höhe füllt buildTerrain()
    const gUV=new Float32Array(gVerts*2);
    const gIdx=[];
    for(let ri=0;ri<gRings;ri++){
      const rad=groundRadii[ri];
      for(let si=0;si<GROUND_SPOKES;si++){
        const a=si/GROUND_SPOKES*Math.PI*2;
        const px=Math.cos(a)*rad, py=Math.sin(a)*rad;// lokale XY, py = -Welt-z (Mesh wird um x um -90° gedreht)
        const v=ri*GROUND_SPOKES+si;
        gPos[v*3]=px; gPos[v*3+1]=py; gPos[v*3+2]=0;
        // UV-Formel identisch zur alten PlaneGeometry(1000,1000) -> gleiche Kachelstellung
        // von flag_g.jpg, jenseits von ±500 läuft sie per RepeatWrapping einfach weiter
        gUV[v*2]=(px+500)/1000; gUV[v*2+1]=(py+500)/1000;
      }
    }
    for(let ri=0;ri<gRings-1;ri++){
      for(let si=0;si<GROUND_SPOKES;si++){
        const s2=(si+1)%GROUND_SPOKES;
        const a=ri*GROUND_SPOKES+si, b=ri*GROUND_SPOKES+s2;
        const c=(ri+1)*GROUND_SPOKES+si, d=(ri+1)*GROUND_SPOKES+s2;
        // Quad von Ring ri nach ri+1, GEGEN den Uhrzeigersinn von lokal +Z (oben) aus
        // gesehen: a->c->d + a->d->b -> FrontSide zeigt nach oben, wenn das Mesh wie
        // früher um x um -90° gedreht liegt. Ring 0 ist der Mittelpunkt, dort degeneriert
        // das zweite Dreieck auf einen Punkt - harmlos, der Mittelpunkt bekommt seinen
        // Normalvektor vom ersten Dreieck
        gIdx.push(a,c,d, a,d,b);
      }
    }
    let fpg=new THREE.BufferGeometry();
    fpg.setAttribute('position',new THREE.BufferAttribute(gPos,3));
    fpg.setAttribute('uv',new THREE.BufferAttribute(gUV,2));
    fpg.setIndex(gIdx);

    // deterministisches pseudo-zufälliges Werterauschen (Ganzzahl-Hash + weiche bilineare Interpolation).
    // Keine Textur und nichts animiert: das Feld wird unten einmal pro Vertex ausgewertet, daher kostet
    // das unregelmäßige Gelände zur Laufzeit nichts.
    const hash2=(ix,iy)=>{
      let n=(Math.imul(ix,374761393)^Math.imul(iy,668265263))|0;
      n=Math.imul(n^(n>>>13),1274126177);
      return ((n^(n>>>16))>>>0)/4294967295;// Ergebnisbereich 0..1
    };
    const vnoise=(x,y,cell)=>{
      const fx=x/cell, fy=y/cell;
      const ix=Math.floor(fx), iy=Math.floor(fy);
      const sx=fx-ix, sy=fy-iy;
      const ux=sx*sx*(3-2*sx), uy=sy*sy*(3-2*sy);// Smoothstep -> weiche Nähte, keine Gitterlinien
      const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
      return (a+(b-a)*ux)*(1-uy)+(c+(d-c)*ux)*uy;// Ergebnisbereich 0..1
    };

    // Geländehöhe (ROHwert, ohne den Mesh-Versatz -1) an Weltposition (wx,wz):
    // dieselbe Formel wie früher pro Gittervertex, aber als REINE Funktion auswertbar -
    // Kreisscheibe und floorY() werten sie damit exakt identisch aus (vorher bilinear
    // über das Gitter interpoliert). Innerhalb r <= 500 rechnet alles unverändert wie
    // bisher; das neue Fernfeld jenseits blendet die beiden Feinoaktaven aus, damit
    // weit draußen keine Einzelfeatures flimmern.
    const terrainHeightAt=(wx,wz)=>{
      const x=wx, y=-wz;// lokale Baum-Ebene wie im alten Gitter (y = -Welt-z)
      // volles Höhengitter: drei Oktaven des Werterauschens -> breite Wellen, mittlere Beulen und Mulden
      // plus feine Unregelmäßigkeiten, alles in unregelmäßigen Formen (statt der geraden Sinusstreifen zuvor)
      const o1=(vnoise(x,   y,    170)-0.5)*1.5;  // breite, unregelmäßige Wellenzüge
      const o2=(vnoise(x+812,y-371, 64)-0.5)*0.85;// mittlere Beulen und Mulden
      const o3=(vnoise(x-255,y+693, 26)-0.5)*0.3; // feine Unregelmäßigkeiten (Vertex-Abstand)
      const r=Math.sqrt(x*x+y*y);
      // Detailabblendung: ab 500 (alte Gittergrenze) sanft auf 1500 auf 0 ausblenden
      let df=Math.min(Math.max((r-500)/1000,0),1);
      df=df*df*(3-2*df);
      let h=o1+(o2+o3)*(1-df);
      h=Math.max(-1,Math.min(1,h));// Erhöhungen auf +1 begrenzt: der Boden kommt nie über y = 0
      // die Umgebung von Landeplatz 1 vollkommen flach halten (r < 30, ab r >= 100 voll)
      let fade=Math.min(Math.max((r-30)/70,0),1);
      fade=fade*fade*(3-2*fade);
      // Mulden werden um den Faktor 6 vertieft -> starker Hell-Dunkel-Relief schon durch die streifende Sonne
      let zz=(h>0 ? h : h*6)*fade;
      // ---- Küste: im Wasserbereich wird die verformte Höhe durch das Meeresprofil ersetzt.
      // Das Uferband (bis zu 40 Einheiten LANDSEITIG der Küste) wird knapp über die
      // Wasserlinie angehoben - sonst könnte ein trockenes Tal direkt am Ufer unter den Meeresspiegel sinken
      // und die Wasserfläche würde in der Luft enden. Ab der Wasserlinie läuft der Boden
      // weich zum unregelmäßigen Meeresboden ab; Streifen UND beide Buchten bekommen dadurch ein
      // natürliches, schräges Ufer statt einer Klippe. (Außerhalb von -40 bleibt das Rauschen unberührt.)
      // Die Formel ist in -z-Richtung unbegrenzt - das Meer läuft so bis zum Scheibenrand.
      const d=coastZ(x)-wz;// >0: im Meeresbereich, Abstand hinter der Küstenlinie
      if(d>-40){
        const base=Math.max(zz,WATER_LEVEL+0.3);// trockenes Ufer: mindestens 0,3 über dem Wasser
        if(d<=0){
          zz=base;
        }else{
          let t=Math.min(d/30,1); t=t*t*(3-2*t);// Smoothstep-Rampe -> weicher Uferübergang
          zz=base+((WATER_SEABED+h*0.5)-base)*t;// Meeresboden folgt dem Rauschen etwas
        }
      }
      // Boden unter dem 2. Landeplatz abflachen (innerhalb 25 flach, bis 55 auslaufend),
      // derselbe Gedanke wie die flache Scheibe um Platz 1 im Ursprung
      const dx=x-pad2.x, dy=y-(-pad2.z);
      const r2=Math.sqrt(dx*dx+dy*dy);
      if(r2<55){
        let f2=Math.min(Math.max((r2-25)/30,0),1);
        f2=f2*f2*(3-2*f2);
        zz=zz*f2;// die verformte Höhe wieder auf 0 zurückziehen
      }
      return zz;
    };

    // Kreisscheibe mit terrainHeightAt()-Höhen befüllen (die Geometrie samt Topologie
    // liegt bereits an). Von resetScene() erneut aufgerufen, wenn ein neuer Platz 2
    // und damit neues Gelände gewürfelt wurde - dieselben Vertex-Positionen bleiben,
    // nur die Z-Werte und die Normalen werden neu berechnet.
    const buildTerrain=()=>{
      const pos=fpg.attributes.position;
      for(let i=0;i<pos.count;i++){
        // lokale y-Ebene ist um x um -90° gedreht -> Welt-z = -y
        pos.setZ(i, terrainHeightAt(pos.getX(i), -pos.getY(i)));
      }
      fpg.computeVertexNormals();
      pos.needsUpdate=true;
      fpg.attributes.normal.needsUpdate=true;
    };

    // 2. Landeplatz: zufällige Richtung und Entfernung (140-260 Einheiten von Platz 1) - wird
    // von resetScene() neu gewürfelt, sodass jeder neue Kurs woanders endet.
    // Der gesamte Kurskorridor muss TROCKEN sein: ein Streifen von +/-75 Einheiten um die Sehne
    // (die Bézier-Bögen streifen maximal ~60 Einheiten seitwärts, siehe courseCurve) wird gegen die
    // Küstenlinie geprüft, denn Platz 2, die Routenlinie und die Ringpfosten dürfen
    // nie im Meer landen - der Kurs muss auf dem Land sichtbar bleiben.
    const corridorDry=(x0,z0,x1,z1,margin)=>{
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)||1;
      const nx=-dz/len, nz=dx/len;// Einheitsvektor senkrecht zur Sehne
      for(let i=0;i<=24;i++){
        const t=i/24;
        for(let s=-2;s<=2;s++){
          const px=x0+dx*t+nx*margin*0.5*s, pz=z0+dz*t+nz*margin*0.5*s;
          if(isWater(px,pz)) return false;
        }
      }
      return true;
    };
    const newPad2=()=>{
      for(let k=0;k<400;k++){
        const pad2Angle=Math.random()*Math.PI*2;
        const pad2Dist=140+Math.random()*120;
        const x=Math.cos(pad2Angle)*pad2Dist, z=Math.sin(pad2Angle)*pad2Dist;
        if(corridorDry(0,0,x,z,75)){ pad2.x=x; pad2.z=z; return; }
      }
      // praktisch unmögliche Rückfalllösung (400 Würfel abgelehnt): gerade LANDSEITIG (+z),
      // was immer trocken ist - die Küstenlinie reicht nie weiter als bis z = -57
      pad2.x=0; pad2.z=230;
    };
    newPad2();
    buildTerrain();
    let m0=new THREE.Mesh(fpg,mt6);
    m0.rotation.set(-Math.PI/2,0,0);
    m0.castShadow=true;// das Gelände wirft selbst Schatten in seine eigenen Mulden (Relief)
    m0.receiveShadow=true;
    m0.position.set(0,-1,0);
    scene.add(m0);

    // Geländehöhe an einer Welt-x/z-Position: die rote Routenlinie, die Ringpfosten und die
    // Bodenkollision in renderLoop() werden damit platziert/messen. Zugewiesen wird der
    // GLOBALE floorY (renderLoop braucht ihn). Kein Gitter mehr: die reine Funktion
    // terrainHeightAt() ist überALL gültig - auch weit außerhalb der alten 1000x1000-Fläche,
    // also bis zum Scheibenrand GROUND_R.
    floorY=(wx,wz)=>-1+terrainHeightAt(wx,wz);// das Boden-Mesh liegt auf y = -1

    // ---- Meer: die Wasserfläche der Landschaftsänderung. Das Polygon folgt der
    // Küstenlinie (beide Buchten enthalten) bis zum RAND DER KREISSCHEIBE - das Meer läuft
    // bis zum Horizont (Nutzerentscheidung), seine Außenkante liegt exakt auf dem Bodenrand
    // GROUND_R -> nahtloser Übergang von Wasser zu Himmel. Die Fläche existiert genau dort,
    // wo isWater() das Meer angibt. ShapeGeometry lebt in ihrer eigenen XY-Ebene
    // -> shapeY = -worldZ; gedreht wird das MESH (nicht die Geometrie), denn
    // THREE.Water leitet seine Spiegelebene aus der lokalen +Z-Achse des Meshes ab.
    {
      const shape=new THREE.Shape();
      const Xc=Math.sqrt(GROUND_R*GROUND_R-COAST_Z*COAST_Z);// x, an dem die gerade Küste
      // (außerhalb von ±300 gilt überall COAST_Z) den Scheibenrand berührt: Xc²+COAST_Z²=R²
      const NS=2400;// Küste im Abstand von ~6.7 Einheiten abgetastet (auch die Buchten fein)
      shape.moveTo(-Xc,-coastZ(-Xc));// Beginn der Küstenlinie, westliches Ende (liegt auf dem Rand)
      for(let i=1;i<=NS;i++){
        const x=-Xc+2*Xc*i/NS;
        shape.lineTo(x,-coastZ(x));// die Küstenlinie (Buchten enthalten) nach Osten ablaufen
      }
      // Rückweg zum Westende: Bogen entlang des Scheibenrands über die Südseite
      // (shapeY = -Welt-z -> der südliche Rand liegt bei shapeY = +GROUND_R)
      const yEnd=-coastZ(Xc);// shapeY des östlichen Endpunkts (im Westen exakt derselbe Wert)
      const a0=Math.atan2(yEnd,Xc);// Winkel des Ostendpunkts in der Shape-Ebene (~1,2°)
      const a1=Math.PI-a0;// Westende = Spiegelung an der y-Achse bei gleichem Radius
      const NA=180;// Sehnenabweichung des Bogens ~0.7 Einheiten auf 8000 -> unterpixelgroß
      for(let i=1;i<=NA;i++){
        const a=a0+(a1-a0)*i/NA;
        shape.lineTo(Math.cos(a)*GROUND_R, Math.sin(a)*GROUND_R);// landet exakt auf dem Westende
      }
      const wgeo=new THREE.ShapeGeometry(shape);
      const waterNormals=new THREE.TextureLoader().load('Water_2_M_Normal.jpg');
      waterNormals.wrapS=waterNormals.wrapT=THREE.RepeatWrapping;// Wellen wandern über das Meer (Textur-Wiederholung)
      waterMesh=new THREE.Water(wgeo,{
        textureWidth:512,
        textureHeight:512,
        waterNormals:waterNormals,
        // Sonnenrichtung für Glanz und Spiegelung: leicht von links oben (passend zum hellen
        // Himmel in sky.jpg), damit Wasserglanz und Himmel zusammenpassen
        sunDirection:new THREE.Vector3(10000,30000,-40000).normalize(),
        sunColor:0xffffff,
        waterColor:0x1b4a5e,// tiefes Blaugrün statt des grauen Standardwerts
        distortionScale:3.0,// Wellenverzerrung der Spiegelung (Standard 20 wäre zu wild)
        fog:false
      });
      waterMesh.rotation.x=-Math.PI/2;// lokale +Z-Achse (Spiegelnormale) zeigt in der Welt nach oben
      waterMesh.position.y=WATER_LEVEL-1;// Terrain-Einheiten -> Welt (Bodenfläche liegt auf -1)
      waterMesh.name='water';
      scene.add(waterMesh);
    }

    // ==== OBJEKTE ===============================================================
    // Alles, was auf der Welt steht: beide Landeplatten, die rote Kurslinie,
    // die Ringe mit Pfosten, das Kurslicht und die Drohne.
    // ===========================================================================
    m0=new THREE.Mesh(pg,mt4);
    m0.rotation.set(-Math.PI/2,0,0);
    //m0.castShadow=true;// Schattenwurf des Landeplatzes bewusst aus (er liegt flach am Boden)
    m0.receiveShadow=true;
    m0.scale.set(30,29.3,1);// 50 % größer als zuvor, Proportionen des 980x957-Bildes beibehalten
    m0.position.set(0,0,0);
    scene.add(m0);

    // ---- 2. Landeplatz: gleiche landing.png-Platte, an der oben gewürfelten Position platziert
    let pad2Mesh=new THREE.Mesh(pg,mt4);
    pad2Mesh.rotation.set(-Math.PI/2,0,0);
    pad2Mesh.receiveShadow=true;
    pad2Mesh.scale.set(30,29.3,1);// genau dieselbe Größe wie Platz 1
    pad2Mesh.position.set(pad2.x,0,pad2.z);
    pad2Mesh.name="pad2";
    scene.add(pad2Mesh);

    // ---- Kurs: eine stückweise kubische Bézier-Schlange von Platz 1 (Ursprung) zu Platz 2. Die Sehne
    // wird in 3-4 Abschnitte geteilt; jeder Abschnitt biegt auf EINE Seite aus (beide Hilfspunkte
    // liegen auf derselben Seite) und die Seite wechselt von Abschnitt zu Abschnitt -> eine Schlange, die
    // die gerade Linie immer wieder kreuzt. Die Endtangente von Abschnitt k ist identisch mit
    // der Anfangstangente von Abschnitt k+1, die Kette bleibt also perfekt glatt (G1-stetig).
    // Bogenamplitude und Seite werden von buildRouteLine() mit jedem neuen Kurs neu gewürfelt,
    // kein Start gleicht dem anderen.
    let routeCurve=null;// aktueller Bézier-Pfad (x/z-Ebene), mit jedem Kurs neu gebaut
    const courseCurve=()=>{
      const len=Math.hypot(pad2.x,pad2.z);
      const ux=pad2.x/len, uz=pad2.z/len;// Einheitsvektor entlang der Sehne
      const nx=-uz, nz=ux;// Einheitsvektor senkrecht dazu
      const nSeg=(len>190&&Math.random()<0.7)?4:3;// 3 oder 4 Bögen -> Schlange mit 2-3 Richtungswechseln
      const L=len/nSeg;// Länge der Sehne eines Abschnitts
      const h=L*0.3;// Hilfspunkt-Länge entlang der Sehne (Tangentialstetigkeit)
      let side=(Math.random()<0.5)?-1:1;
      const path=new THREE.CurvePath();
      for(let k=0;k<nSeg;k++){
        const off=side*L*(0.35+Math.random()*0.35);// Bogen: 0,35..0,7 eines Abschnitts, keine Schlingen
        const x0=ux*L*k, z0=uz*L*k;
        const x1=ux*L*(k+1), z1=uz*L*(k+1);
        path.add(new THREE.CubicBezierCurve3(
          new THREE.Vector3(x0,0,z0),
          new THREE.Vector3(x0+ux*h+nx*off,0,z0+uz*h+nz*off),
          new THREE.Vector3(x1-ux*h+nx*off,0,z1-uz*h+nz*off),
          new THREE.Vector3(x1,0,z1)));
        side=-side;// nächster Bogen zur anderen Seite -> Schlange
      }
      routeCurve=path;
    };
    // rote Routenlinie für den aktuellen Kurs bauen: die Bézier-Kurve oben abtasten und
    // am Gelände entlangführen (Höhe aus dem Bodengitter gelesen), denn die gebogene Route
    // kreuzt auch Mulden, in denen eine Linie in fester Höhe schweben oder versinken würde.
    // Wird erneut von resetScene() aufgerufen; die alte Geometrie wird freigegeben, damit
    // wiederholte Neustarts kein GPU-Speicher verlieren. (MeshBasicMaterial -> die Linie bleibt ganz rot, was auch immer das Licht tut)
    const buildRouteLine=()=>{
      const old=scene.getObjectByName('pathLine');
      if(old){ scene.remove(old); old.geometry.dispose(); }
      courseCurve();// eine neue Bézier-Kurve für diesen Kurs würfeln
      const len=Math.hypot(pad2.x,pad2.z);
      const nSeg=Math.max(64,Math.round(len/2));// die Schlange krümmt sich viel stärker als das alte S
      const linePts=[];
      for(let i=0;i<=nSeg;i++){
        const p=routeCurve.getPoint(i/nSeg);
        linePts.push(new THREE.Vector3(p.x, floorY(p.x,p.z)+0.35, p.z));
      }
      const lineCurve=new THREE.CatmullRomCurve3(linePts);
      const pathLine=new THREE.Mesh(new THREE.TubeGeometry(lineCurve, nSeg, 0.35, 6, false), mt3);
      pathLine.name="pathLine";
      scene.add(pathLine);
    };
    buildRouteLine();

    // drei farbige Ringe auf Pfosten unterschiedlicher Höhe, EXAKT auf dem Kurs stehend:
    // jeder Ring sitzt bei 25 % / 50 % / 75 % der aktuellen Bézier-Schlange (gleichmäßig entlang der Bogenlänge),
    // sein Pfosten wächst dort aus dem Gelände und die Ringebene wird
    // senkrecht zur Kursrichtung gedreht, damit die Drohne gerade hindurchfliegen kann.
    // Ringgröße: die innere Öffnung ist 150 % der Drohne (Rotorspannweite ~28 Einheiten) ->
    // Mittenradius 22,5 mit 1,5 starkem Rohr = Innendurchmesser 42 = 1,5 x 28.
    // Pfoshöhen werden für jeden Ring und jeden Kurs neu gewürfelt; zusammen mit der neuen
    // Kurve ändert das den ganzen Slalom mit jedem Start (resetScene gibt die alte
    // Gruppe frei, kein GPU-Leck). Jeder Ring und Pfosten wird zusätzlich in die globale Hindernisliste
    // eingetragen, die renderLoop() auf Kollisionen prüft.
    const ringMats=[
      // bernstein, grün, pink - alle drei heben sich vor hellem Himmel und dunklem Boden ab
      new THREE.MeshStandardMaterial({color:0xfbbf24,roughness:0.35,metalness:0.05,emissive:0xfbbf24,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0x1c6136,roughness:0.35,metalness:0.05,emissive:0x4ade80,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0xd03100,roughness:0.35,metalness:0.05,emissive:0xf472b6,emissiveIntensity:0.25})
    ];
    const postMat=new THREE.MeshStandardMaterial({color:0x334155,roughness:0.55,metalness:0.6});
    const buildRings=()=>{
      const old=scene.getObjectByName('ringGroup');
      if(old){ scene.remove(old); old.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
      obstacles=[];// frische Kollisionsliste für den neuen Kurs (global, von renderLoop gelesen)
      // Trainingsmodus: einfacher Flug von Platz 1 zu Platz 2 - keine Ringe, keine Pfosten. Die leere
      // Hindernisliste schaltet schon die Kollisionsprüfung und den Durchflugzähler von renderLoop ab
      // (beide hängen hinter `if(obstacles.length)` bzw. hinter der Schleife über die Liste).
      if(courseMode==='training'){ updateRingBadge(); return; }
      const g=new THREE.Group(); g.name='ringGroup';
      const R=22.5, TUBE=1.5;// Innenöffnung 42 = 150 % der ~28 breiten Drohne
      const tList=[0.25,0.5,0.75];
      for(let i=0;i<3;i++){
        const p=routeCurve.getPoint(tList[i]);
        const tan=routeCurve.getTangent(tList[i]);
        const fy=floorY(p.x,p.z);
        const postH=6+Math.random()*10;// 6..16, für jeden Ring und jeden Kurs anders
        const post=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.2,postH,10),postMat);
        post.position.set(p.x, fy+postH/2, p.z);// steht auf dem Gelände
        post.castShadow=true;
        const ring=new THREE.Mesh(new THREE.TorusGeometry(R,TUBE,12,64),ringMats[i]);
        ring.position.set(p.x, fy+postH+R, p.z);// der Pfosten reicht bis zur Unterkante des Rings
        // der Torus liegt in seiner XY-Ebene (Achse = lokales z) -> diese Achse auf den Kurs drehen
        ring.rotation.y=Math.atan2(tan.x,tan.z);
        ring.castShadow=true;
        g.add(post); g.add(ring);
        // Kollisionsformen: der Ring als Mittellinienkreis, der Pfosten als vertikales Segment
        obstacles.push({kind:'ring', x:p.x, y:fy+postH+R, z:p.z, R:R, tube:TUBE,
                        ax:tan.x, ay:0, az:tan.z});
        obstacles.push({kind:'post', x:p.x, z:p.z, y0:fy, y1:fy+postH, r:1.2});
      }
      scene.add(g);
    };
    buildRings();

    // Kurslicht: ein breiter, weicher, schattenloser Scheinwerfer über der Mitte des Kurses, damit
    // die gesamte Strecke zwischen Platz 1 und Platz 2 gleichmäßig beleuchtet wird
    const pathLight=new THREE.SpotLight(0xffffff, 0.9, 4000, 0.5, 0.5, 0.8);
    pathLight.name="pathLight";// bewusst ohne Schatten: es ist eine Füllbeleuchtung für die Route
    scene.add(pathLight);
    scene.add(pathLight.target);
    const aimPathLight=()=>{
      // auf die Mitte des GEBOGENEN Kurses zielen (nicht auf die Sehne) und den Kegel weit
      // genug öffnen, um den fernsten Punkt der S-Kurve zu erreichen
      const mid=routeCurve.getPoint(0.5);
      let maxR=0;
      for(let i=0;i<=16;i++){// die Schlange streift weiter aus als das alte einzelne S
        const p=routeCurve.getPoint(i/16);
        maxR=Math.max(maxR,Math.hypot(p.x,p.z));
      }
      const H=maxR*0.9+50;
      pathLight.position.set(mid.x, H, mid.z);
      pathLight.target.position.set(mid.x, 0, mid.z);
      pathLight.target.updateMatrixWorld();
      pathLight.angle=Math.atan((maxR+45)/H);// Winkel aus dem fernsten Kurspunkt -> alles beleuchtet
    };
    aimPathLight();
    

    // Drohnengruppe (Wurzel aller Drohenteile)
    drone=new THREE.Group;
    // Drehreihenfolge: Rollen (Z) und Nicken (X) um die eigenen Achsen der Drohne, Gieren (Y) um die
    // Welt-Hochachse. Mit der Vorgabe 'XYZ' würde das Nicken ZULETZT angewendet, also um die
    // Welt-x-Achse: die Nase würde sich im Raum immer gleich einklappen (z.B. Heck runter, wenn
    // man auf die Kamera zufliegt, oder ein sichtbares Rollen statt des Nickens entlang von x)
    // anstatt in Flugrichtung einzutauchen.
    drone.rotation.order='YXZ';
    drone.castShadow=true;
    drone.receiveShadow=true;
    // Marienkäfer-Rumpf: die Körperkontur wird aus deckel.png abgelesen statt aus einem
    // einfachen Zylinder. deckelOutline hält 90 Radialabstände (in Bildpixeln, gemessen vom
    // Alpha-Schwerpunkt des 411x431-Bildes, über ~20° kreisförmig geglättet, damit die Striche
    // die Kontur nicht wellen: Index i = Winkel i*4°, 0° = Bilddes rechts,
    // 90° = Bildunten, 270° = Bildoben = der Kopf = die Nase der Drohne (-z).
    const deckelOutline=[204.05,204.64,205.23,205.91,206.82,207.59,208.09,208.64,209.18,209.68,
      210.09,210.59,211,211.5,211.82,212.14,212.32,212.55,212.68,212.64,212.55,212.36,212.36,
      212.32,212.36,212.55,212.91,212.91,212.68,212.41,212.09,211.73,211.36,211.05,210.45,
      209.95,209.45,209,208.45,208,207.68,207.09,206.5,205.95,205.45,204.82,204.32,203.91,
      203.36,202.59,201.91,201.36,201,200.55,201,201.55,203.05,204.95,207.41,209.77,212.05,
      213.91,215.32,216.45,217.23,217.68,217.86,217.91,217.73,217.5,217.09,216.64,215.86,215,
      214,212.64,211.14,209.14,206.73,204.64,203,201.77,201.18,200.91,201.41,201.91,202.41,
      202.91,203.32,203.64];
    // Bildpixel -> Welteinheiten: der längste Radius (Kopfspitze, 217,91 px) wird zu 4,7,
    // damit der flache Deckel zum alten Scheibenradius passt und der Mantel (den die Fase
    // 0,3 weiter nach außen schiebt) genau 5,0 in der Breite erreicht - gleiche Größe wie der alte
    // abgerundete Zylinder (Radius 5, Höhe 2).
    const dk=4.7/Math.max.apply(null,deckelOutline);
    const deckPts=deckelOutline.map(function(r,i){
      const a=i/deckelOutline.length*Math.PI*2;
      // Bild (x rechts, y unten) -> Form (x, -y): nach rotateX(-PI/2) ist die Bildoberseite
      // (Kopf) bei -z, also der Nase der Drohne zugekehrt
      return new THREE.Vector2(r*Math.cos(a)*dk, -r*Math.sin(a)*dk);
    });
    const deckShape=new THREE.Shape(deckPts);
    // extrudierte Hülle: Tiefe 1,4 + 2 x bevelThickness 0,3 = Höhe 2, bevelSize 0,3 rundet
    // den Rand ab (obere/untere Kante laufen nach innen ein, der breiteste Ring sitzt auf halber Höhe)
    const bodyGeo=new THREE.ExtrudeGeometry(deckShape,
      {depth:1.4,bevelEnabled:true,bevelThickness:0.3,bevelSize:0.3,bevelSegments:4,steps:1,curveSegments:1});
    bodyGeo.rotateX(-Math.PI/2);
    bodyGeo.translate(0,-0.7,0);// die Fase bringt oben und unten 0,3 dazu -> Körper auf y=0 zentrieren
    md0=new THREE.Mesh(bodyGeo,mt8);
    md0.castShadow=true;
    //md0.receiveShadow=true;// Rumpf nimmt keine Schatten an (bewusst aus)
    md0.position.set(0,4,0);// reicht über y 3..5 wie der alte Zylinder
    drone.add(md0);

    // weiches Shading für die extrudierte Hülle: ExtrudeGeometry ist nicht indexiert, daher hat jede
    // Kopie einer gemeinsamen Ecke (Mantel, Fase, Deckelrand) ihre eigene Normale. Mantel- und Fasen-
    // Kopien widersprachen sich -> harte vertikale Streifen an den Flanken. Stattdessen EINE flächengewichtete
    // Normale je eindeutiger Vertexposition berechnen: die Flanken schatten gleichmäßig, der Rand bekommt
    // einen weichen, runden Glanz (die Deckelflächen behalten 0,1,0 im Inneren).
    (function(){
      const pa=bodyGeo.attributes.position, na=bodyGeo.attributes.normal;
      const acc={}, A=new THREE.Vector3(), B=new THREE.Vector3(), C=new THREE.Vector3(),
            e1=new THREE.Vector3(), e2=new THREE.Vector3(), fn=new THREE.Vector3();
      for(let t=0;t<pa.count;t+=3){// Flächennormale jedes Dreiecks aufsummieren
        A.fromBufferAttribute(pa,t); B.fromBufferAttribute(pa,t+1); C.fromBufferAttribute(pa,t+2);
        fn.crossVectors(e1.subVectors(B,A), e2.subVectors(C,A));
        for(let k=0;k<3;k++){
          const key=pa.getX(t+k).toFixed(4)+'|'+pa.getY(t+k).toFixed(4)+'|'+pa.getZ(t+k).toFixed(4);
          const v=acc[key]||(acc[key]=new THREE.Vector3());
          v.add(fn);
        }
      }
      const vkey=function(i){ return pa.getX(i).toFixed(4)+'|'+pa.getY(i).toFixed(4)+'|'+pa.getZ(i).toFixed(4); };
      for(let i=0;i<pa.count;i++){
        const v=acc[vkey(i)];
        if(v && v.lengthSq()>1e-12){ v.normalize(); na.setXYZ(i,v.x,v.y,v.z); }
      }
      na.needsUpdate=true;
    })();

    // Deckelfläche des Rumpfes: dieselbe abgetastete Kontur als flacher Deckel mit
    // deckel.png, 0,01 über dem Rumpfdeckel (y = 5,0) gelegt, damit die beiden nie z-fighten.
    // ShapeGeometry speichert die Rohkoordinaten als UVs; sie werden hier neu geschrieben:
    // u = Bild-x / 411, v = 1 - Bild-y / 431 (v gespiegelt -> Bildoben = v 1 = Nasenseite),
    // Bildpx = Schwerpunkt + Formkoordinate / dk
    const deckGeo=new THREE.ShapeGeometry(deckShape);
    {
      const dp=deckGeo.attributes.position, duv=deckGeo.attributes.uv;
      for(let i=0;i<dp.count;i++){
        duv.setXY(i, (206.84+dp.getX(i)/dk)/411, 1-(218.75-dp.getY(i)/dk)/431);
      }
      duv.needsUpdate=true;
    }
    let md0deck=new THREE.Mesh(deckGeo, mt10);
    md0deck.rotation.x=-Math.PI/2;// flach hinlegen, die Bildoberseite zeigt zur Nase (-z)
    md0deck.position.set(0,5.01,0);
    drone.add(md0deck);

    // Trägerstreben der Rotoren aus Quadergeometrie erzeugen
    md1=new THREE.Mesh(bg,mt8);
    md1.castShadow=true;
    //md1.receiveShadow=true;// Schattenannahme der Drohnteile bewusst aus
    md1.scale.set(20,1,1);
    md1.position.set(0, 4.5, 0);
    md1.rotation.set(0,Math.PI*0.25,0);
    drone.add(md1);
    // Trägerstreben der Rotoren aus Quadergeometrie erzeugen
    md2=new THREE.Mesh(bg,mt8);
    md2.castShadow=true;
    //md2.receiveShadow=true;// Schattenannahme der Drohnteile bewusst aus
    md2.scale.set(20,1,1);
    md2.position.set(0, 4.5, 0);
    md2.rotation.set(0,-Math.PI*0.25,0);
    drone.add(md2);

    // kleines blaues Markierungs-Mesh für die Vorderseite erzeugen
    md3=new THREE.Mesh(bg,mt5);
    md3.position.set(0,4,-5);
    drone.add(md3);
    // kleines rotes Markierungs-Mesh für die Hinterseite erzeugen
    md4=new THREE.Mesh(bg,mt3);
    md4.position.set(0,4,5);
    drone.add(md4);

    // zwei Fühler an der Vorderseite des Marienkäferkopfes: glänzend schwarze konische Stäbe mit
    // rundem Knauf, nach vorn, oben und leicht nach außen geneigt
    // (die Basis sitzt in der Kopfhülle, damit der Stab ohne Lücke herausragt)
    [-1,1].forEach(function(side,ix){
      const base=new THREE.Vector3(side*1.0,4.5,-4.4);
      const dir=new THREE.Vector3(side*0.3,0.45,-0.84).normalize();
      const len=2.4;
      const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.14,len,10),mt11);
      rod.name=(side<0?"antennaL":"antennaR");
      rod.position.copy(base).addScaledVector(dir,len/2);// Mitte des Stabs
      rod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
      rod.castShadow=true;
      drone.add(rod);
      const club=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,10),mt11);
      club.name=(side<0?"antennaLTip":"antennaRTip");
      club.position.copy(base).addScaledVector(dir,len);// Kugel an der Stabspitze
      club.castShadow=true;
      drone.add(club);
    });

    // Landebeine aus Quadergeometrie erzeugen (glänzend schwarz, wie Marienkäferbeine)
    md5=new THREE.Mesh(bg,mt11);
    md5.castShadow=true;
    md5.receiveShadow=true;
    md5.scale.set(10,0.5,0.5);
    md5.position.set(-3,0.25,0);
    md5.rotation.set(0,Math.PI/2,0);
    drone.add(md5);
    // weiteres Landebein aus Quadergeometrie erzeugen
    md6=new THREE.Mesh(bg,mt11);
    md6.castShadow=true;
    md6.receiveShadow=true;
    md6.scale.set(10,0.5,0.5);
    md6.position.set(3,0.25,0);
    md6.rotation.set(0,Math.PI/2,0);
    drone.add(md6);
    // weiteres Landebein aus Quadergeometrie erzeugen
    md7=new THREE.Mesh(bg,mt11);
    md7.castShadow=true;
    md7.receiveShadow=true;
    md7.scale.set(3,0.5,0.5);
    md7.position.set(-3,1.5,0);
    md7.rotation.set(0,0,Math.PI/2);
    drone.add(md7);
    // weiteres Landebein aus Quadergeometrie erzeugen
    md8=new THREE.Mesh(bg,mt11);
    md8.castShadow=true;
    md8.receiveShadow=true;
    md8.scale.set(3,0.5,0.5);
    md8.position.set(3,1.5,0);
    md8.rotation.set(0,0,Math.PI/2);
    drone.add(md8);


    // Propellerblätter (Rotoren) aus Quadergeometrie erzeugen
    drone1=new THREE.Group;
    drone1.position.set(-7,5,-7);
    md11=new THREE.Mesh(bg,mt11);
    md11.castShadow=true;
    md11.receiveShadow=true;
    md11.scale.set(10,0.5,0.5);
    md11.rotation.set(0,Math.PI*0.5,0);
    drone1.add(md11);
    md12=new THREE.Mesh(bg,mt11);
    md12.castShadow=true;
    md12.receiveShadow=true;
    md12.scale.set(8,0.5,0.5);
    md12.rotation.set(0,Math.PI*0.0,0);
    drone1.add(md12);
    drone.add(drone1);
    // Propellerblätter (Rotoren) aus Quadergeometrie erzeugen
    drone2=new THREE.Group;
    drone2.position.set(-7,5,7);
    md21=new THREE.Mesh(bg,mt11);
    md21.castShadow=true;
    md21.receiveShadow=true;
    md21.scale.set(10,0.5,0.5);
    md21.rotation.set(0,Math.PI*0.5,0);
    drone2.add(md21);
    md22=new THREE.Mesh(bg,mt11);
    md22.castShadow=true;
    md22.receiveShadow=true;
    md22.scale.set(8,0.5,0.5);
    md22.rotation.set(0,Math.PI*0.0,0);
    drone2.add(md22);
    drone.add(drone2);
    // Propellerblätter (Rotoren) aus Quadergeometrie erzeugen
    drone3=new THREE.Group;
    drone3.position.set(7,5,7);
    md31=new THREE.Mesh(bg,mt11);
    md31.castShadow=true;
    md31.receiveShadow=true;
    md31.scale.set(10,0.5,0.5);
    md31.rotation.set(0,Math.PI*0.5,0);
    drone3.add(md31);
    md32=new THREE.Mesh(bg,mt11);
    md32.castShadow=true;
    md32.receiveShadow=true;
    md32.scale.set(8,0.5,0.5);
    md32.rotation.set(0,Math.PI*0.0,0);
    drone3.add(md32);
    drone.add(drone3);
    // Propellerblätter (Rotoren) aus Quadergeometrie erzeugen
    drone4=new THREE.Group;
    drone4.position.set(7,5,-7);
    md41=new THREE.Mesh(bg,mt11);
    md41.castShadow=true;
    md41.receiveShadow=true;
    md41.scale.set(10,0.5,0.5);
    md41.rotation.set(0,Math.PI*0.5,0);
    drone4.add(md41);
    md42=new THREE.Mesh(bg,mt11);
    md42.castShadow=true;
    md42.receiveShadow=true;
    md42.scale.set(8,0.5,0.5);
    md42.rotation.set(0,Math.PI*0.0,0);
    drone4.add(md42);
    drone.add(drone4);

    scene.add(drone);

    // Kanten der gesamten Drohne leicht abrunden: jedes Quader-Teil bekommt eigene Geometrie in
    // Endgröße (ein skaliertest abgerundeter Kasten würde den Radius in Längsrichtung verzerren)
    drone.traverse(function(o){
      if(o.isMesh && o.geometry && o.geometry.type==="BoxGeometry"){
        const sx=o.scale.x, sy=o.scale.y, sz=o.scale.z;
        o.geometry=rbox(sx,sy,sz, 0.15*Math.min(sx,sy,sz));
        o.scale.set(1,1,1);
      }
    });

    // Klick auf die Erfolgsmeldung: Szene zurücksetzen und einen ganz neuen Kurs würfeln
    // (Drohne zurück auf Platz 1, Kamera zurück auf die Startansicht, neuer zufälliger Platz 2 mit neuem
    // Gelände, neuer Routenlinie, neu ausgerichtetem Kurslicht, Erfolgsmeldung wieder ausgeblendet)
    resetScene=function(){
      held.clear(); pos.x=0; pos.y=0; pos.z=0;
      pos.vx=0; pos.vy=0; pos.vz=0; pos.turn=0;
      newPad2();
      buildTerrain();
      scene.getObjectByName('pad2').position.set(pad2.x,0,pad2.z);
      buildRouteLine();// neue Bézier-Schlange für die neue Platzposition
      buildRings();// neue Ringpositionen/-farben, Pfoshöhen neu gewürfelt + frische Hindernisse
      aimPathLight();
      successShown=false;
      document.getElementById('landedToast').classList.remove('show');
      document.getElementById('crashToast').classList.remove('show');// keine veraltete rote Meldung
      // neuer Kurs -> neue Ringe: der Durchflugzähler startet wieder bei null
      passedRings=[false,false,false];
      ringPrevSide=[null,null,null];
      ringPassCount=0;
      updateRingBadge();
      camera.position.set(0,100,150);// Standard-Startansicht
      controls.update();// die Kamera blickt auf die Drohne (= controls.target), also zurück auf Platz 1
    };
  }

</script>
