  <!-- ===================================================================== -->
  <!-- JS-Skript Teil 1: Aufbau der 3D-Szene                                -->
  <!--                                                                      -->
  <!-- Enthält alle three.js-Objekte in EINEM Abschnitt, in der            -->
  <!-- Reihenfolge:                                                         -->
  <!--   1. WELT    - Szene, Kamera, Renderer, Himmel, Licht,               -->
  <!--                Materialien, Grundgeometrien, Gelände und Wasser      -->
  <!--   2. OBJEKTE - beide Landeplatten, rote Kurslinie, Ringe mit         -->
  <!--                Pfosten, Kurslicht und die Drohne                      -->
  <!-- main() ruft zuerst buildScene() (dieser Block) und danach            -->
  <!-- setupControls() (Teil 2, Steuerung) auf.                             -->
  <!-- ===================================================================== -->
<script>
  let controls;
  let scene,camera,renderer;
  // Fehlerhaken des Renderer-Aufbaus: ohne WebGL kann buildScene() nicht
  // weiterlaufen - main() prüft diesen Flag und verzichtet dann auf Steuerung
  // und Frameschleife (die Meldung zeigt bereits showCrash()).
  let webglFehler=false;
  // ---- Globale Szenenobjekte: von buildScene() angelegt und von renderLoop()
  // (Bereich Steuerung) pro Frame benutzt - deshalb bewusst global deklariert.
  let drone;// Drohnengruppe (Gesamtkörper, in buildScene() angelegt)
  const rotoren=[];// die vier Rotorgruppen - renderLoop() dreht sie alle über diese Liste
  let md3,md4;// vorderes und heckseitiges Markierungslicht (in renderLoop blinkend)
  let blinkStart;// Startzeitpunkt des Lichtblinkens der Markierungen (siehe renderLoop)
  let sky;// Himmelkuppel (sky.jpg-Textur), fest auf dem Ursprung - siehe buildScene()
  let skyTex;// Textur der Kuppel; in renderLoop() um SKY_DEG_PER_SEC pro Sekunde gedreht
  let skyPrevT=0;// letzter Zeitstempel der Himmelsdrehung (ms), 0 = noch kein Frame gesehen
  // 2. Landeplatz: wird in buildScene() mit einer Zufallsposition (Welt-x/z) gefüllt
  const pad2={"x":0, "z":0};
  // ---- Horizont-Maße: EINE Zahl für Boden, Wasser UND Himmel -----------------
  // Bodenscheibe und Himmelkuppel teilen sich diesen Radius (konzentrisch auf dem
  // Ursprung, beide enden auf y=0). Dadurch trifft an der Horizontkante genau die
  // Bodenkante auf die Kuppelkante - von überall INNERHALB der Kugel trifft jeder
  // Blickstrahl ent Boden/Wasser oder Himmel, es bleibt keine Lücke (nahtlos).
  // Nachjustieren genügt hier - Scheibe, Kuppel, Wasser-Polygon, Kamera-Weit (far),
  // Zoom-Begrenzung und die Klemmen für Kamera und Drohne (CAM_R_MAX usw. unten)
  // ziehen automatisch mit.
  const HORIZON_R=500;// Radius der Himmelkuppel (Halbkugel) in Welteinheiten
  const SKY_DEG_PER_SEC=0.5;// Drehung des Himmels (sky.jpg) um die Kugelachse in Grad
  // pro Sekunde: 0,5° = eine Runde in 12 Minuten - ruhiger Wolkenzug, nahe an echten
  // Verhältnissen (~15 m/s Wind auf 3 km Höhe ≈ 0,3°/s). Die Wolken ziehen damit
  // sichtbar.
  const GROUND_R=HORIZON_R-4;// Bodenscheibe ragt 4 Einheiten über die Kugel hinaus - 
  // vermeidet seltsame Schatten bei den Wellen. Die Kuppel läuft als Saum 30 Einheiten unter y=0
  // weiter (thetaLength in buildScene), ein Blickstrahl an der Bodenkante muss also noch
  // über den Scheibenrand kommen; ohne hinterlegte Hintergrundfarbe würde eine solche
  // Lücke SCHWARZ durchblitzen. Ausgerechnet genügt die Marge, weil die
  // Kamera garantiert INNERHALB der Kugel und ÜBER dem Gelände geklemmt wird (CAM_R_MAX):
  // jeder abwärts gerichtete Strahl verlässt die Kugel erst unter y=-30 und schneidet
  // dabei das Bodenniveau bei einem Radius von höchstens HORIZON_R - die Scheibe auf
  // HORIZON_R+4 fängt ihn also immer auf, samt der ~0,04 Einheiten tiefen Facettenmitte
  // des 256-Ecks.
  const GROUND_SPOKES=256;// Speichen der Bodenscheibe (Ring-Übergänge teilen Vertices -> keine Risse)
  // ---- Klemmen für Kamera und Drohne: beide dürfen die Kuppel NICHT verlassen ----
  // Analog zur Boden-/Wasserbegrenzung der Drohne (groundY in renderLoop) gibt es
  // eine Wand und eine Decke - abgeleitet von HORIZON_R, damit die eine Zahl oben
  // weiterhin alles steuert.
  const CAM_R_MAX=HORIZON_R-5;// Kamera: größter 3D-Abstand vom Ursprung (x/y/z zusammen),
  // geklemmt in renderLoop NACH controls.update(). Die Orbit-Steuerung bestimmt weiterhin
  // Blick und Zoom, schiebt die Kamera aber nie über diesen Radius hinaus.
  const DRONE_R_MAX=HORIZON_R-100;// Drohne: zylindrische Wand um den Ursprung. Der Kurs
  // bleibt mit Platz 2 (max. 260), Bogen-Abschlägen (max. ~45) und Korridor (+/-75)
  // deutlich darunter, es gibt also keinen Fall, in dem die Klemme den Spielraum beschneidet.
  const DRONE_DOME_GAP=25;// Drohne: Abstand ihrer MITTE zur Kuppel unter der Decke. Groß
  // genug für die Deckeloberkante (5,0 über der Mitte) und den FPV-Kameraversatz (7,7),
  // damit die Ego-Kamera garantiert in der Kugel bleibt - selbst am äußersten Punkt.
  // Geländehöhe an einer Welt-x/z-Position: in buildScene() als Closure über das
  // Bodenhöhengitter angelegt und von der Routenlinie, den Ringpfosten sowie der
  // Bodenkollision in renderLoop() genutzt - bewusst global wie skyTex/sky.
  let floorY=null;// Geländehöhe an einer Welt-x/z-Position, in buildScene() angelegt
  // ---- Wasser: die Landschaftsänderung. Die Küstenlinie zieht sich ein Drittel vor
  // dem FERNEN Rand der Landschaft entlang (z = -167) und schneidet ZWEI
  // Buchten unterschiedlicher Größe ins Land; von der Küste läuft das Meer BIS ZUM SCHEIBENRAND
  // (Horizont, Nutzerentscheidung). Alle Werte sind in Terrain-Einheiten, also exakt den
  // Koordinaten, die floorY() liefert (das Boden-Mesh liegt selbst auf Welt-y = -1, daher wird
  // die Wasseroberfläche eine Einheit tiefer gerendert - siehe waterMesh.position.y in buildScene()).
  const COAST_Z=-167;// gerade Küstenlinie: Meer, wo z < coastZ(x); Land, wo z > coastZ(x)
  const WATER_LEVEL=-1.5;// Wasseroberfläche in Terrain-Einheiten (gerendert als Welt-y = WATER_LEVEL-1)
  const WATER_SEABED=-4.5;// Meeresboden in Terrain-Einheiten -> darüber 3 Einheiten Wassertiefe
  // weiche Bucht: 0 außerhalb von |x-cx| >= hw, `depth` in der Mitte, Kosinus-Übergang ohne Kanten
  const bayBump=(x,cx,hw,depth)=>{
    const dx=Math.abs(x-cx);
    if(dx>=hw) return 0;
    return depth*0.5*(1+Math.cos(Math.PI*dx/hw));
  };
  // Wertrausch für die unregelmäßige Küstenlinie: Hash über die Gitterstellen
  // (Sinus-Hash, typische Prozedural-Technik) mit kubisch geglätteter
  // Interpolation - EINMAL definiert, von terrainHeightAt(), dem Wasser-Polygon
  // und isWater() gemeinsam genutzt, damit Uferlinie, Wasserfläche und
  // Flugphysik exakt dieselbe Kante sehen
  const wertRausch1=(n)=>{
    const i=Math.floor(n),f=n-i,u=f*f*(3-2*f);
    const h=k=>{const s=Math.sin(k*127.1+311.7)*43758.5453;return s-Math.floor(s);};
    return h(i)+(h(i+1)-h(i))*u;// 0..1
  };
  // Unregelmäßigkeit der Küstenlinie: grob ±6,5 Einheiten (Wellenlänge ~22)
  // für langgezogene Vorsprünge, fein ±2 (Wellenlänge ~6) für Bucht-Zacken.
  // Bewusst EINDIMENSIONAL (nur x): die Küste ist die Funktion z=f(x) - eine
  // Störung in z-Richtung würde an den steilen Buchtflanken kippen
  const kuestenUnruhe=(x)=>
    (wertRausch1(x*0.045)-0.5)*13
    +(wertRausch1(x*0.16)-0.5)*4;
  // Küstenlinie der aktuellen Landschaft: die gerade Streifenkante plus die beiden Buchten, beide
  // INLAND geschnitten (nach +z): eine GROSSE Bucht im Westen (reicht bis z = -57) und eine deutlich
  // KLEINERE im Osten (reicht bis z = -112) - die Größen unterscheiden sich absichtlich.
  // kuestenUnruhe(x) beugt die mathematisch glatte Kosinus-Kurve zusätzlich um:
  // ohne den Zufallsanteil wäre die Uferlinie eine perfekte Kurve und wirke
  // am Saum unnatürlich glatt
  const coastZ=(x)=>
    COAST_Z
    +bayBump(x,-150,130,110)// große Bucht: Mündung 260 breit, 110 tief
    +bayBump(x, 170, 85, 55)// kleine Bucht: Mündung 170 breit, 55 tief
    +kuestenUnruhe(x);// organische Unruhe der Uferlinie (±8,5 Einheiten)
  // wahr, wo die Wasserfläche existiert - steuert das Aushöhlen des Geländes, die Flugphysik und
  // die Spritz-Meldung; Ufer, Wasser-Mesh und Kollision stimmen dadurch immer überein
  const isWater=(x,z)=>z<coastZ(x);
  // Bodenhöhe FÜR DIE FLUGPHYSIK: an Land das Gelände selbst (nie
  // unter 0), im Meeresbereich die WASSEROBERFLÄCHE - die Drohne ruht AUF dem Wasser
  // statt auf den Meeresboden zu sinken. Das angehobene Uferband gewinnt weiterhin, weil max()
  // jeden Boden behält, der über die Wasserlinie hinausragt. Das Land des
  // TerrainGenerator-Geländes ist POSITIV (Berge bis ~+16 Roh-Einheiten):
  // dann trägt diese Höhe die Drohne - sie folgt den Hügeln statt über ihnen
  // zu schweben; Mulden unter 0 hingegen bleiben bei der Physik bei 0.
  const groundY=(x,z)=>{
    const h=floorY(x,z);
    return isWater(x,z)?Math.max(h,WATER_LEVEL):Math.max(h,0);
  };
  let waterMesh=null;// THREE.Water-Meeresoberfläche, in buildScene() erzeugt, in renderLoop() animiert
  let waterPrevT=0;// letzter Zeitstempel der Wellenanimation (ms), 0 = noch kein Frame gesehen
  let waterTouched=false;// die Drohne liegt bereits auf dem Meer (nur eine Spritzmeldung pro Tauchgang)
  let treeGroup=null;// Baumgruppe der aktuellen Runde, in buildTrees() angelegt
  let treeWindMats=[];// Blattmaterialien mit Wind-Shader, renderLoop() schiebt uTime pro Frame nach
  let baumStellen=[];// Stellplätze der vier Bäume der laufenden Runde, von buildTrees() gefüllt
  // Neustart der Szene (neuer Kurs): wird in buildScene() angelegt, weil es die
  // Bau-Funktionen der Szene braucht; die Steuerung ruft es auf (Klick auf die
  // Erfolgsmeldung und Wechsel zwischen Parcours und Training).
  let resetScene=null;
  function buildScene(){
    // Ziel-Canvas holen und dessen Breite/Höhe auslesen
    let can=document.getElementById('can');
    let w = 600;// Breite (Canvas-Pixel)
    let h = 600;// Höhe (Canvas-Pixel)

    // ==== WELT =================================================================
    // Alles, was die Umgebung ausmacht: Szene, Kamera, Renderer, Himmel, Licht,
    // Materialien, Grundgeometrien, Gelände und Wasser.
    // ===========================================================================
    //■ Szene (Container für alle 3D-Objekte)
    // Es gibt bewusst KEINE hinterlegte Hintergrundfarbe: von INNERHALB der Kugel
    // trifft jeder Blickstrahl die Kuppel oder den Boden (siehe Horizont-Maße oben),
    // eine Farbe wäre nirgends zu sehen. Außerhalb der Kugel stünde sie dahinter -
    // aber Kamera und Drohne können die Kuppel nicht verlassen (Klemmen siehe oben).
    scene = new THREE.Scene();

    //■ Kamera
    //THREE.PerspectiveCamera( Sichtfeld (Grad), Seitenverhältnis, nahste Entfernung, fernste Entfernung );
    // far = 2 x HORIZON_R: die Kamera wird weltweit auf CAM_R_MAX = HORIZON_R-5 geklemmt
    // (siehe renderLoop) und sieht so selbst vom äußersten Punkt aus die gegenüberliegende
    // Kuppel-Hinterseite (CAM_R_MAX + HORIZON_R < 2 x HORIZON_R) vollständig vor der far-Plane
    camera = new THREE.PerspectiveCamera(25, w/h, 1, HORIZON_R*2);
    camera.position.set(0, 100, 150);// Startposition der Kamera setzen
    camera.lookAt(new THREE.Vector3(0, 0, 0));// Kamera auf den Ursprung (0,0,0) ausrichten
    scene.add(camera);// Kamera zur Szene hinzufügen (Pflicht bei FPV-Kameraführung)

    //■ Renderer (zeichnet die Szene auf das Canvas)
    // Kantenglättung (antialiasing) aktiviert. Der Renderer-Aufbau ist der
    // einzige Punkt, an dem die Seite ohne WebGL scheitert - deshalb in einem
    // try/catch: statt einer leeren Fläche erscheint eine verständliche
    // Meldung, und main() bricht nach dem Fehlerhaken ab (kein leerer
    // Animationslauf, keine Folgefehler in der Konsole).
    try{
      renderer = new THREE.WebGLRenderer({canvas:can, antialias: true});
    }catch(e){
      webglFehler=true;
      showCrash('Kein WebGL verfügbar! Die 3D-Ansicht kann nicht gestartet werden.'+
                (e&&e.message?' Grund: '+e.message:''));
      return;// Szenenaufbau abbrechen, main() prüft webglFehler
    }
    renderer.setSize(w, h);
    // Pixeldichte begrenzen: auf High-DPI-Anzeigen (dpr 2 oder 3) wird mit
    // höchstens dem Zweifachen gerendet. 2x macht Kanten und Texturdetails
    // scharf, ohne die Renderfläche wie bei 3x auf das Neunfache zu treiben -
    // das ist der übliche Kompromiss aus Schärfe und Bildrate.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    // Schattenkarten aktivieren
    renderer.shadowMap.enabled = true;

    //■ Himmel: sky.jpg als Textur auf einer Halbkugel
    // sky.jpg ist ein 2:1-Equirect-Panorama (1200x600): obere Bildhälfte = Himmel
    // von Zenit bis Horizont, untere Bildhälfte = Wasserspiegelung. Auf der Halbkugel
    // (theta 0..90°) wird nur die obere Hälfte gezeigt:
    //   * Kugel-uv.y läuft von 1 (Zenit, theta=0) bis 0 (Rand der Kalotte, theta=90°)
    //   * Bild-v (flipY) = 1 ist die Bildoberkante (Zenit), 0.5 die Bildmitte (Horizont)
    //   * offset.y=0.5 + repeat.y=0.5 bildet Zenit->1 und Horizont->0.5 ab, dazwischen
    //     läuft es linear - also exakt die equirectwinkeltreue Projektion
    //   * u=0..1 spannt die volle Kugelrunde (360°), wrapS=RepeatWRapping verhindert
    //     einen Nahtstich am Schnitt u=0/1 (Rückseite der Kugel)
    // skyTex ist GLOBALE (renderLoop() dreht sie pro Sekunde um SKY_DEG_PER_SEC, um
    // die Wolken des Panoramas ziehen zu lassen)
    skyTex=new THREE.TextureLoader().load('sky.jpg');
    skyTex.wrapS=THREE.RepeatWrapping;
    skyTex.offset.set(0,0.5);
    skyTex.repeat.set(1,0.5);
    // Halbkugel mit Radius HORIZON_R, FEST auf dem Ursprung (konzentrisch zur Bodenscheibe,
    // Kalottenkante auf y=0 = Bodenniveau): Kuppel und Boden teilen die Horizontkante
    // (GROUND_SPOKES = gleiche Winkelteilung wie die Bodenscheibe, damit die Facetten
    // der beiden Kanten deckungsgleich verlaufen). thetaLength reicht 30 Einheiten (~3,4°)
    // unter den Horizont: dieser Saum fängt alle Blickstrahl ab, die zwischen der
    // Kuppelkante (y=0) und der tiefer liegenden Wasserkante (y=-2.5) hindurchgehen -
    // ohne ihn blitzte am Horizont eine hauchdünne Linie durch (eine Lücke wäre SCHWARZ,
    // deshalb auch die 4 Einheiten Überstand der Bodenscheibe, siehe GROUND_R im
    // Kopfbereich).
    let skyGeo=new THREE.SphereGeometry(HORIZON_R,GROUND_SPOKES,32,0,Math.PI*2,
                                        0,Math.PI/2+Math.asin(30/HORIZON_R));
    let skyMat=new THREE.MeshBasicMaterial({
      map:skyTex,
      side:THREE.BackSide,   // von INNEN sichtbar - die Betrachter stehen in der Kugel
      fog:false,
      depthWrite:false       // rein hintergrund: kein Tiefenwert, nichts kann dahinter liegen
    });
    sky=new THREE.Mesh(skyGeo,skyMat);
    sky.renderOrder=-1;// zuerst zeichnen, dann decken alle Objekte die Kuppel korrekt ab
    scene.add(sky);

    blinkStart=0;// globaler Startzeitpunkt für das Blinken von Rück-/Frontlicht

    //■ Lichtquellen ------------------------------------------------
    // Umgebungslicht (Licht auf jedes Objekt aus jeder Richtung), damit unbeleuchtete Flächen nie schwarz werden
    // bewusst schwach gehalten: je weniger Fülllicht, desto stärker der Hell-Dunkel-Relief des Geländes
    const AmbientLight=new THREE.AmbientLight(0xffffff,0.6);
    scene.add( AmbientLight );// Umgebungslicht zur Szene hinzufügen

    // Scheinwerfer direkt von oben (Farbe, Intensität, Reichweite, Winkel, Weichzeichnung[0-1], Abfall[1,1])
    // wirkt als weiches Oberlicht, damit die Drohne direkt darunter ihren Schatten behält
    const spotLight=new THREE.SpotLight(0xffffff, 1.1, 4000,Math.PI/40, 0.8, 0.8);
    spotLight.position.set(0,3000,0);
    spotLight.target.position.set(0,0,0);
    spotLight.castShadow=true;// Schattenwurf aktivieren
    // Schattenkarte 2048x2048 (war 4096): der Spot wirft nur den Schatten der
    // Drohne und des Bodens unter ihr - bei der Kegelöffnung von PI/40 und der
    // Höhe 3000 deckt 2048 den gesamten Wirkbereich mit ~0,3 Einheiten pro
    // Texel ab (Spielbereich ~1000 Einheiten), doppelt so fein wie nötig.
    // Die Detailwirkung im Nahbereich kommt von der 2048er-Karte der Sonne.
    spotLight.shadow.mapSize.width = 2048;
    spotLight.shadow.mapSize.height = 2048; // dieselbe Höhe wie Breite (quadratische Karte)
    // Tiefenbereich der Schattenkamera straffen: die Sonne steht 3000 über
    // dem Ursprung, alle schattenwerfenden Objekte liegen zwischen 2200 und
    // 3600 davon entfernt (Bodenkante max. ~3040, Berge ~2560). Der bisherige
    // Default 0,5..5000 verbrauchte die Tiefenpräzision nutzlos - engerer
    // Bereich bedeutet weniger Schatten-Artefakte (Acne) bei gleichem Bias.
    spotLight.shadow.camera.near=2200;
    spotLight.shadow.camera.far=3600;
    spotLight.shadow.radius=1;  // Schatten weichzeichnen (shadow.radius)
    scene.add(spotLight);
    scene.add(spotLight.target);

    // flach streifende "Sonne" von links: trifft das Gelände unter flachem Winkel (~12°), daher werden
    // lichtzugewandte Hänge hell und abgewandte Hänge dunkel -> starker Relief
    const sunLight=new THREE.DirectionalLight(0xfff3e0, 3.2);
    sunLight.position.set(-1500,329,380);
    sunLight.target.position.set(0,0,0);
    sunLight.castShadow=true;// Gelände und Drohne werfen Schatten auf den Boden
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left=-750;   // Schattenkamera deckt den gesamten Spielbereich ab (der
                                        // Rand der Bodenscheibe bleibt absichtlich ohne Schatten)
    sunLight.shadow.camera.right=750;
    sunLight.shadow.camera.top=750;
    sunLight.shadow.camera.bottom=-750;
    sunLight.shadow.camera.near=100;
    sunLight.shadow.camera.far=3000;
    sunLight.shadow.bias=-0.0004;       // verhindert Schatten-Artefakte (Acne) auf dem Boden
    sunLight.shadow.normalBias=1.0;     // verhindert Selbstschatten-Streifen auf sanften Hängen
    sunLight.shadow.radius=1;
    scene.add(sunLight);
    scene.add(sunLight.target);
    
    //■ Materialien
    // rot
    let mt3=new THREE.MeshBasicMaterial({
      color:0xff3333, 
      side:THREE.FrontSide
    });
    // Landeplatz-Fläche: texturiert mit landing.png
    // (das Bild hat einen Alphakanal -> transparente Stellen zeigen den Boden darunter)
    let padTexture=new THREE.TextureLoader().load('landing.png');
    let mt4=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      map:padTexture,
      transparent:true,// Alphakanal von landing.png beachten
      alphaTest:0.1,   // vollständig transparente Pixel werden verworfen -> keine Sortier-Artefakte
    });
    // blau
    let mt5=new THREE.MeshBasicMaterial({
      color:0x6666ff, 
      side:THREE.FrontSide
    });
    // Boden: die Landschaft stammt aus dem TerrainGenerator (TerrainGenerator.js,
    // Port des three.js-Beispiels) und wird über VERTEX-FARBEN gefärbt (Wiese,
    // Wald, Fels, Schnee nach Höhe und Neigung, s. terrainGen.colorAt in
    // buildTerrain) - die alte Bodentextur flag_g.jpg samt Bumpmap gibt es nicht
    // mehr. DARAUF kommen jetzt zwei Texturen, die pro Vertex GEMISCHT werden:
    // wiese.jpg auf den tiefer liegenden grünen Zonen und felswand.jpg auf den
    // hellen Flächen. Die Trennung der beiden Flächenarten über die ERHEBUNG
    // (nicht über die Farbe - die mischt Fels schon zu früh ein, s.
    // terrainGen.colorAt): Die Mischung steckt im Attribut aBlend
    // (0 = wiese .. 1 = fels), das buildTerrain() aus colorAt().t schreibt; die
    // Vertex-Farben tinten beide Texturen weiterhin (helle Farbe -> Textur voll
    // sichtbar), die Beleuchtung bleibt normales Lambert.
    // DAZU kommt am Saum zwischen Wasser und Land ein schmaler, unregelmäßiger
    // Sandstreifen: sand.jpg (Sand mit eingestreuten Kieseln) wird im Shader
    // über eine Maske eingeblendet, die der Küstenlinie folgt (s. mt6 unten).
    let wieseTex=new THREE.TextureLoader().load('wiese.jpg');
    let felsTex=new THREE.TextureLoader().load('felswand.jpg');
    let sandTex=new THREE.TextureLoader().load('sand.jpg');
    for(const t of [wieseTex,felsTex,sandTex]){
      t.wrapS=t.wrapT=THREE.RepeatWrapping;// über die ganze Landschaft kacheln
      // Anisotropie wie früher flag_g.jpg: an der flachen Horizontsicht wird sehr
      // schräg abgetastet - 16-fach hält den Boden in der Ferne scharf
      t.anisotropy=16;
    }
    let mt6=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      vertexColors:true,// Farbbänder pro Vertex aus terrainGen.colorAt()
    });
    // ---- Dual-Texture-Erweiterung von mt6 (onBeforeCompile) -----------------
    // Planare UVs aus der lokalen XY-Ebene der Kreisscheibe (= Welt-x/z, denn
    // das Mesh liegt um -90° um x gedreht), je Textur eine eigene Kachelgröße.
    // Die Mischung mix(wiese, fels, aBlend) wird HINTER <color_fragment>
    // eingehängt, damit die Vertex-Farben zuerst greifen und die Texturen
    // multiplizieren - dort, wo colorAt Weiß (Schnee) liefert, erscheint also
    // die Felswand-Textur in voller Helligkeit.
    const KACHSEL_WIESE=1/66;// eine wiese.jpg-Kachel misst 66 Welteinheiten
    const KACHSEL_FELS=1/108;// felswand.jpg ist gröber: eine Kachel 108 Einheiten
    // sand.jpg dagegen fein: eine Kachel nur 9 Einheiten, damit die vier
    // Kieselsteine pro Kachel rund 1 Einheit groß bleiben (Drohne ~20 Einheiten)
    const KACHSEL_SAND=1/9;
    mt6.onBeforeCompile=(shader)=>{
      shader.uniforms.uWiese={value:wieseTex};
      shader.uniforms.uFels={value:felsTex};
      shader.uniforms.uSand={value:sandTex};
      shader.uniforms.uKw={value:KACHSEL_WIESE};
      shader.uniforms.uKf={value:KACHSEL_FELS};
      shader.uniforms.uKs={value:KACHSEL_SAND};
      // Küstenlinie und Wasseroberfläche als Weltgrößen für die Sandmaske:
      // uKueste = COAST_Z (Grundlinie der Bucht-Kurve), uWasser = Welt-y der
      // Wasseroberfläche (WATER_LEVEL-1, denn das Wasser-Mesh liegt auf
      // WATER_LEVEL-1 und das Gelände-Mesh auf y=-1)
      shader.uniforms.uKueste={value:COAST_Z};
      shader.uniforms.uWasser={value:WATER_LEVEL-1};
      shader.vertexShader=
        'attribute float aBlend;\n'+
        'varying float vBlend;\n'+
        'varying vec2 vUvW;\n'+
        'varying vec2 vUvF;\n'+
        'varying vec2 vUvSand;\n'+// planare UVs für den Sandstreifen
        'varying vec3 vWelt;\n'+// Weltposition der Gelände-Vertex (Küstenrechnung)
        'uniform float uKw;\n'+
        'uniform float uKf;\n'+
        'uniform float uKs;\n'+
        shader.vertexShader;
      shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\n'+
        '  vBlend=aBlend;\n'+
        '  vUvW=transformed.xy*uKw;\n'+// lokale XY = Welt-x/z (Mesh um -90° gedreht)
        '  vUvF=transformed.xy*uKf;\n'+
        '  vUvSand=transformed.xy*uKs;\n'+
        '  vWelt=(modelMatrix*vec4(transformed,1.0)).xyz;');
      shader.fragmentShader=
        'varying float vBlend;\n'+
        'varying vec2 vUvW;\n'+
        'varying vec2 vUvF;\n'+
        'varying vec2 vUvSand;\n'+
        'varying vec3 vWelt;\n'+
        'uniform sampler2D uWiese;\n'+
        'uniform sampler2D uFels;\n'+
        'uniform sampler2D uSand;\n'+
        'uniform float uKueste;\n'+
        'uniform float uWasser;\n'+
        // Küstenlinie: die Glatte Bucht-Kurve wie coastZ()/bayBump() im Skript
        // (OHNE kuestenUnruhe - die Geometrie-Störung steckt im Gelände selbst,
        // das Band hier nur braucht die Grundlage als Bezug); Land, wo
        // vWelt.z > sandKueste(x), Wasser darunter (Bucht-Ausbuchtungen inkl.)
        'float sandBump(float x,float cx,float hw,float depth){\n'+
        '  float dx=abs(x-cx);\n'+
        '  if(dx>=hw) return 0.0;\n'+
        '  return depth*0.5*(1.0+cos(3.14159265*dx/hw));\n'+
        '}\n'+
        'float sandKueste(float x){\n'+
        '  return uKueste+sandBump(x,-150.0,130.0,110.0)+sandBump(x,170.0,85.0,55.0);\n'+
        '}\n'+
        // Wertrausch für die unregelmäßige Streifenkante (zwei Oktaven,
        // damit weder gerade Linien noch gleichmäßige Wellen entstehen)
        'float sandHash(vec2 p){\n'+
        '  p=fract(p*vec2(123.34,456.21));\n'+
        '  p+=dot(p,p+45.32);\n'+
        '  return fract(p.x*p.y);\n'+
        '}\n'+
        'float sandNoise(vec2 p){\n'+
        '  vec2 i=floor(p),f=fract(p);\n'+
        '  f=f*f*(3.0-2.0*f);\n'+
        '  float a=sandHash(i),b=sandHash(i+vec2(1.0,0.0));\n'+
        '  float c=sandHash(i+vec2(0.0,1.0)),d=sandHash(i+vec2(1.0,1.0));\n'+
        '  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);\n'+
        '}\n'+
        shader.fragmentShader;
      shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',
        '#include <color_fragment>\n'+
        '  vec4 texW=texture2D(uWiese,vUvW);\n'+
        '  vec4 texF=texture2D(uFels,vUvF);\n'+
        // ---- Sandstreifen am Saum zwischen Wasser und Land ------------------
        // Abstand zur Küstenlinie: positiv = Landseite, negativ = See-Seite
        '  float kueste=vWelt.z-sandKueste(vWelt.x);\n'+
        // Landseite: Kante unregelmäßig verschieben (±8 Einheiten grob, ±2,5 fein)
        '  float wob=(sandNoise(vWelt.xz*0.09)-0.5)*16.0+(sandNoise(vWelt.xz*0.35)-0.5)*5.0;\n'+
        // See-Seite: die Sandgrenze liegt an der WASSERLINIE selbst statt an
        // einer festen Entferzung zur Küstenkurve. Die Geländefunktion würfelt
        // innerhalb der Wasserfläche Landzungen und Sandbänke heraus, die weit
        // von der analytischen Küstenlinie (sandKueste) entfernt liegen und
        // über eine reine kueste-Maske keinen Saum bekämen. Deshalb entscheidet
        // jetzt die HÖHE: alles bis uWasser+3 über dem Wasserspiegel ist Sand -
        // Hauptküste und Landzungen laufen über dieselbe Bedingung, ohne dass
        // die Maske eine zweite Geometrie kennen muss. Die waagerechte Grenze
        // (6..13+wob, unten) verhindert zugleich, dass flaches Binnenland zum
        // Sand wird. Kosten: ein glatter smoothstep; die verrauschte Kante
        // kanteW entfällt damit sogar - die Unruhe liefert jetzt die gewellte
        // Wasserlinie der Geometrie selbst.
        '  float zungen=1.0-smoothstep(uWasser+1.0,uWasser+3.0,vWelt.y);\n'+
        // Streifenband: Landseite über wob, See-/Höhenseite über zungen
        '  float streifen=(1.0-smoothstep(6.0+wob,13.0+wob,kueste))*zungen;\n'+
        '  float sandM=clamp(streifen,0.0,1.0);\n'+
        '  vec3 sandKol=texture2D(uSand,vUvSand).rgb;\n'+
        // Vertex-Farbe in der Sandzone entschärfen: colorAt liefert dort
        // Wiesen-/Felsfarben, die den Sand sonst grün oder grau tinten würden.
        // Auf 0,6 gedämpft: die Sonne steht mit Intensität 3,2 über dem Boden,
        // der helle Sand würde sonst wie Schnee ausbrennen (die Texturen der
        // Wiese und des Fels sind von Haus aus deutlich dunkler)
        '  vec3 sandFlaeche=sandKol*mix(vColor,vec3(0.6),sandM);\n'+
        '  diffuseColor.rgb=mix(diffuseColor.rgb*mix(texW.rgb,texF.rgb,clamp(vBlend,0.0,1.0)),sandFlaeche,sandM);');
    };
    // grau -> Stahl: bläulicher Schimmer, damit die Drohne sich vom Boden abhebt
    // (Phong statt Lambert: nur Phong kennt den Glanzpunkt für den Metalllook)
    let mt8=new THREE.MeshPhongMaterial({
      color:0x9fb9dd, specular:0xc2d8f7, shininess:48, side:THREE.FrontSide
    });
    // Deckel: die Marienkäfer-Zeichnung auf dem Rumpf
    // (deckel.png hat einen Alphakanal -> die Bildecken bleiben offen)
    let deckelTexture=new THREE.TextureLoader().load('deckel.png');
    let mt10=new THREE.MeshLambertMaterial({
      color:0xffffff, side:THREE.FrontSide,
      map:deckelTexture,
      transparent:true,// Alphakanal von deckel.png beachten
      alphaTest:0.1,   // vollständig transparente Pixel werden verworfen -> keine Sortier-Artefakte
    });
    // glänzend schwarz: Landebeine und Propellerblätter, wie Beine und Fühler eines Marienkäfers
    // (Phong: schwarze Streuung + starker, enger Glanzpunkt = nasser Glanz)
    let mt11=new THREE.MeshPhongMaterial({
      color:0x0a0a0a, specular:0x9a9a9a, shininess:70, side:THREE.FrontSide
    });


    // Quader-Grundgeometrie (Einheitswürfel 1x1x1, wird skaliert)
    let bg=new THREE.BoxGeometry(1,1,1);
    // Flächen-Grundgeometrie (Einheitsquadrat 1x1)
    let pg=new THREE.PlaneGeometry(1,1,1,1);

    // abgerundeter Kasten: jeder Vertex, der weniger als r von einer Kante oder Ecke entfernt liegt, wird auf
    // die umgebende Zylinder-/Kugelfläche Radius r gezogen -> leicht abgerundete Kanten
    function rbox(w,h,d,r){
      const hx=w/2, hy=h/2, hz=d/2;
      const ix=hx-r, iy=hy-r, iz=hz-r;
      // fein genug unterteilen, damit der Rundungsstreifen eigene Vertices bekommt
      const seg=v=>Math.max(2, Math.min(40, Math.ceil(v/(2*r))));
      const g=new THREE.BoxGeometry(w,h,d,seg(w),seg(h),seg(d));
      const p=new THREE.Vector3(), q=new THREE.Vector3(), nv=new THREE.Vector3();
      const pos=g.attributes.position, nor=g.attributes.normal;
      for(let i=0;i<pos.count;i++){
        p.fromBufferAttribute(pos,i);
        q.set(Math.min(ix,Math.max(-ix,p.x)), Math.min(iy,Math.max(-iy,p.y)), Math.min(iz,Math.max(-iz,p.z)));
        nv.copy(p).sub(q);
        if(nv.lengthSq()>1e-12){
          nv.normalize();
          pos.setXYZ(i, q.x+nv.x*r, q.y+nv.y*r, q.z+nv.z*r);
          nor.setXYZ(i, nv.x, nv.y, nv.z);
        }
      }
      pos.needsUpdate=true;
      nor.needsUpdate=true;
      return g;
    }

    // Boden: KREISSCHEIBE - die runde Außenkante liegt auf
    // Radius GROUND_R = HORIZON_R+4 knapp HINTER der Himmelkuppel, dadurch trifft der
    // Boden nahtlos auf den Himmel (siehe HORIZON_R im Kopfbereich, dort steht auch,
    // warum 4 Einheiten Überstand genügen). Aufbau als Speiche-Raster: alle Ringe
    // teilen dieselben GROUND_SPOKES-Winkel, dadurch gibt es zwischen den Ringen keine
    // Risse (geteilte Vertices) und die Außenkante ist ein gleichmäßiges 256-Eck.
    // Ringradien: innen fein mit 6,25-Einheiten-Schritt, erst ab 600 grob anwachsend
    // (das Fernfeld fällt ohnehin schon sanft zum Rand ab, weil terrainHeightAt()
    // erst ab 470 gegen 0 glättet - davor verstärkt er die Hügel sogar). Die Schwellen 596/600 hängen an GROUND_R: auf der
    // kleinen Scheibe würde eine feste Kette über ihren eigenen Rand hinausragen und
    // läge über dem Wasser-Polygon, das bei GROUND_R endet. Beide Zahlen hängen
    // deshalb an GROUND_R, und der exakte Außenrand kommt am Ende als eigener Ring dazu.
    const groundRadii=[0];
    for(let rr=6.25;rr<Math.min(596,GROUND_R);rr+=6.25) groundRadii.push(rr);
    for(let rr=Math.min(600,GROUND_R);rr<GROUND_R;rr=Math.min(rr*1.045+2,GROUND_R)) groundRadii.push(rr);
    // ^^ grobe Ringe nur, wenn GROUND_R überhaupt über 600 liegt; die Kette endet per
    //    Math.min exakt auf GROUND_R (kein Doppelring)
    if(groundRadii[groundRadii.length-1]<GROUND_R) groundRadii.push(GROUND_R);
    // ^^ exakter Außenrand, wenn die feine Kette vor GROUND_R endet (kleine Scheibe)
    const gRings=groundRadii.length;
    const gVerts=gRings*GROUND_SPOKES;
    const gPos=new Float32Array(gVerts*3);// Positionen; die Z-Höhe füllt buildTerrain()
    const gIdx=[];
    for(let ri=0;ri<gRings;ri++){
      const rad=groundRadii[ri];
      for(let si=0;si<GROUND_SPOKES;si++){
        const a=si/GROUND_SPOKES*Math.PI*2;
        const px=Math.cos(a)*rad, py=Math.sin(a)*rad;// lokale XY, py = -Welt-z (Mesh wird um x um -90° gedreht)
        const v=ri*GROUND_SPOKES+si;
        gPos[v*3]=px; gPos[v*3+1]=py; gPos[v*3+2]=0;
        // kein uv-Attribut nötig: die Texturen wiese.jpg/felswand.jpg werden im
        // Shader (mt6, onBeforeCompile) aus den Positionen planar abgetastet;
        // flag_g.jpg samt Normalmap ist abgelöst
      }
    }
    for(let ri=0;ri<gRings-1;ri++){
      for(let si=0;si<GROUND_SPOKES;si++){
        const s2=(si+1)%GROUND_SPOKES;
        const a=ri*GROUND_SPOKES+si, b=ri*GROUND_SPOKES+s2;
        const c=(ri+1)*GROUND_SPOKES+si, d=(ri+1)*GROUND_SPOKES+s2;
        // Quad von Ring ri nach ri+1, GEGEN den Uhrzeigersinn von lokal +Z (oben) aus
        // gesehen: a->c->d + a->d->b -> FrontSide zeigt nach oben, wenn das Mesh um
        // x um -90° gedreht liegt. Ring 0 ist der Mittelpunkt, dort degeneriert
        // das zweite Dreieck auf einen Punkt - harmlos, der Mittelpunkt bekommt seinen
        // Normalvektor vom ersten Dreieck
        gIdx.push(a,c,d, a,d,b);
      }
    }
    let fpg=new THREE.BufferGeometry();
    fpg.setAttribute('position',new THREE.BufferAttribute(gPos,3));
    fpg.setIndex(gIdx);

    // ---- Landschaft aus dem TerrainGenerator --------------------------------
    // TerrainGenerator.js ist der Port des three.js-Beispiels "TerrainGenerator"
    // (MIT, s. Dateikopf): domain-warptes, abgeleitungsgedämpftes Perlin-Rauschen
    // formt die Berggrate, thermische (Talus-)Erosion entschärft steile Hänge über
    // den Winkel der Ruhe. Das quadratische Feld wird gebacken (bake) und danach
    // bilinear abgetastet - Kreisscheibe, floorY(), Routenlinie, Ringpfosten,
    // Baumplätze und Flugphysik messen dadurch exakt dieselbe Höhe.
    // GEWÜRFELT: Der Seed ist bei JEDEM Laden zufällig, und resetScene() backt
    // das Feld mit frischem Seed neu - jede Seite und jeder neue Kurs zeigt also
    // eine andere Landschaft (gleiche Parameter, andere Täler und Grate). Die
    // Parameter selbst bleiben fest, damit Wasserlinie, Landeplätze und
    // Horizont-Verstärkung bei jedem Seed gleich zuverlässig greifen.
    // Parameter: Feld exakt über der Bodenscheibe (±GROUND_R), Zellgröße ~3,9
    // Einheiten (enger als der Ringschritt 6,25 der Scheibe), rohes Höhenband
    // ca. -9..+17 (Wasserlinie -1,5, Landeplätze 0), ein Bergfuß misst ~280
    // Einheiten über frequency.
    // Zufalls-Seed als uint32 (0 wird vom Generator auf 1 angehoben)
    const neuerSeed=()=>(Math.random()*4294967296)>>>0;
    const terrainGen=new TerrainGenerator({
      seed:neuerSeed(),// jede Seite startet mit einer anderen Landschaft
      size:GROUND_R*2,// quadratisches Feld über ±GROUND_R (504)
      segments:256,// Zellgröße 1008/256 = 3,94 Einheiten
      heightScale:26,// rohes Band mit seaLevel 0,35: ca. -9,1 .. +16,9
      frequency:0.0035,// Grundfuß eines Berges ~1/0,0035 Rausch-Einheiten
      octaves:5,
      lacunarity:1.97,
      gain:0.5,
      erosion:0.7,// Ableitungsdämpfung: Täler flacher, Grate schärfer
      warp:0.35,// Domain-Warp -> Grate mäandern statt gerade zu laufen
      valleyBias:1.2,
      seaLevel:0.35,// vor der Skalierung abgezogen -> Talboden unter 0
      talus:1,
      talusPasses:12// volle thermische Erosion wie im Original
    });
    terrainGen.bake();

    // Geländehöhe (ROHwert, ohne den Mesh-Versatz -1) an Weltposition (wx,wz):
    // terrainGen.sampleHeight() (gebackenes, geerodetes Feld, bilinear) PLUS der
    // projektspezifische Nachbau: Randabfall zur Kuppelkante, flache Landeplätze
    // und Küstenprofil. Als REINE Funktion auswertbar - Kreisscheibe und floorY()
    // werten sie damit exakt identisch aus (dieselbe Rolle wie terrainHeightAt()
    // vorher, nur mit dem Generator-Feld statt dem alten Werterauschen).
    const terrainHeightAt=(wx,wz)=>{
      const x=wx, z=wz;
      const roh=terrainGen.sampleHeight(wx,wz);// unverändelter Feldwert (auch für den Meeresboden)
      let h=roh;
      const r=Math.sqrt(x*x+z*z);
      // ---- Horizont-Verstärkung in ZWEI STUFEN: ab r=300 wächst wie bisher
      // ein Faktor bis 2,0 an (weich über Smoothstep bis r=470). AB r=335
      // kommt eine zweite Stufe dazu, die die bisherige Höhe bis ×4
      // vervielfacht - die Felshügel im Hintergrund, also der Bereich mit dem
      // größten Abstand von der Küstenlinie, sind damit um 300 % höher als
      // bisher (doppelt so hoch -> vierfach). Der Spielbereich bleibt exakt
      // unverändert: r <= 335 (Landeplätze, Kurskorridor, Baumzone) bekommt
      // dieselbe Höhe wie zuvor; dahinter wächst die Überhöhung sanft an.
      if(r>300){
        let hb=Math.min((r-300)/170,1);
        hb=hb*hb*(3-2*hb);// Stufe 1: +0 % .. +100 % (wie bisher)
        let hc=Math.min((r-335)/135,1);
        hc=hc*hc*(3-2*hc);// Stufe 2: ×1 .. ×4 auf die Stufe-1-Höhe
        h*=(1+hb)*(1+3*hc);
      }
      // Randabfall: auf der letzten Meile (ab 470, früher 494) auf GROUND_R
      // (504) gegen 0 - die Scheibenkante schmiegt sich zuletzt an die
      // Kuppelkante (y=0) an. Die frühere Schwelle 494 reichte nur für die
      // doppelte Höhe; mit dem vierfachen Rücken (roh bis 16,9 × 8 ≈ 135)
      // würden die Kuppen sonst über die Himmelkuppel (HORIZON_R = 500)
      // hinausragen und dort von der Kuppel abgeschnitten. Ab 470 bleibt die
      // höchste mögliche Kuppe bei ~492 Einheiten Abstand vom Ursprung -
      // knapp unter der Kuppel, aber sicher innerhalb.
      if(r>470){
        let fr=Math.min((r-470)/(GROUND_R-470),1);
        fr=fr*fr*(3-2*fr);
        h*=(1-fr);
      }
      // die Umgebung von Landeplatz 1 vollkommen flach halten (r < 30, ab r >= 100 voll)
      let fade=Math.min(Math.max((r-30)/70,0),1);
      fade=fade*fade*(3-2*fade);
      h*=fade;
      // ---- Küste: im Wasserbereich wird die Höhe durch das Meeresprofil ersetzt.
      // Das Uferband (bis zu 40 Einheiten LANDSEITIG der Küste) wird knapp über die
      // Wasserlinie angehoben - sonst könnte ein trockenes Tal direkt am Ufer unter
      // den Meeresspiegel sinken und die Wasserfläche würde in der Luft enden. Ab
      // der Wasserlinie läuft der Boden weich zum unregelmäßigen Meeresboden ab;
      // Streifen UND beide Buchten bekommen dadurch ein natürliches, schräges Ufer
      // statt einer Klippe. (Außerhalb von -40 bleibt das Gelände unberührt.)
      // Die Formel ist in -z-Richtung unbegrenzt - das Meer läuft so bis zum
      // Scheibenrand.
      const d=coastZ(x)-z;// >0: im Meeresbereich, Abstand hinter der Küstenlinie
      if(d>-40){
        const base=Math.max(h,WATER_LEVEL+0.3);// trockenes Ufer: mindestens 0,3 über dem Wasser
        if(d<=0){
          h=base;
        }else{
          let t=Math.min(d/30,1); t=t*t*(3-2*t);// Smoothstep-Rampe -> weicher Uferübergang
          h=base+((WATER_SEABED+roh*0.5)-base)*t;// Meeresboden folgt dem Feld etwas
        }
      }
      // Boden unter dem 2. Landeplatz abflachen (innerhalb 25 flach, bis 55 auslaufend),
      // derselbe Gedanke wie die flache Scheibe um Platz 1 im Ursprung
      const dx=x-pad2.x, dz=z-pad2.z;
      const r2=Math.sqrt(dx*dx+dz*dz);
      if(r2<55){
        let f2=Math.min(Math.max((r2-25)/30,0),1);
        f2=f2*f2*(3-2*f2);
        h*=f2;// die Feldhöhe wieder auf 0 zurückziehen
      }
      return h;
    };

    // Kreisscheibe mit terrainHeightAt()-Höhen befüllen (die Geometrie samt Topologie
    // liegt bereits an). Von resetScene() erneut aufgerufen, wenn ein neuer Platz 2
    // und damit neues Gelände gewürfelt wurde - dieselben Vertex-Positionen bleiben,
    // nur die Z-Werte, die Normalen und die Farben werden neu berechnet.
    const buildTerrain=()=>{
      const pos=fpg.attributes.position;
      for(let i=0;i<pos.count;i++){
        // lokale y-Ebene ist um x um -90° gedreht -> Welt-z = -y
        pos.setZ(i, terrainHeightAt(pos.getX(i), -pos.getY(i)));
      }
      fpg.computeVertexNormals();
      pos.needsUpdate=true;
      fpg.attributes.normal.needsUpdate=true;
      // Vertex-Farben: dieselben Höhen- und Neigungsbänder wie das TSL-Shader-
      // material des Originals (Wiese, trockenes Gras, Wald, Fels, Schutt,
      // Flechten, Schnee) - vorberechnet statt im Shader, weil three.js r147 kein
      // TSL kennt (s. TerrainGenerator.colorAt). Flachheit kommt aus den frisch
      // berechneten Normalen: das Mesh liegt um x um -90° gedreht, die WELT-y der
      // Normalen ist also ihre lokale z (die Höhe) - und als y an colorAt geht
      // bewusst der ROHwert (lokale z), damit er auf minY/maxY des Feldes liegt.
      if(!fpg.attributes.color){
        fpg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pos.count*3),3));
      }
      const nor=fpg.attributes.normal;
      const col=fpg.attributes.color;
      // aBlend: Textur-Mischung pro Vertex (0 = wiese.jpg, 1 = felswand.jpg),
      // vom Shader in mt6 (onBeforeCompile) als Mischfaktor gelesen
      if(!fpg.attributes.aBlend){
        fpg.setAttribute('aBlend',new THREE.BufferAttribute(new Float32Array(pos.count),1));
      }
      const blk=fpg.attributes.aBlend;
      for(let i=0;i<pos.count;i++){
        const c=terrainGen.colorAt(pos.getX(i), pos.getZ(i), -pos.getY(i), nor.getZ(i));
        col.setXYZ(i,c.r,c.g,c.b);
        blk.setX(i,c.t);
      }
      col.needsUpdate=true;
      blk.needsUpdate=true;
    };

    // 2. Landeplatz: zufällige Richtung und Entfernung (140-260 Einheiten von Platz 1) - wird
    // von resetScene() neu gewürfelt, sodass jeder neue Kurs woanders endet.
    // Der gesamte Kurskorridor muss TROCKEN sein: ein Streifen von +/-75 Einheiten um die Sehne
    // (die Bézier-Bögen streifen maximal ~60 Einheiten seitwärts, siehe courseCurve) wird gegen die
    // Küstenlinie geprüft, denn Platz 2, die Routenlinie und die Ringpfosten dürfen
    // nie im Meer landen - der Kurs muss auf dem Land sichtbar bleiben.
    const corridorDry=(x0,z0,x1,z1,margin)=>{
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)||1;
      const nx=-dz/len, nz=dx/len;// Einheitsvektor senkrecht zur Sehne
      for(let i=0;i<=24;i++){
        const t=i/24;
        for(let s=-2;s<=2;s++){
          const px=x0+dx*t+nx*margin*0.5*s, pz=z0+dz*t+nz*margin*0.5*s;
          if(isWater(px,pz)) return false;
        }
      }
      return true;
    };
    const newPad2=()=>{
      for(let k=0;k<400;k++){
        const pad2Angle=Math.random()*Math.PI*2;
        const pad2Dist=140+Math.random()*120;
        const x=Math.cos(pad2Angle)*pad2Dist, z=Math.sin(pad2Angle)*pad2Dist;
        if(corridorDry(0,0,x,z,75)){ pad2.x=x; pad2.z=z; return; }
      }
      // praktisch unmögliche Rückfalllösung (400 Würfel abgelehnt): gerade LANDSEITIG (+z),
      // was immer trocken ist - die Küstenlinie reicht nie weiter als bis z = -57
      pad2.x=0; pad2.z=230;
    };
    newPad2();
    buildTerrain();
    const gelaendeMesh=new THREE.Mesh(fpg,mt6);// Bodenfläche mit Höhenrelief
    gelaendeMesh.rotation.set(-Math.PI/2,0,0);
    gelaendeMesh.castShadow=true;// das Gelände wirft selbst Schatten in seine eigenen Mulden (Relief)
    gelaendeMesh.receiveShadow=true;
    gelaendeMesh.position.set(0,-1,0);
    scene.add(gelaendeMesh);

    // Geländehöhe an einer Welt-x/z-Position: die rote Routenlinie, die Ringpfosten und die
    // Bodenkollision in renderLoop() werden damit platziert/messen. Zugewiesen wird der
    // GLOBALE floorY (renderLoop braucht ihn). Die reine Funktion
    // terrainHeightAt() ist überALL gültig - bis zum Scheibenrand GROUND_R.
    floorY=(wx,wz)=>-1+terrainHeightAt(wx,wz);// das Boden-Mesh liegt auf y = -1

    // ---- Meer: die Wasserfläche der Landschaftsänderung. Das Polygon folgt der
    // Küstenlinie (beide Buchten enthalten) bis zum RAND DER KREISSCHEIBE - das Meer läuft
    // bis zum Horizont (Nutzerentscheidung), seine Außenkante liegt exakt auf dem Bodenrand
    // GROUND_R -> nahtloser Übergang von Wasser zu Himmel. Die Fläche existiert genau dort,
    // wo isWater() das Meer angibt. ShapeGeometry lebt in ihrer eigenen XY-Ebene
    // -> shapeY = -worldZ; gedreht wird das MESH (nicht die Geometrie), denn
    // THREE.Water leitet seine Spiegelebene aus der lokalen +Z-Achse des Meshes ab.
    {
      const shape=new THREE.Shape();
      const Xc=Math.sqrt(GROUND_R*GROUND_R-COAST_Z*COAST_Z);// x, an dem die gerade Küste
      // (außerhalb von ±300 gilt überall COAST_Z) den Scheibenrand berührt: Xc²+COAST_Z²=R²
      const NS=2400;// Küste im Abstand von ~0,4 Einheiten abgetastet (auch die Buchten fein)
      // - deutlich feiner, als der Scheibenrand es braucht
      shape.moveTo(-Xc,-coastZ(-Xc));// Beginn der Küstenlinie, westliches Ende (liegt auf dem Rand)
      for(let i=1;i<=NS;i++){
        const x=-Xc+2*Xc*i/NS;
        shape.lineTo(x,-coastZ(x));// die Küstenlinie (Buchten enthalten) nach Osten ablaufen
      }
      // Rückweg zum Westende: Bogen entlang des Scheibenrands über die Südseite
      // (shapeY = -Welt-z -> der südliche Rand liegt bei shapeY = +GROUND_R)
      const yEnd=-coastZ(Xc);// shapeY des östlichen Endpunkts (im Westen exakt derselbe Wert)
      const a0=Math.atan2(yEnd,Xc);// Winkel des Ostendpunkts in der Shape-Ebene (~1,2°)
      const a1=Math.PI-a0;// Westende = Spiegelung an der y-Achse bei gleichem Radius
      const NA=180;// Sehnenabweichung des Bogens ~0.02 Einheiten auf GROUND_R=504 -> unterpixelgroß
      for(let i=1;i<=NA;i++){
        const a=a0+(a1-a0)*i/NA;
        shape.lineTo(Math.cos(a)*GROUND_R, Math.sin(a)*GROUND_R);// landet exakt auf dem Westende
      }
      const wgeo=new THREE.ShapeGeometry(shape);
      const waterNormals=new THREE.TextureLoader().load('water_normal.jpg');
      waterNormals.wrapS=waterNormals.wrapT=THREE.RepeatWrapping;// Wellen wandern über das Meer (Textur-Wiederholung)
      // Spiegelungs-RenderTarget 256x256 (war 512): Water.js rendert pro Frame
      // die ganze Szene ein zweites Mal in diesen Puffer - die Auflösung ist
      // der größte einzelne Posten der Wasserfläche. Bei der Wellenverzerrung
      // (distortionScale 3) ist 256 px visuell nicht zu unterscheiden.
      waterMesh=new THREE.Water(wgeo,{
        textureWidth:256,
        textureHeight:256,
        waterNormals:waterNormals,
        // Sonnenrichtung für Glanz und Spiegelung: leicht von links oben (passend zum hellen
        // Himmel in sky.jpg), damit Wasserglanz und Himmel zusammenpassen
        sunDirection:new THREE.Vector3(10000,30000,-40000).normalize(),
        sunColor:0xffffff,
        waterColor:0x1b4a5e,// tiefes Blaugrün statt des grauen Standardwerts
        distortionScale:3.0,// Wellenverzerrung der Spiegelung (Standard 20 wäre zu wild)
        fog:false
      });
      waterMesh.rotation.x=-Math.PI/2;// lokale +Z-Achse (Spiegelnormale) zeigt in der Welt nach oben
      waterMesh.position.y=WATER_LEVEL-1;// Terrain-Einheiten -> Welt (Bodenfläche liegt auf -1)
      waterMesh.name='water';
      scene.add(waterMesh);
    }

    // ==== OBJEKTE ===============================================================
    // Alles, was auf der Welt steht: beide Landeplatten, die rote Kurslinie,
    // die Ringe mit Pfosten, das Kurslicht und die Drohne.
    // ===========================================================================
    const pad1Mesh=new THREE.Mesh(pg,mt4);// Landeplatz 1 (startet hier, Ziel der Ringe)
    pad1Mesh.rotation.set(-Math.PI/2,0,0);
    // Schattenwurf des Landeplatzes bewusst aus: er liegt flach am Boden
    pad1Mesh.receiveShadow=true;
    pad1Mesh.scale.set(30,29.3,1);// Platte 30 x 29,3 Einheiten, Proportionen des 980x957-Bildes beibehalten
    pad1Mesh.position.set(0,0,0);
    scene.add(pad1Mesh);

    // ---- 2. Landeplatz: gleiche landing.png-Platte, an der oben gewürfelten Position platziert
    let pad2Mesh=new THREE.Mesh(pg,mt4);
    pad2Mesh.rotation.set(-Math.PI/2,0,0);
    pad2Mesh.receiveShadow=true;
    pad2Mesh.scale.set(30,29.3,1);// genau dieselbe Größe wie Platz 1
    pad2Mesh.position.set(pad2.x,0,pad2.z);
    pad2Mesh.name="pad2";
    scene.add(pad2Mesh);

    // ---- Kurs: eine stückweise kubische Bézier-Schlange von Platz 1 (Ursprung) zu Platz 2. Die Sehne
    // wird in 3-4 Abschnitte geteilt; jeder Abschnitt biegt auf EINE Seite aus (beide Hilfspunkte
    // liegen auf derselben Seite) und die Seite wechselt von Abschnitt zu Abschnitt -> eine Schlange, die
    // die gerade Linie immer wieder kreuzt. Die Endtangente von Abschnitt k ist identisch mit
    // der Anfangstangente von Abschnitt k+1, die Kette bleibt also perfekt glatt (G1-stetig).
    // Bogenamplitude und Seite werden von buildRouteLine() mit jedem neuen Kurs neu gewürfelt,
    // kein Start gleicht dem anderen.
    let routeCurve=null;// aktueller Bézier-Pfad (x/z-Ebene), mit jedem Kurs neu gebaut
    const courseCurve=()=>{
      const len=Math.hypot(pad2.x,pad2.z);
      const ux=pad2.x/len, uz=pad2.z/len;// Einheitsvektor entlang der Sehne
      const nx=-uz, nz=ux;// Einheitsvektor senkrecht dazu
      const nSeg=(len>190&&Math.random()<0.7)?4:3;// 3 oder 4 Bögen -> Schlange mit 2-3 Richtungswechseln
      const L=len/nSeg;// Länge der Sehne eines Abschnitts
      const h=L*0.3;// Hilfspunkt-Länge entlang der Sehne (Tangentialstetigkeit)
      let side=(Math.random()<0.5)?-1:1;
      const path=new THREE.CurvePath();
      for(let k=0;k<nSeg;k++){
        const off=side*L*(0.35+Math.random()*0.35);// Bogen: 0,35..0,7 eines Abschnitts, keine Schlingen
        const x0=ux*L*k, z0=uz*L*k;
        const x1=ux*L*(k+1), z1=uz*L*(k+1);
        path.add(new THREE.CubicBezierCurve3(
          new THREE.Vector3(x0,0,z0),
          new THREE.Vector3(x0+ux*h+nx*off,0,z0+uz*h+nz*off),
          new THREE.Vector3(x1-ux*h+nx*off,0,z1-uz*h+nz*off),
          new THREE.Vector3(x1,0,z1)));
        side=-side;// nächster Bogen zur anderen Seite -> Schlange
      }
      routeCurve=path;
    };
    // rote Routenlinie für den aktuellen Kurs bauen: die Bézier-Kurve oben abtasten und
    // am Gelände entlangführen (Höhe aus dem Bodengitter gelesen), denn die gebogene Route
    // kreuzt auch Mulden, in denen eine Linie in fester Höhe schweben oder versinken würde.
    // Wird erneut von resetScene() aufgerufen; die alte Geometrie wird freigegeben, damit
    // wiederholte Neustarts kein GPU-Speicher verlieren. (MeshBasicMaterial -> die Linie bleibt ganz rot, was auch immer das Licht tut)
    const buildRouteLine=()=>{
      const old=scene.getObjectByName('pathLine');
      if(old){ scene.remove(old); old.geometry.dispose(); }
      courseCurve();// eine neue Bézier-Kurve für diesen Kurs würfeln
      const len=Math.hypot(pad2.x,pad2.z);
      const nSeg=Math.max(64,Math.round(len/2));// genug Stützpunkte für die stark gekrümmte Schlange
      const linePts=[];
      for(let i=0;i<=nSeg;i++){
        const p=routeCurve.getPoint(i/nSeg);
        linePts.push(new THREE.Vector3(p.x, floorY(p.x,p.z)+0.35, p.z));
      }
      const lineCurve=new THREE.CatmullRomCurve3(linePts);
      const pathLine=new THREE.Mesh(new THREE.TubeGeometry(lineCurve, nSeg, 0.35, 6, false), mt3);
      pathLine.name="pathLine";
      scene.add(pathLine);
    };
    buildRouteLine();

    // drei farbige Ringe auf Pfosten unterschiedlicher Höhe, EXAKT auf dem Kurs stehend:
    // jeder Ring sitzt bei 25 % / 50 % / 75 % der aktuellen Bézier-Schlange (gleichmäßig entlang der Bogenlänge),
    // sein Pfosten wächst dort aus dem Gelände und die Ringebene wird
    // senkrecht zur Kursrichtung gedreht, damit die Drohne gerade hindurchfliegen kann.
    // Ringgröße: die innere Öffnung ist 150 % der Drohne (Rotorspannweite ~28 Einheiten) ->
    // Mittenradius 22,5 mit 1,5 starkem Rohr = Innendurchmesser 42 = 1,5 x 28.
    // Pfoshöhen werden für jeden Ring und jeden Kurs neu gewürfelt; zusammen mit der neuen
    // Kurve ändert das den ganzen Slalom mit jedem Start (resetScene gibt die alte
    // Gruppe frei, kein GPU-Leck). Jeder Ring und Pfosten wird zusätzlich in die globale Hindernisliste
    // eingetragen, die renderLoop() auf Kollisionen prüft.
    const ringMats=[
      // bernstein, grün, pink - alle drei heben sich vor hellem Himmel und dunklem Boden ab
      new THREE.MeshStandardMaterial({color:0xfbbf24,roughness:0.35,metalness:0.05,emissive:0xfbbf24,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0x1c6136,roughness:0.35,metalness:0.05,emissive:0x4ade80,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0xd03100,roughness:0.35,metalness:0.05,emissive:0xf472b6,emissiveIntensity:0.25})
    ];
    const postMat=new THREE.MeshStandardMaterial({color:0x334155,roughness:0.55,metalness:0.6});
    const buildRings=()=>{
      const old=scene.getObjectByName('ringGroup');
      if(old){ scene.remove(old); old.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
      obstacles=[];// frische Kollisionsliste für den neuen Kurs (global, von renderLoop gelesen)
      // Trainingsmodus: einfacher Flug von Platz 1 zu Platz 2 - keine Ringe, keine Pfosten. Die leere
      // Hindernisliste schaltet schon die Kollisionsprüfung und den Durchflugzähler von renderLoop ab
      // (beide hängen hinter `if(obstacles.length)` bzw. hinter der Schleife über die Liste).
      if(courseMode==='training'){ updateRingBadge(); return; }
      const g=new THREE.Group(); g.name='ringGroup';
      const R=22.5, TUBE=1.5;// Innenöffnung 42 = 150 % der ~28 breiten Drohne
      const tList=[0.25,0.5,0.75];
      for(let i=0;i<3;i++){
        const p=routeCurve.getPoint(tList[i]);
        const tan=routeCurve.getTangent(tList[i]);
        const fy=floorY(p.x,p.z);
        const postH=6+Math.random()*10;// 6..16, für jeden Ring und jeden Kurs anders
        const post=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.2,postH,10),postMat);
        post.position.set(p.x, fy+postH/2, p.z);// steht auf dem Gelände
        post.castShadow=true;
        const ring=new THREE.Mesh(new THREE.TorusGeometry(R,TUBE,12,64),ringMats[i]);
        ring.position.set(p.x, fy+postH+R, p.z);// der Pfosten reicht bis zur Unterkante des Rings
        // der Torus liegt in seiner XY-Ebene (Achse = lokales z) -> diese Achse auf den Kurs drehen
        ring.rotation.y=Math.atan2(tan.x,tan.z);
        ring.castShadow=true;
        g.add(post); g.add(ring);
        // Kollisionsformen: der Ring als Mittellinienkreis, der Pfosten als vertikales Segment
        obstacles.push({kind:'ring', x:p.x, y:fy+postH+R, z:p.z, R:R, tube:TUBE,
                        ax:tan.x, ay:0, az:tan.z});
        obstacles.push({kind:'post', x:p.x, z:p.z, y0:fy, y1:fy+postH, r:1.2});
      }
      scene.add(g);
    };
    buildRings();

    // Kurslicht: ein breiter, weicher, schattenloser Scheinwerfer über der Mitte des Kurses, damit
    // die gesamte Strecke zwischen Platz 1 und Platz 2 gleichmäßig beleuchtet wird
    const pathLight=new THREE.SpotLight(0xffffff, 0.9, 4000, 0.5, 0.5, 0.8);
    pathLight.name="pathLight";// bewusst ohne Schatten: es ist eine Füllbeleuchtung für die Route
    scene.add(pathLight);
    scene.add(pathLight.target);
    const aimPathLight=()=>{
      // auf die Mitte des GEBOGENEN Kurses zielen (nicht auf die Sehne) und den Kegel weit
      // genug öffnen, um den fernsten Punkt der S-Kurve zu erreichen
      const mid=routeCurve.getPoint(0.5);
      let maxR=0;
      for(let i=0;i<=16;i++){// die Schlange streift weit aus
        const p=routeCurve.getPoint(i/16);
        maxR=Math.max(maxR,Math.hypot(p.x,p.z));
      }
      const H=maxR*0.9+50;
      pathLight.position.set(mid.x, H, mid.z);
      pathLight.target.position.set(mid.x, 0, mid.z);
      pathLight.target.updateMatrixWorld();
      pathLight.angle=Math.atan((maxR+45)/H);// Winkel aus dem fernsten Kurspunkt -> alles beleuchtet
    };
    aimPathLight();

    // ==== BÄUME ===============================================================
    // Vier zufällig gesetzte ausgewachsene Bäume auf der LANDFLÄCHE: zwei
    // Laubbäume (EZ-Tree-Preset "große Eiche") und zwei Nadelbäume (Preset
    // "große Kiefer"). TreeGenerator.js (EZ-Tree, MIT) wächst das Skelett mit
    // stratifizierten Kinderästen, Knorrigkeit und Wachstumskraft; die Blätter
    // sind gekreuzte Quads mit prozeduraler Alpha-Textur und einem Wind-Shader.
    // Die Plätze und Formen werden pro Kurs neu gewürfelt, deshalb steht
    // buildTrees() auch in resetScene().
    // ===========================================================================

    // Prozedurale Texturen (kein externes Bildmaterial nötig): Rinde mit
    // längs laufenden Fasern, ein Laubkissen aus Einzelblättern und ein
    // Nadelspray für die Nadelbäume. Jeweils einmal pro Seitenlade angelegt.
    const canvasTextur=(malen,size)=>{
      const c=document.createElement('canvas');
      c.width=c.height=size;
      malen(c.getContext('2d'),size);
      const t=new THREE.CanvasTexture(c);
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      return t;
    };
    // Rinde: senkrechte Streifen (u = Umfang des Rohrs, v läuft entlang des
    // Astes und wechselt pro Abschnitt zwischen 0/1 - die Streifen müssen
    // deshalb in v-Richtung konstant sein, sonst entstehen Streifenmuster)
    const barkTex=canvasTextur((g,s)=>{
      g.fillStyle='#7a5636'; g.fillRect(0,0,s,s);
      for(let i=0;i<220;i++){
        const x=Math.random()*s, w=1+Math.random()*3;
        const dunkel=Math.random()<0.6;
        g.fillStyle=dunkel
          ?'rgba(58,38,22,'+(0.25+Math.random()*0.4)+')'
          :'rgba(160,124,84,'+(0.15+Math.random()*0.3)+')';
        g.fillRect(x,0,w,s);
      }
      // feine Querrisse für Struktur
      for(let i=0;i<40;i++){
        const y=Math.random()*s;
        g.fillStyle='rgba(40,26,14,0.2)';
        g.fillRect(0,y,s,1);
      }
    },128);
    // Laub: viele kleine Blätter in unterschiedlichen Grüntönen, locker im
    // Quadrat verteilt - transparente Fläche außerhalb wird per alphaTest
    // verworfen, dadurch entsteht eine weiche, durchbrochene Krone
    const laubTex=canvasTextur((g,s)=>{
      g.clearRect(0,0,s,s);
      const farben=['#4e7f2c','#5f9438','#3f6b24','#6fa83f','#7fae3a','#355e1f'];
      for(let i=0;i<90;i++){
        const x=s/2+(Math.random()-0.5)*s*0.88;
        const y=s/2+(Math.random()-0.5)*s*0.88;
        const r=s*0.05*(0.55+Math.random());
        g.save();
        g.translate(x,y);
        g.rotate(Math.random()*Math.PI*2);
        g.fillStyle=farben[Math.floor(Math.random()*farben.length)];
        g.beginPath();
        g.ellipse(0,0,r*1.8,r,0,0,Math.PI*2);
        g.fill();
        g.restore();
      }
    },256);
    // Nadel: ein Raster aus vielen kurzen, gescheitelten Nadelstrichen - der
    // Untergrund bleibt bewusst dünn, damit die Quads nicht wie grüne
    // Scheibchen wirken, sondern an den Rändern ausgefranst als Nadelbesen
    const nadelTex=canvasTextur((g,s)=>{
      g.clearRect(0,0,s,s);
      // nur ein schwacher Kern als Basis, die Nadeln tragen die Fläche
      const grund=g.createRadialGradient(s/2,s/2,s*0.04,s/2,s/2,s*0.42);
      grund.addColorStop(0,'rgba(45,86,53,0.72)');
      grund.addColorStop(0.55,'rgba(45,86,53,0.4)');
      grund.addColorStop(1,'rgba(45,86,53,0)');
      g.fillStyle=grund;
      g.beginPath(); g.arc(s/2,s/2,s*0.45,0,Math.PI*2); g.fill();
      // Nadeln: in Schichten, von innen nach außen, jede Nadel leicht gebogen
      const farben=['#2f5c39','#3a6b44','#27502f','#437a4d','#517f5b','#1e4226','#63a06e'];
      for(let i=0;i<1100;i++){
        const x=Math.random()*s, y=Math.random()*s;
        const len=s*0.1*(0.35+Math.random()*0.75);
        const winkel=-Math.PI/2+(Math.random()-0.5)*3.0;
        g.strokeStyle=farben[Math.floor(Math.random()*farben.length)];
        g.lineWidth=1.1+Math.random()*1.8;
        g.lineCap='round';
        g.beginPath();
        g.moveTo(x,y);
        g.quadraticCurveTo(
          x+Math.cos(winkel)*len*0.5+(Math.random()-0.5)*len*0.3,
          y+Math.sin(winkel)*len*0.5+(Math.random()-0.5)*len*0.3,
          x+Math.cos(winkel)*len, y+Math.sin(winkel)*len);
        g.stroke();
      }
      // vereinzelt kleine Zapfen als dunkle Punkte für Struktur
      g.fillStyle='rgba(70,50,30,0.65)';
      for(let i=0;i<8;i++){
        const x=s*0.25+Math.random()*s*0.5, y=s*0.25+Math.random()*s*0.5;
        g.beginPath(); g.ellipse(x,y,s*0.012,s*0.026,Math.random(),0,Math.PI*2); g.fill();
      }
    },256);

    // EZ-Tree-Presets (Werte aus oak_large.json bzw. pine_large.json des
    // Ursprungsprojekts); der seed pro Baum wird neu gewürfelt. Beim Nadel-
    // preset sind Blattgröße und -anzahl angepasst: 26 kleinere Besen statt
    // 18 großer - dichteres Nadelkleid statt einzelner großer Quads
    const laubPreset={
      type:'deciduous',branch:{
        levels:3,
        angle:{1:54,2:43,3:32},
        children:{0:9,1:5,2:3},
        force:{direction:{x:0,y:1,z:0},strength:0.02},
        gnarliness:{0:-0.04,1:0.16,2:-0.06,3:0.09},
        length:{0:47.7,1:29.39,2:17.62,3:7.16},
        radius:{0:3,1:0.69,2:0.69,3:1.19},
        sections:{0:16,1:9,2:8,3:3},
        segments:{0:12,1:5,2:3,3:3},
        start:{1:0.35,2:0.1,3:0.0},
        taper:{0:0.73,1:0.42,2:0.69,3:0.75},
        twist:{0:-0.23,1:0.42,2:0,3:0}
      },
      leaves:{billboard:'double',angle:36,count:10,start:0.16,
              size:4.5,sizeVariance:0.7,alphaTest:0.5}
    };
    const nadelPreset={
      type:'evergreen',branch:{
        levels:1,
        angle:{1:129.13,2:16,3:60},
        children:{0:100,1:3,2:0},
        force:{direction:{x:0,y:1,z:0},strength:0.009},
        gnarliness:{0:0.05,1:0.08,2:0,3:0},
        length:{0:65.25,1:34.85,2:27.25,3:1},
        radius:{0:1.27,1:0.37,2:0.7,3:0.7},
        sections:{0:12,1:10,2:8,3:6},
        segments:{0:8,1:6,2:4,3:3},
        start:{1:0.293,2:0.14,3:0.3},
        taper:{0:0.7,1:0.7,2:0.7,3:0.7},
        twist:{0:0,1:0,2:0,3:0}
      },
      leaves:{billboard:'double',angle:17,count:26,start:0.076,
              size:1.6,sizeVariance:0.3,alphaTest:0.3}
    };

    // Ein Stellplatz gilt als frei, wenn er: auf dem LAND liegt (kein Wurzelwerk
    // im Meer), im Spielraum zwischen 70 und 370 Einheiten vom Ursprung liegt
    // (also außerhalb beider Landeplatten), mindestens 45 Einheiten von
    // Landeplatz 2 entfernt ist (Platte + Sicherheitsrand), mindestens
    // PARCOUR_ABSTAND von der Routenlinie hält und mindestens 130 Einheiten
    // Abstand zu den bereits gesetzten Bäumen hat (Wert begründet am Block oben).
    // PARCOUR_ABSTAND = Krone (bis ~53) + Drohnenkugel (~14) + Rand ~18: eine
    // Krone, die auf die Kursmitte herüberragt, ließe die Drohne auf dem
    // Parcours nicht mehr unbeschadet hindurch - Bäume stehen also IMMER
    // außerhalb des Parcours. 80 Stützpunkte verteilt entlang der Bézier-Kurve
    // decken die Schlange lückenlos ab (größte Lücke ~13 Einheiten, immer
    // kleiner als die Hälfte des Abstands). Die Bäume untereinander halten
    // 130 Einheiten Abstand: die Blattkronen reichen ~41..69 vom Stamm, zwei
    // Kronen (je plus Drohnenkugel von ~12) überlappen erst darunter -
    // die Ausweichschleife sieht so nie zwei Bäume gleichzeitig und muss nie
    // zwischen zwei Kronen vermitteln.
    const PARCOUR_ABSTAND=85;
    const treeSpotFree=(x,z,stellen)=>{
      if(isWater(x,z)) return false;
      // Standfestigkeit prüfen: Flachheit des Geländes (sampleSlope des
      // Generators = Welt-Normalen-y, 1 = eben) - unter 0,8 (~37° Neigung)
      // wachsen keine Bäume
      if(terrainGen.sampleSlope(x,z)<0.8) return false;
      const r=Math.hypot(x,z);
      if(r<70||r>370) return false;
      if(Math.hypot(x-pad2.x,z-pad2.z)<45) return false;
      for(let i=0;i<=80;i++){
        const p=routeCurve.getPoint(i/80);
        if(Math.hypot(x-p.x,z-p.z)<PARCOUR_ABSTAND) return false;
      }
      for(const s of stellen){
        if(Math.hypot(x-s.x,z-s.z)<130) return false;
      }
      return true;
    };

    // Einen Baum bauen: Skelett + Blätter über TreeGenerator, Materialien
    // pro Baum eigen (Blattmaterial trägt den Wind-Shader), danach auf die
    // Zielhöhe skalieren - die EZ-Tree-Presets sind deutlich größer als die
    // Spielwelt und der Drohne (Spannweite 28 Einheiten)
    const baumBauen=(typ,seed)=>{
      const preset=(typ==='laub')?laubPreset:nadelPreset;
      const opt=Object.assign({},preset,{seed:seed});
      const gen=new TreeGenerator(opt);
      // Rinde: mattes Braun, leichter Farbunterschied pro Baum
      const rinde=new THREE.MeshLambertMaterial({
        color:new THREE.Color(0x6b4a2f).offsetHSL(
          (Math.random()-0.5)*0.03,(Math.random()-0.5)*0.1,(Math.random()-0.5)*0.08),
        map:barkTex
      });
      // Blätter: Textur im Originalton, nur leicht getönt; DoubleSide +
      // alphaTest, damit die transparenten Texturstellen kein Sortier-Chaos
      // erzeugen und im Schatten mitgeschnitten werden
      const blatt=new THREE.MeshLambertMaterial({
        color:new THREE.Color(0xffffff).offsetHSL(0,0,(Math.random()-0.5)*0.1),
        map:(typ==='laub')?laubTex:nadelTex,
        alphaTest:preset.leaves.alphaTest,
        side:THREE.DoubleSide
      });
      const g=gen.build(rinde,blatt);
      treeWindMats.push(blatt);
      return g;
    };

    // Vier Bäume zufällig verteilen: zweimal Laub, zweimal Nadel, jedes Mal
    // neuer Stellplatz, neuer seed und kleine Höhenvarianz. Wird von
    // buildScene() und bei jedem Kurswechsel aus resetScene() aufgerufen.
    const buildTrees=()=>{
      if(treeGroup){
        scene.remove(treeGroup);
        // Geometrien und Materialien freigeben (Texturen sind pro Seitenlade
        // einmalig und bleiben erhalten)
        treeGroup.traverse(o=>{
          if(!o.isMesh) return;
          if(o.geometry) o.geometry.dispose();
          if(o.material) o.material.dispose();
        });
      }
      treeWindMats=[];
      // alte Baum-Kollisionsformen entfernen, falls buildTrees() ohne
      // vorangegangenen buildRings()-Aufruf läuft (der leert die Liste ohnehin)
      obstacles=obstacles.filter(o=>o.kind!=='crown'&&o.kind!=='trunk');
      treeGroup=new THREE.Group(); treeGroup.name='trees';
      const stellen=[];
      const typen=['laub','nadel','laub','nadel'];
      for(const typ of typen){
        let x=0,z=0,gesetzt=false;
        for(let versuch=0;versuch<400&&!gesetzt;versuch++){
          const a=Math.random()*Math.PI*2;
          const r=70+Math.random()*300;// 70..370 vom Ursprung
          x=Math.cos(a)*r; z=Math.sin(a)*r;
          gesetzt=treeSpotFree(x,z,stellen);
        }
        if(!gesetzt) continue;// praktisch ausgeschlossen: die Landfläche ist groß genug
        stellen.push({x,z});
        const seed=Math.floor(Math.random()*1e9)+1;
        const baum=baumBauen(typ,seed);
        // auf die Zielhöhe skalieren: Laubbäume 80..108, Nadelbäume 92..124
        // Einheiten - vierfache Größe gegenüber der vorherigen Stufe
        // (zum Vergleich: Drohnen-Spannweite 28, Ringdurchmesser 48,
        // HORIZON_R=500 bis zum Horizont)
        baum.updateMatrixWorld(true);
        const box=new THREE.Box3().setFromObject(baum);
        const hoehe=box.max.y-box.min.y;
        const zielH=4*((typ==='laub')?(20+Math.random()*7):(23+Math.random()*8));
        baum.scale.setScalar(zielH/hoehe);
        // auf die Geländehöhe, Stammfuß 0,4 Einheiten tief im Boden (im Gefälle
        // kann das Facettenmesh zwischen zwei Vertices etwas über floorY liegen)
        baum.position.set(x,floorY(x,z)-0.4,z);
        baum.rotation.y=Math.random()*Math.PI*2;// Zufallsdrehung um die eigene Achse
        treeGroup.add(baum);

        // ---- Kollisionsformen des Baumes in die Hindernisliste -----------
        // Vereinfachte Formen statt Geometrie-Abtastung pro Frame, aber eng an
        // der tatsächlichen Geometrie gemessen: der STAMM ist ein vertikaler
        // KEGELSTUMPF vom Stammfuß bis zur Kronenunterkante. Beide Radien
        // (unten / oben) werden aus der Stammgeometrie gemessen, weil sich der
        // Stamm verjüngt - ein Zylinder mit dem großen Fußradius läge oben bis
        // zu 0,7 Einheiten zu weit im Weg (gemessen, s. cdp_baum_probe).
        // Die KRONE ist kein Ellipsoid aus der Welt-Box der Blattquads mehr,
        // sondern ein Voxel-Raster über die tatsächliche Blattgeometrie: die
        // Blattwolke ist unregelmäßig (Nadelbaum konisch, Laubbaum gelappt),
        // eine Box-Hülle mit 10 % Rand hielt die Drohne im Median ~12 und
        // teilweise ~37 Einheiten VOR der sichtbaren Krone auf. Das Raster
        // markiert pro Blatt-Dreieck Ecken und Schwerpunkt in Weltkoordinaten;
        // die Kollisionsprüfung misst danach den Abstand zu den besetzten
        // Zellen und spart die ~20.000 Vertices pro Baum.
        baum.updateMatrixWorld(true);// Weltmatrizen nach Skalierung/Drehung neu
        const blattMesh=baum.getObjectByName('TreeBlatt');
        if(blattMesh){
          const kb=new THREE.Box3().setFromObject(blattMesh);
          const kx=0.5*(kb.min.x+kb.max.x), ky=0.5*(kb.min.y+kb.max.y),
                kz=0.5*(kb.min.z+kb.max.z);
          const presetB=(typ==='laub')?laubPreset:nadelPreset;
          const y0=baum.position.y;// Stammfuß (0,4 unter der Geländehöhe)
          const y1=Math.max(y0+1, kb.min.y);// bis zur Kronenunterkante
          // ---- Stamm: Radien unten und oben messen -------------------------
          // Alle Rinde-Vertices in Weltkoordinaten, dann je ein Band von 25 %
          // der Stammhöhe am Fuß und unter der Krone: der größte Abstand von
          // der Stammachse dort ist der Radius. Äste, die ins Band ragen,
          // würden ihn aufblasen - deshalb nur Vertices bis zum vollen
          // Fußradius zählen (die Rinde sitzt dort um die Achse, ein Ast-
          // segment wächst in wenigen Einheiten über den Stamm hinaus).
          const rindeMesh=baum.getObjectByName('TreeRinde');
          let rUnten=0, rOben=0;
          if(rindeMesh){
            const rp=rindeMesh.geometry.attributes.position;
            const rmw=rindeMesh.matrixWorld;
            const v=new THREE.Vector3();
            const rMax0=presetB.branch.radius[0]*baum.scale.x;// Fußradius des Presets (obere Grenze)
            const bandUnten=y0+0.25*(y1-y0), bandOben=y1-0.25*(y1-y0);
            for(let i=0;i<rp.count;i++){
              v.fromBufferAttribute(rp,i).applyMatrix4(rmw);
              if(v.y>y1) continue;// oberhalb der Kronenunterkante: Äste, nicht Stamm
              const rr=Math.hypot(v.x-baum.position.x, v.z-baum.position.z);
              if(rr>rMax0) continue;// deutlich außerhalb des Stammes, kein Stammkern
              if(v.y<=bandUnten&&rr>rUnten) rUnten=rr;
              if(v.y>=bandOben&&v.y<=y1&&rr>rOben) rOben=rr;
            }
          }
          if(rUnten<0.3) rUnten=presetB.branch.radius[0]*baum.scale.x;
          if(rOben<0.2||rOben>rUnten) rOben=rUnten*0.7;// Fallback: kräftige, aber glaubwürdige Verjüngung
          // ---- Krone: Voxel-Raster über die Blattgeometrie ----------------
          // Zellgröße ~ halbe Blattquadratgröße (Laub 4,5 / Nadel 1,6 local,
          // skaliert ~1,4x): so sitzt jede besetzte Zelle auf sichtbarem
          // Blatt, Lücken zwischen den Quads bleiben offen (die Drohne soll
          // ohnehin nur auf die Kollisionskugel reagieren). Pro Dreieck werden
          // die drei Ecken und der Schwerpunkt markiert - das schließt die
          // Mitte der Quads, ohne die Fläche zu übervoll zu setzen.
          const zelle=4;// Rasterkantenlänge in Weltkohlenwelt-Einheiten
          const raster=new Map();// "ix,iy,iz" -> Mittelpunkt der Zelle
          const pGeo=blattMesh.geometry;
          const pPos=pGeo.attributes.position;
          const pIdx=pGeo.index;
          const mw=blattMesh.matrixWorld;
          const va=new THREE.Vector3(), vb=new THREE.Vector3(), vc=new THREE.Vector3();
          const markiere=(x,y,z)=>{
            const key=Math.floor(x/zelle)+','+Math.floor(y/zelle)+','+Math.floor(z/zelle);
            if(!raster.has(key)) raster.set(key,[x,y,z]);
          };
          const dreiecke=pIdx?pIdx.count:pPos.count;
          for(let t=0;t+2<dreiecke;t+=3){
            const ia=pIdx?pIdx.getX(t):t, ib=pIdx?pIdx.getX(t+1):t+1, ic=pIdx?pIdx.getX(t+2):t+2;
            va.fromBufferAttribute(pPos,ia).applyMatrix4(mw);
            vb.fromBufferAttribute(pPos,ib).applyMatrix4(mw);
            vc.fromBufferAttribute(pPos,ic).applyMatrix4(mw);
            markiere(va.x,va.y,va.z);
            markiere(vb.x,vb.y,vb.z);
            markiere(vc.x,vc.y,vc.z);
            markiere((va.x+vb.x+vc.x)/3,(va.y+vb.y+vc.y)/3,(va.z+vb.z+vc.z)/3);
          }
          // Dichte Zellen in ein Array legen (Reihenfolge egal) und die
          // Bounding-Kugel der Krone für die Vorabprüfung mitgeben.
          const punkte=[];
          let R=0;
          for(const [key,m] of raster){
            punkte.push(m[0],m[1],m[2]);
            const dd=(m[0]-kx)**2+(m[1]-ky)**2+(m[2]-kz)**2;
            if(dd>R) R=dd;
          }
          R=Math.sqrt(R)+zelle*0.87;// Rand über den Zellmittelpunkten hinaus
          // REIHENFOLGE: zuerst der Stamm, dann die Krone. Die Ausweichschleife
          // nimmt pro Runde den ERSTEN Treffer der Liste - ein Stammfuß unter
          // der Kronenhülle muss die Meldung "Baumstamm" bekommen und mit dem
          // einfachen seitlichen Schub freisetzen, nicht mit dem Kronenweg.
          obstacles.push({kind:'trunk', x:baum.position.x, z:baum.position.z,
                          y0:y0, y1:y1, r:rUnten, rOben:rOben});
          if(punkte.length>=3){
            obstacles.push({kind:'crown', x:kx, y:ky, z:kz, R:R,
                            zelle:zelle, punkte:new Float32Array(punkte)});
          }
        }
      }
      baumStellen=stellen;// für treeSpotFree() beim nächsten Kurs (Abstandsregel untereinander)
      scene.add(treeGroup);
    };
    buildTrees();

    // Drohnengruppe (Wurzel aller Drohenteile)
    drone=new THREE.Group;
    // Drehreihenfolge: Rollen (Z) und Nicken (X) um die eigenen Achsen der Drohne, Gieren (Y) um die
    // Welt-Hochachse. Mit der Vorgabe 'XYZ' würde das Nicken ZULETZT angewendet, also um die
    // Welt-x-Achse: die Nase würde sich im Raum immer gleich einklappen (z.B. Heck runter, wenn
    // man auf die Kamera zufliegt, oder ein sichtbares Rollen statt des Nickens entlang von x)
    // anstatt in Flugrichtung einzutauchen.
    drone.rotation.order='YXZ';
    drone.castShadow=true;
    drone.receiveShadow=true;
    // Marienkäfer-Rumpf: die Körperkontur wird aus deckel.png abgelesen statt aus einem
    // einfachen Zylinder. deckelOutline hält 90 Radialabstände (in Bildpixeln, gemessen vom
    // Alpha-Schwerpunkt des 411x431-Bildes, über ~20° kreisförmig geglättet, damit die Striche
    // die Kontur nicht wellen: Index i = Winkel i*4°, 0° = Bilddes rechts,
    // 90° = Bildunten, 270° = Bildoben = der Kopf = die Nase der Drohne (-z).
    const deckelOutline=[204.05,204.64,205.23,205.91,206.82,207.59,208.09,208.64,209.18,209.68,
      210.09,210.59,211,211.5,211.82,212.14,212.32,212.55,212.68,212.64,212.55,212.36,212.36,
      212.32,212.36,212.55,212.91,212.91,212.68,212.41,212.09,211.73,211.36,211.05,210.45,
      209.95,209.45,209,208.45,208,207.68,207.09,206.5,205.95,205.45,204.82,204.32,203.91,
      203.36,202.59,201.91,201.36,201,200.55,201,201.55,203.05,204.95,207.41,209.77,212.05,
      213.91,215.32,216.45,217.23,217.68,217.86,217.91,217.73,217.5,217.09,216.64,215.86,215,
      214,212.64,211.14,209.14,206.73,204.64,203,201.77,201.18,200.91,201.41,201.91,202.41,
      202.91,203.32,203.64];
    // Bildpixel -> Welteinheiten: der längste Radius (Kopfspitze, 217,91 px) wird zu 4,7,
    // damit der flache Deckel einen Radius von 4,7 erreicht und der Mantel (den die Fase
    // 0,3 weiter nach außen schiebt) genau 5,0 in der Breite misst - die Breite des Rumpfes.
    const dk=4.7/Math.max.apply(null,deckelOutline);
    const deckPts=deckelOutline.map(function(r,i){
      const a=i/deckelOutline.length*Math.PI*2;
      // Bild (x rechts, y unten) -> Form (x, -y): nach rotateX(-PI/2) ist die Bildoberseite
      // (Kopf) bei -z, also der Nase der Drohne zugekehrt
      return new THREE.Vector2(r*Math.cos(a)*dk, -r*Math.sin(a)*dk);
    });
    const deckShape=new THREE.Shape(deckPts);
    // extrudierte Hülle: Tiefe 1,4 + 2 x bevelThickness 0,3 = Höhe 2, bevelSize 0,3 rundet
    // den Rand ab (obere/untere Kante laufen nach innen ein, der breiteste Ring sitzt auf halber Höhe)
    const bodyGeo=new THREE.ExtrudeGeometry(deckShape,
      {depth:1.4,bevelEnabled:true,bevelThickness:0.3,bevelSize:0.3,bevelSegments:4,steps:1,curveSegments:1});
    bodyGeo.rotateX(-Math.PI/2);
    bodyGeo.translate(0,-0.7,0);// die Fase bringt oben und unten 0,3 dazu -> Körper auf y=0 zentrieren
    const md0=new THREE.Mesh(bodyGeo,mt8);// Rumpf
    md0.castShadow=true;// wirft einen Schatten ...
    // ... nimmt aber selbst bewusst KEINEN an (kein receiveShadow) - der
    // Rumpf bleibt gleichmäßig hell beleuchtet, auch unter Baumkronen
    md0.position.set(0,4,0);// reicht über y 3..5
    drone.add(md0);

    // weiches Shading für die extrudierte Hülle: ExtrudeGeometry ist nicht indexiert, daher hat jede
    // Kopie einer gemeinsamen Ecke (Mantel, Fase, Deckelrand) ihre eigene Normale. Mantel- und Fasen-
    // Kopien widersprachen sich -> harte vertikale Streifen an den Flanken. Stattdessen EINE flächengewichtete
    // Normale je eindeutiger Vertexposition berechnen: die Flanken schatten gleichmäßig, der Rand bekommt
    // einen weichen, runden Glanz (die Deckelflächen behalten 0,1,0 im Inneren).
    (function(){
      const pa=bodyGeo.attributes.position, na=bodyGeo.attributes.normal;
      const acc={}, A=new THREE.Vector3(), B=new THREE.Vector3(), C=new THREE.Vector3(),
            e1=new THREE.Vector3(), e2=new THREE.Vector3(), fn=new THREE.Vector3();
      for(let t=0;t<pa.count;t+=3){// Flächennormale jedes Dreiecks aufsummieren
        A.fromBufferAttribute(pa,t); B.fromBufferAttribute(pa,t+1); C.fromBufferAttribute(pa,t+2);
        fn.crossVectors(e1.subVectors(B,A), e2.subVectors(C,A));
        for(let k=0;k<3;k++){
          const key=pa.getX(t+k).toFixed(4)+'|'+pa.getY(t+k).toFixed(4)+'|'+pa.getZ(t+k).toFixed(4);
          const v=acc[key]||(acc[key]=new THREE.Vector3());
          v.add(fn);
        }
      }
      const vkey=function(i){ return pa.getX(i).toFixed(4)+'|'+pa.getY(i).toFixed(4)+'|'+pa.getZ(i).toFixed(4); };
      for(let i=0;i<pa.count;i++){
        const v=acc[vkey(i)];
        if(v && v.lengthSq()>1e-12){ v.normalize(); na.setXYZ(i,v.x,v.y,v.z); }
      }
      na.needsUpdate=true;
    })();

    // Deckelfläche des Rumpfes: dieselbe abgetastete Kontur als flacher Deckel mit
    // deckel.png, 0,01 über dem Rumpfdeckel (y = 5,0) gelegt, damit die beiden nie z-fighten.
    // ShapeGeometry speichert die Rohkoordinaten als UVs; sie werden hier neu geschrieben:
    // u = Bild-x / 411, v = 1 - Bild-y / 431 (v gespiegelt -> Bildoben = v 1 = Nasenseite),
    // Bildpx = Schwerpunkt + Formkoordinate / dk
    const deckGeo=new THREE.ShapeGeometry(deckShape);
    {
      const dp=deckGeo.attributes.position, duv=deckGeo.attributes.uv;
      for(let i=0;i<dp.count;i++){
        duv.setXY(i, (206.84+dp.getX(i)/dk)/411, 1-(218.75-dp.getY(i)/dk)/431);
      }
      duv.needsUpdate=true;
    }
    const md0deck=new THREE.Mesh(deckGeo, mt10);// Deckplatten-Bild
    md0deck.rotation.x=-Math.PI/2;// flach hinlegen, die Bildoberseite zeigt zur Nase (-z)
    md0deck.position.set(0,5.01,0);
    drone.add(md0deck);

    // erste Trägerstrebe der Rotoren aus Quadergeometrie erzeugen (20 lang, 45° gedreht)
    const md1=new THREE.Mesh(bg,mt8);
    md1.castShadow=true;
    //md1.receiveShadow=true;// Schattenannahme der Drohnteile bewusst aus
    md1.scale.set(20,1,1);
    md1.position.set(0, 4.5, 0);
    md1.rotation.set(0,Math.PI*0.25,0);
    drone.add(md1);
    // zweite Trägerstrebe der Rotoren aus Quadergeometrie erzeugen (quer zur ersten)
    const md2=new THREE.Mesh(bg,mt8);
    md2.castShadow=true;
    //md2.receiveShadow=true;// Schattenannahme der Drohnteile bewusst aus
    md2.scale.set(20,1,1);
