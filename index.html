<script>
  var controls;
  var scene,camera,renderer;
  
  var pos={"x":0, "y":0, "z":0, "vx":0, "vy":0, "vz":0, "turn":0};
  // flight commands currently held down ('up','dn','tl','tr','mf','mb','ml','mr'), fed by
  // the keyboard AND the on-screen keycaps. A SET instead of a single value so any
  // combination can be evaluated in the same frame - one arrow key plus one WASD key
  // (climb while accelerating, turn while flying), two WASD keys, and so on. Opposite
  // keys (W+S, left+right) simply cancel out to a net zero. Deliberately global like pos.
  var held=new Set();
  // keyboard key -> flight command, shared by the keydown and the keyup listener
  function keyCmd(k){
    return {w:"mf", s:"mb", a:"ml", d:"mr",
            arrowup:"up", arrowdown:"dn", arrowleft:"tl", arrowright:"tr"}[k]||null;
  }
  // 2nd landing site: filled in main() with a random position (world x/z)
  var pad2={"x":0, "z":0};
  // one-shot flag: the success message only fades in once
  var successShown=false;
  // course mode: 'parcours' (default: three rings + posts + pass counter) or 'training'
  // (plain flight from pad 1 to pad 2, no rings and no posts). Switched by the button pair
  // in the light-hint row of the control panel; a switch always restarts the scene with a
  // brand new course (same path as a click on the success message).
  var courseMode='parcours';
  // camera mode: false = overview (orbit control), true = first person view glued to the nose
  var fpv=false;
  // FPV camera head tilt in degrees: negative = look up, positive = look down (-30..90),
  // driven by the white angle wheel between the arrow-key and WASD pads
  var fpvTilt=0;
  var fpvTiltQ=new THREE.Quaternion();// scratch quaternion, reused every frame (no per-frame allocation)
  var fpvAxisX=new THREE.Vector3(1,0,0);
  // FPV camera alignment: 'starr' = rigid on the drone (full pitch/roll goes into the picture),
  // 'gimbal' = yaw follows, pitch/roll damped with inertia (like a 2-axis gimbal),
  // 'welt' = orientation locked to the world coordinates (only yaw follows, horizon always level)
  var fpvAlign='starr';
  var fpvAlignQ=new THREE.Quaternion(); // smoothed gimbal orientation, reused every frame
  var fpvTargetQ=new THREE.Quaternion();// scratch: desired orientation of the current frame
  var fpvLevelE=new THREE.Euler(0,0,0,'YXZ');// scratch: yaw-only (world aligned) orientation
  // collision analysis (all read by renderLoop, which lives at top level like this block):
  // floorY is ASSIGNED in main() (closure over the terrain grid), obstacles is refilled by
  // buildRings() with every course - the same "deliberately global" pattern as clouds
  var floorY=null;// terrain height at a world x/z position, set up in main()
  // ---- water: the landscape change. A band of sea runs along the FAR edge of the
  // 1000x1000 terrain (z = -500 .. -167 = exactly one third of its area) and cuts TWO
  // bays of different size into the land. All values are in TERRAIN units, i.e. exactly
  // the coordinates floorY() returns (the floor mesh itself sits at world y = -1, so the
  // water surface is rendered one unit lower - see waterMesh.position.y in main()).
  var COAST_Z=-167;// straight coastline: sea where z < coastZ(x), land where z > coastZ(x)
  var WATER_LEVEL=-1.5;// water surface in terrain units (rendered world y = WATER_LEVEL-1)
  var WATER_SEABED=-4.5;// sea bed in terrain units -> 3 units of water depth over it
  // smooth bay: 0 outside |x-cx| >= hw, `depth` at the centre, cosine ramp without corners
  const bayBump=(x,cx,hw,depth)=>{
    const dx=Math.abs(x-cx);
    if(dx>=hw) return 0;
    return depth*0.5*(1+Math.cos(Math.PI*dx/hw));
  };
  // coastline of the current landscape: the straight band edge plus the two bays, both
  // cut INLAND (towards +z): a LARGE bay in the west (reaches z = -57) and a clearly
  // SMALLER one in the east (reaches z = -112) - the sizes differ on purpose
  const coastZ=(x)=>
    COAST_Z
    +bayBump(x,-150,130,110)// large bay: mouth 260 wide, 110 deep
    +bayBump(x, 170, 85, 55);// small bay: mouth 170 wide, 55 deep
  // true where the sea plane exists - drives the terrain carve, the flight physics and
  // the splash message, so shoreline, water mesh and collision always agree
  const isWater=(x,z)=>z<coastZ(x);
  // ground height FOR THE FLIGHT PHYSICS: on land the terrain exactly as before (never
  // below 0), inside the sea region the water SURFACE - the drone rests ON the water
  // instead of sinking to the sea bed. The lifted beach strip still wins because max()
  // keeps any ground that pokes above the waterline.
  const groundY=(x,z)=>{
    const h=floorY(x,z);
    return isWater(x,z)?Math.max(h,WATER_LEVEL):Math.max(h,0);
  };
  var waterMesh=null;// THREE.Water sea surface, created in main(), animated in renderLoop
  var waterPrevT=0;// last wave-animation timestamp (ms), 0 = no frame seen yet
  var waterTouched=false;// the drone is already resting on the sea (one splash msg per dip)
  var obstacles=[];// rings + posts of the current course, checked every frame
  var lastCollision='';// '' | 'ring' | 'post' - kind of the most recent impact
  var collisionCount=0;// how many impacts happened since the page load
  var droneColR=-1;// collision sphere of the drone, measured once from its bounding box
  var droneColCY=4;// centre of that sphere above the drone group origin
  var crashAt=-1e9, crashTimer=null;// -1e9: a collision right after page load may message
  // short red collision message: auto-hides after 1.6 s AND can be dismissed with a click
  // (the listener is installed in main), so the pilot simply continues the flight. Cooldown
  // so a drone pressed against an obstacle does not spam it every frame.
  function showCrash(text){
    const now=performance.now();
    if(now-crashAt<1200) return;
    crashAt=now;
    const el=document.getElementById('crashToast');
    if(!el) return;
    document.getElementById('crashTitle').textContent=text;
    el.classList.add('show');
    clearTimeout(crashTimer);
    crashTimer=setTimeout(function(){ el.classList.remove('show'); },1600);
  }
  // ---- ring pass counter (read by renderLoop): which of the 3 rings of the current course
  // has the drone already flown THROUGH? ringPrevSide[i] holds the signed distance of the
  // drone centre from ring plane i of the previous frame -> a sign change = plane crossed,
  // and if that crossing happened inside the opening (not somewhere outside the ring) the
  // ring counts. resetScene() resets everything for the new course.
  var passedRings=[false,false,false];
  var ringPrevSide=[null,null,null];
  var ringPassCount=0;
  function updateRingBadge(){
    const el=document.getElementById('ringBadge');
    if(!el) return;
    // training mode has no rings at all -> the counter badge stays hidden
    el.style.display=(courseMode==='training')?'none':'';
    if(ringPassCount>=3){
      el.textContent='3 von 3 Ringen - jetzt landen!';
      el.classList.add('done');
    }else{
      el.textContent='Ringe: '+ringPassCount+' von 3';
      el.classList.remove('done');
    }
  }
  // Distance from a point to the centreline circle of a ring (no contact threshold). Same
  // formula as the ring branch of obstacleContact below; the escape loop uses it to STEER to
  // an exact clearance, not just to "somewhere outside".
  function ringGap(o, sx, sy, sz){
    const dx=sx-o.x, dy=sy-o.y, dz=sz-o.z;
    const a=dx*o.ax+dy*o.ay+dz*o.az;// component along the ring axis
    const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// component in the ring plane
    const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);// distance from the ring axis
    return Math.sqrt((rl-o.R)*(rl-o.R)+a*a);
  }
  // Contact test of the drone sphere (centre sx/sy/sz) against ONE obstacle. Returns null
  // when there is enough clearance, otherwise a small info object holding the measured gap
  // and the geometry needed to push the drone out. Shared by the per-frame check in
  // renderLoop and by the escape loop that frees a drone which is already in contact.
  function obstacleContact(o, sx, sy, sz){
    if(o.kind==='ring'){
      // distance from the drone centre to the torus centreline circle
      const dx=sx-o.x, dy=sy-o.y, dz=sz-o.z;
      const a=dx*o.ax+dy*o.ay+dz*o.az;// component along the ring axis
      const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// component in the ring plane
      const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);// distance from the ring axis
      const d=Math.sqrt((rl-o.R)*(rl-o.R)+a*a);
      const need=o.tube+droneColR;
      if(d<need) return {kind:'ring', o:o, d:d, need:need, dx:dx, dy:dy, dz:dz,
                         rx:rx, ry:ry, rz:rz, rl:rl};
    }else{
      // distance from the drone centre to the vertical post segment
      const cy=Math.max(o.y0,Math.min(o.y1,sy));
      const dx=sx-o.x, dy=sy-cy, dz=sz-o.z;
      const rr=o.r+droneColR;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2<rr*rr) return {kind:'post', o:o, d:Math.sqrt(d2), need:rr, dx:dx, dy:dy, dz:dz};
    }
    return null;
  }
  var main = function () {
    // get the target canvas and read its width and height
    let can=document.getElementById('can');
    let w = 600;// width
    let h = 600;// height

    //■ Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xccddff);

    //■ Camera
    //THREE.PerspectiveCamera( field of view (degrees), aspect ratio, nearest visible distance, farthest visible distance );
    camera = new THREE.PerspectiveCamera(25, w/h, 1, 10000);
    camera.position.set(0, 100, 150);// set the camera position
    //camera.rotation.set(0,8,0);// set the camera rotation to (0,0,0) degrees
    camera.lookAt(new THREE.Vector3(0, 0, 0));// point the camera at the (0,0,0) coordinate
    scene.add(camera);// add the camera to the scene

    //■ Renderer
    renderer = new THREE.WebGLRenderer({canvas:can, antialias: true});// antialiasing enabled
    renderer.setSize(w, h);
    // enable shadow maps
    renderer.shadowMap.enabled = true;
    //renderer.setClearColor(0x000000, 1);// set the background color

    //■ Sky
    let sky=new THREE.Sky();
    sky.scale.setScalar(50000);
    sky.material.uniforms.turbidity.value=1.0;// atmospheric transparency
    sky.material.uniforms.rayleigh.value=0.06;// blue light scattering (blue sky)
    sky.material.uniforms.mieCoefficient.value=0.0005;// sunlight scattering - Mie coefficient (white haze)
    sky.material.uniforms.mieDirectionalG.value=0.8; // sunlight scattering - Mie directional G
    sky.material.uniforms.sunPosition.value.x= 10000;// sun position
    sky.material.uniforms.sunPosition.value.y= 30000;// sun position
    sky.material.uniforms.sunPosition.value.z=-40000;// sun position
    scene.add(sky);

    //■ Cumulus clouds (procedural alpha texture on camera-facing sprites)
    // Built as a DataTexture instead of a 2D canvas: Safari can upload a lazily
    // GPU-rasterised canvas as garbage bytes (colour noise), raw pixel data is safe.
    function makeCloudTexture(){
      const size=256;
      const data=new Uint8Array(size*size*4);
      // lobes in sprite space: v = 0 is the BOTTOM of the cloud, v = 1 the top
      const lobes=[[0.50,0.38,0.30],[0.30,0.36,0.20],[0.70,0.36,0.20],
                   [0.40,0.53,0.22],[0.60,0.54,0.19],[0.50,0.65,0.15],
                   [0.22,0.44,0.13],[0.78,0.44,0.13]];
      for(let py=0;py<size;py++){
        const v=(py+0.5)/size;
        for(let px=0;px<size;px++){
          const u=(px+0.5)/size;
          let a=0;
          for(let i=0;i<lobes.length;i++){
            const dx=(u-lobes[i][0])/lobes[i][2];
            const dy=(v-lobes[i][1])/lobes[i][2];
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d<1){
              // same alpha curve as the old canvas radial gradients:
              // 0.95 at the core, 0.70 at 55% of the radius, 0 at the rim
              const t=d<0.55 ? (0.95+(0.70-0.95)*(d/0.55))
                             : (0.70*(1-(d-0.55)/0.45));
              a=t+a*(1-t);// source-over: the lobes merge into one cloud mass
            }
          }
          // cumulus have a flat base: fade out below v = 0.336 (gone at v = 0.078)
          if(v<0.336){
            let t=(v-0.078)/0.258;
            if(t<0){t=0;}
            if(t>1){t=1;}
            t=t*t*(3-2*t);
            a*=t;
          }
          const o=(py*size+px)*4;
          data[o]=255; data[o+1]=255; data[o+2]=255;
          data[o+3]=(a*255)|0;
        }
      }
      const tex=new THREE.DataTexture(data,size,size,THREE.RGBAFormat);
      tex.flipY=false;// data is written bottom-up, so no vertical flip is needed
      tex.minFilter=THREE.LinearFilter;// smooth edges (DataTexture defaults to Nearest)
      tex.magFilter=THREE.LinearFilter;
      tex.generateMipmaps=false;
      tex.wrapS=THREE.ClampToEdgeWrapping;
      tex.wrapT=THREE.ClampToEdgeWrapping;
      tex.needsUpdate=true;
      return tex;
    }
    let cloudTex=makeCloudTexture();
    clouds=new THREE.Group;// global, so renderLoop can drift it (like drone/drone1..4)
    blinkStart=0;// global clock start for the blinking rear/front lights
    let cloudData=[[-2600, 750,-5200,1400],[ 1800,1050,-6400,1200],[-900,1500,-7800,1700],
                   [ 3400,1250,-4300,1100],[-4200,1000,-3600,1300],[  700, 700,-3100, 900],
                   [ 4800,1600,-7200,1600],[-2000,1900,-8800,1500],[ 2500, 850, 3800,1200],
                   [-3300,1150, 5000,1400],[ 1000,1400, 6800,1300],[-5400, 950, -900,1100],
                   [ 5400,1300, 1600,1250]];
    for(let i=0;i<cloudData.length;i++){
      let d=cloudData[i];
      let sp=new THREE.Sprite(new THREE.SpriteMaterial({
        map:cloudTex, transparent:true, opacity:0.9, depthWrite:false, color:0xffffff
      }));
      sp.position.set(d[0],d[1],d[2]);
      sp.scale.set(d[3],d[3]*0.5,1);// cumulus are wider than they are tall
      clouds.add(sp);
    }
    scene.add(clouds);

    //■ Light sources------------------------------------------------
    // ambient light (light applied to every object from every direction) so unlit areas never become pitch black
    // kept low on purpose: the less fill light, the stronger the light/dark relief of the terrain
    var AmbientLight=new THREE.AmbientLight(0xffffff,0.10);
    scene.add( AmbientLight );// add the ambient light to the scene

    // spot light straight from above (color, intensity, distance, angle, penumbra[0-1], decay[1,1])
    // acts as a soft top fill so the drone keeps a shadow directly underneath it
    const spotLight=new THREE.SpotLight(0xffffff, 1.1, 4000,Math.PI/40, 0.8, 0.8);
    spotLight.position.set(0,3000,0);
    spotLight.target.position.set(0,0,0);
    spotLight.castShadow=true;// enable shadow casting
    spotLight.shadow.mapSize.width = 4096;  // make shadows smoother 4096
    spotLight.shadow.mapSize.height = 4096; // make shadows smoother 8192
    spotLight.shadow.radius=1;  // blur the shadows
    scene.add(spotLight);
    scene.add(spotLight.target);

    // low raking "sun" from the left side: hits the terrain at a flat angle (~12°), so slopes
    // facing the light get bright while slopes turned away fall into shadow -> strong relief
    const sunLight=new THREE.DirectionalLight(0xfff3e0, 3.2);
    sunLight.position.set(-1500,329,380);
    sunLight.target.position.set(0,0,0);
    sunLight.castShadow=true;// terrain and drone cast shadows across the ground
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left=-750;   // shadow camera covers the whole 1000x1000 floor
    sunLight.shadow.camera.right=750;
    sunLight.shadow.camera.top=750;
    sunLight.shadow.camera.bottom=-750;
    sunLight.shadow.camera.near=100;
    sunLight.shadow.camera.far=3000;
    sunLight.shadow.bias=-0.0004;       // avoid shadow acne on the ground
    sunLight.shadow.normalBias=1.0;     // avoid self-shadowing stripes on gentle slopes
    sunLight.shadow.radius=1;
    scene.add(sunLight);
    scene.add(sunLight.target);
    
    // point light                            color    intensity distance decay
    //light = new THREE.PointLight( 0xffffff, 0.1, 4, 2 );
    //scene.add( light );


    //■ Materials
    // transparent
    let mt1=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,transparent:true,opacity:0.3
    });
    // blue
    let mt2=new THREE.MeshLambertMaterial({
      color:0x0022cc,side:THREE.FrontSide
    });
    // red
    let mt3=new THREE.MeshBasicMaterial({
      color:0xff3333, 
      side:THREE.FrontSide
    });
    // landing pad field: textured with landing.png
    // (the image carries an alpha channel -> transparent areas show the ground beneath)
    let padTexture=new THREE.TextureLoader().load('landing.png');
    let mt4=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      map:padTexture,
      transparent:true,// honour the alpha channel of landing.png
      alphaTest:0.1,   // fully transparent pixels are discarded, so no sorting artefacts
    });
    // blue
    let mt5=new THREE.MeshBasicMaterial({
      color:0x6666ff, 
      side:THREE.FrontSide
    });
    // floor
    let floorTexture=new THREE.TextureLoader().load('flag_g.jpg');// JPEG 512x512: 152 KB instead of 2.5 MB PNG
    floorTexture.wrapS=THREE.RepeatWrapping;
    floorTexture.wrapT=THREE.RepeatWrapping;
    // specify how often the texture repeats
    floorTexture.repeat.set(8,8);
    let mt6=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,
      map:floorTexture,
    });
    // white
    let mt7=new THREE.MeshLambertMaterial({
      color:0xffffff,side:THREE.FrontSide,transparent:false,opacity:1.0
    });
    // gray -> steel: bluish sheen so the drone stands out from the ground
    // (Phong instead of Lambert: only Phong has a specular highlight for the metal look)
    let mt8=new THREE.MeshPhongMaterial({
      color:0x9fb9dd, specular:0xc2d8f7, shininess:48, side:THREE.FrontSide
    });
    // dark gray -> light gray plastic (matte, only a weak sheen)
    let mt9=new THREE.MeshPhongMaterial({
      color:0xd2d5da, specular:0x666666, shininess:10, side:THREE.FrontSide
    });
    // deck lid: the ladybug drawing on top of the fuselage
    // (deckel.png carries an alpha channel -> the corners of the image stay open)
    let deckelTexture=new THREE.TextureLoader().load('deckel.png');
    let mt10=new THREE.MeshLambertMaterial({
      color:0xffffff, side:THREE.FrontSide,
      map:deckelTexture,
      transparent:true,// honour the alpha channel of deckel.png
      alphaTest:0.1,   // fully transparent pixels are discarded -> no sorting artefacts
    });
    // glossy black: landing legs and propeller blades, like the legs and antennae of a ladybug
    // (Phong: black diffuse + strong tight specular highlight = wet-looking shine)
    let mt11=new THREE.MeshPhongMaterial({
      color:0x0a0a0a, specular:0x9a9a9a, shininess:70, side:THREE.FrontSide
    });


    // box geometry
    let bg=new THREE.BoxGeometry(1,1,1);
    // sphere geometry
    let sg =new THREE.SphereGeometry(0.5,16,16,0,      Math.PI,  0,Math.PI);
    // sphere geometry (hemisphere)
    let sg2=new THREE.SphereGeometry(0.5,16,16,Math.PI,Math.PI*2,0,Math.PI);
    // plane geometry
    let pg=new THREE.PlaneGeometry(1,1,1,1);
    // cylinder geometry
    let cg=new THREE.CylinderGeometry(1,1,1,32,1,false,0,Math.PI*2);

    // rounded box: every vertex that lies within r of an edge or a corner is pulled onto
    // the surrounding cylinder/sphere surface of radius r -> slightly rounded edges
    function rbox(w,h,d,r){
      const hx=w/2, hy=h/2, hz=d/2;
      const ix=hx-r, iy=hy-r, iz=hz-r;
      // subdivide finely enough that the rounding strip gets its own vertices
      const seg=v=>Math.max(2, Math.min(40, Math.ceil(v/(2*r))));
      const g=new THREE.BoxGeometry(w,h,d,seg(w),seg(h),seg(d));
      const p=new THREE.Vector3(), q=new THREE.Vector3(), nv=new THREE.Vector3();
      const pos=g.attributes.position, nor=g.attributes.normal;
      for(let i=0;i<pos.count;i++){
        p.fromBufferAttribute(pos,i);
        q.set(Math.min(ix,Math.max(-ix,p.x)), Math.min(iy,Math.max(-iy,p.y)), Math.min(iz,Math.max(-iz,p.z)));
        nv.copy(p).sub(q);
        if(nv.lengthSq()>1e-12){
          nv.normalize();
          pos.setXYZ(i, q.x+nv.x*r, q.y+nv.y*r, q.z+nv.z*r);
          nor.setXYZ(i, nv.x, nv.y, nv.z);
        }
      }
      pos.needsUpdate=true;
      nor.needsUpdate=true;
      return g;
    }

    // rounded cylinder: the profile (radius vs. height) gets an arc of radius r at the
    // top and bottom rim instead of a sharp 90 degree edge, then it is revolved around Y
    function rcyl(R,h,r,seg){
      r=Math.min(r, R*0.9, h*0.45);
      const pts=[];
      const add=(x,y)=>{
        const p=pts[pts.length-1];
        if(!p || Math.abs(p.x-x)>1e-9 || Math.abs(p.y-y)>1e-9) pts.push(new THREE.Vector2(x,y));
      };
      const arc=(cx,cy,a0,a1,n)=>{
        for(let i=0;i<=n;i++){
          const a=a0+(a1-a0)*i/n;
          add(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
        }
      };
      add(0,-h/2);            // bottom cap (center -> rim)
      add(R-r,-h/2);
      arc(R-r,-h/2+r, -Math.PI/2, 0, 6);   // rounded bottom rim
      add(R, h/2-r);          // straight side
      arc(R-r, h/2-r, 0, Math.PI/2, 6);    // rounded top rim
      add(0, h/2);            // top cap (rim -> center)
      return new THREE.LatheGeometry(pts, seg);
    }
    //let planeGeometry=new THREE.PlaneGeometry(0.1, 0.1, 1, 1);
    //let sphereGeometry =new THREE.SphereGeometry(0.05,16,16,0,2*Math.PI);

    // floor (uneven: the height field is displaced once at creation time, flat near pad 1)
    let fpg=new THREE.PlaneGeometry(1000,1000,160,160);
    let fpos=fpg.attributes.position;

    // deterministic pseudo-random value noise (integer hash + smooth bilinear interpolation).
    // No texture and nothing is animated: the field is evaluated once per vertex below, so
    // the irregular terrain costs nothing at run time.
    const hash2=(ix,iy)=>{
      let n=(Math.imul(ix,374761393)^Math.imul(iy,668265263))|0;
      n=Math.imul(n^(n>>>13),1274126177);
      return ((n^(n>>>16))>>>0)/4294967295;// 0..1
    };
    const vnoise=(x,y,cell)=>{
      const fx=x/cell, fy=y/cell;
      const ix=Math.floor(fx), iy=Math.floor(fy);
      const sx=fx-ix, sy=fy-iy;
      const ux=sx*sx*(3-2*sx), uy=sy*sy*(3-2*sy);// smoothstep -> soft seams, no grid lines
      const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
      return (a+(b-a)*ux)*(1-uy)+(c+(d-c)*ux)*uy;// 0..1
    };

    // full height field: three octaves of value noise -> broad swells, medium bumps and bowls
    // plus fine raggedness, all in irregular shapes (instead of the regular sine stripes before)
    const buildTerrain=()=>{
      for(let i=0;i<fpos.count;i++){
        let x=fpos.getX(i), y=fpos.getY(i);
        let h=(vnoise(x,y,170)-0.5)*1.5           // broad, irregular swells
             +(vnoise(x+812,y-371,64)-0.5)*0.85   // medium bumps and bowls
             +(vnoise(x-255,y+693,26)-0.5)*0.3;   // fine raggedness (near the vertex spacing)
        h=Math.max(-1,Math.min(1,h));// rises capped at +1: ground never comes above y = 0
        // keep the area around landing pad 1 perfectly flat (r < 30, full at r >= 100)
        let r=Math.sqrt(x*x+y*y);
        let fade=Math.min(Math.max((r-30)/70,0),1);
        fade=fade*fade*(3-2*fade);
        // sinks are deepened x6 -> strong light/dark relief from the raking sun alone
        let zz=(h>0 ? h : h*6)*fade;
        // ---- coastline (the plane is rotated -90 deg about x -> world z = -geometry y):
        // inside the water region the displaced height is replaced by the sea profile.
        // The beach strip (up to 40 units INLAND of the coast) is lifted to just above the
        // waterline - otherwise a dry valley could sink below sea level right at the shore
        // and the water plane would end in mid-air. From the shoreline the ground ramps
        // smoothly down to the uneven sea bed, so the band AND both bays get a natural
        // sloping shore instead of a cliff. (Outside -40 the height field stays untouched.)
        const wz=-y;// world z of this vertex
        const d=coastZ(x)-wz;// >0: inside the sea region, distance behind the coastline
        if(d>-40){
          const base=Math.max(zz,WATER_LEVEL+0.3);// dry shore: at least 0.3 above the water
          if(d<=0){
            zz=base;
          }else{
            let t=Math.min(d/30,1); t=t*t*(3-2*t);// smoothstep ramp -> soft shoreline
            zz=base+((WATER_SEABED+h*0.5)-base)*t;// sea bed follows the noise a little
          }
        }
        fpos.setZ(i, zz);
      }
      // flatten the ground underneath the 2nd pad (flat within 25, fading out to 55),
      // the same idea as the flat disc around pad 1 at the origin
      // (the floor plane is rotated -90 deg about x -> world (x,z) = geometry (x,-y))
      for(let i=0;i<fpos.count;i++){
        let x=fpos.getX(i), y=fpos.getY(i);
        let dx=x-pad2.x, dy=y-(-pad2.z);
        let r2=Math.sqrt(dx*dx+dy*dy);
        if(r2<55){
          let f2=Math.min(Math.max((r2-25)/30,0),1);
          f2=f2*f2*(3-2*f2);
          fpos.setZ(i, fpos.getZ(i)*f2);// pull the displaced height back to 0
        }
      }
      fpg.computeVertexNormals();
      fpos.needsUpdate=true;// the field is also rebuilt by resetScene()
      fpg.attributes.normal.needsUpdate=true;
    };

    // 2nd landing site: random direction and distance (140-260 units from pad 1) - rolled
    // again by resetScene(), so every start of a new course puts it somewhere else.
    // The whole course corridor must be DRY: a strip of +/-75 units around the chord
    // (the Bezier bows reach at most ~60 units sideways, see courseCurve) is sampled
    // against the coastline, because pad 2, the route line and the ring posts may never
    // end up in the sea - the course has to stay visible on land.
    const corridorDry=(x0,z0,x1,z1,margin)=>{
      const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)||1;
      const nx=-dz/len, nz=dx/len;// unit vector perpendicular to the chord
      for(let i=0;i<=24;i++){
        const t=i/24;
        for(let s=-2;s<=2;s++){
          const px=x0+dx*t+nx*margin*0.5*s, pz=z0+dz*t+nz*margin*0.5*s;
          if(isWater(px,pz)) return false;
        }
      }
      return true;
    };
    const newPad2=()=>{
      for(let k=0;k<400;k++){
        const pad2Angle=Math.random()*Math.PI*2;
        const pad2Dist=140+Math.random()*120;
        const x=Math.cos(pad2Angle)*pad2Dist, z=Math.sin(pad2Angle)*pad2Dist;
        if(corridorDry(0,0,x,z,75)){ pad2.x=x; pad2.z=z; return; }
      }
      // practically impossible fallback (400 rolls rejected): straight INLAND (+z),
      // which is always dry - the coastline never reaches further than z = -57
      pad2.x=0; pad2.z=230;
    };
    newPad2();
    buildTerrain();
    let m0=new THREE.Mesh(fpg,mt6);
    m0.rotation.set(-Math.PI/2,0,0);
    m0.castShadow=true;// the terrain itself casts shadows into its own valleys (relief)
    m0.receiveShadow=true;
    m0.position.set(0,-1,0);
    scene.add(m0);

    m0=new THREE.Mesh(pg,mt4);
    m0.rotation.set(-Math.PI/2,0,0);
    //m0.castShadow=true;
    m0.receiveShadow=true;
    m0.scale.set(30,29.3,1);// 50% larger than before, proportions of the 980x957 image kept
    m0.position.set(0,0,0);
    scene.add(m0);

    // ---- 2nd landing site: same landing.png pad, placed at the random position chosen above
    let pad2Mesh=new THREE.Mesh(pg,mt4);
    pad2Mesh.rotation.set(-Math.PI/2,0,0);
    pad2Mesh.receiveShadow=true;
    pad2Mesh.scale.set(30,29.3,1);// identical size to pad 1
    pad2Mesh.position.set(pad2.x,0,pad2.z);
    pad2Mesh.name="pad2";
    scene.add(pad2Mesh);

    // ---- sea: the water surface of the landscape change. The polygon follows the
    // coastline (both bays included) out to the far edge of the terrain, so the plane
    // exists exactly where isWater() says the sea is. ShapeGeometry lives in its own XY
    // plane -> shapeY = -worldZ; the MESH (not the geometry) is turned flat, because
    // THREE.Water derives its mirror plane from the mesh's local +Z axis.
    {
      const shape=new THREE.Shape();
      const X0=-500, X1=500, NS=126;// terrain spans -500..500, coast sampled every ~8 units
      shape.moveTo(X0,-coastZ(X0));// start of the coastline, west end
      for(let i=1;i<=NS;i++){
        const x=X0+(X1-X0)*i/NS;
        shape.lineTo(x,-coastZ(x));// walk the coastline (bays included) to the east
      }
      shape.lineTo(X1,500);// world z = -500 -> shapeY = 500: the far edge of the terrain
      shape.lineTo(X0,500);
      const wgeo=new THREE.ShapeGeometry(shape);
      const waterNormals=new THREE.TextureLoader().load('Water_2_M_Normal.jpg');
      waterNormals.wrapS=waterNormals.wrapT=THREE.RepeatWrapping;// waves scroll over the sea
      waterMesh=new THREE.Water(wgeo,{
        textureWidth:512,
        textureHeight:512,
        waterNormals:waterNormals,
        // same direction as the sky's sun (Sky.js above), so highlight and sky match
        sunDirection:new THREE.Vector3(10000,30000,-40000).normalize(),
        sunColor:0xffffff,
        waterColor:0x1b4a5e,// deep blue-green instead of the grey default
        distortionScale:3.0,// wave distortion of the reflection (default 20 is too wild)
        fog:false
      });
      waterMesh.rotation.x=-Math.PI/2;// local +Z (mirror normal) points up in the world
      waterMesh.position.y=WATER_LEVEL-1;// terrain units -> world (floor plane sits at -1)
      waterMesh.name='water';
      scene.add(waterMesh);
    }

    // terrain height at a world x/z position: the red route line, the ring posts and the
    // ground collision in renderLoop() are placed/measured with it. Assigned to the GLOBAL
    // floorY (the closure keeps hold of the terrain grid), because renderLoop needs it.
    // (the floor plane is rotated -90 deg about x -> world (x,z) = geometry (x,-z);
    //  PlaneGeometry(1000,1000,160,160) -> 161x161 vertices, spacing 6.25, row index = iy*161+ix)
    floorY=(wx,wz)=>{
      const fx=(wx+500)/6.25, fy=(500+wz)/6.25;
      const x0=Math.min(Math.max(Math.floor(fx),0),159), y0=Math.min(Math.max(Math.floor(fy),0),159);
      const x1=Math.min(x0+1,160), y1=Math.min(y0+1,160);
      const tx=Math.min(Math.max(fx-x0,0),1), ty=Math.min(Math.max(fy-y0,0),1);
      const z=(ix,iy)=>fpos.getZ(iy*161+ix);
      const h=(z(x0,y0)*(1-tx)+z(x1,y0)*tx)*(1-ty)+(z(x0,y1)*(1-tx)+z(x1,y1)*tx)*ty;
      return -1+h;// the floor mesh sits at y = -1
    };

    // ---- course: a piecewise cubic Bezier "snake" from pad 1 (origin) to pad 2. The chord
    // is split into 3-4 segments; every segment bows out to ONE side (both control points
    // share the side) and the side alternates from segment to segment -> a serpentine that
    // crosses the straight line again and again. End tangent of segment k is identical to
    // the start tangent of segment k+1, so the chain stays perfectly smooth (G1 continuous).
    // Bow amplitude and side are rolled again by buildRouteLine() with every new course,
    // so no two starts look the same.
    let routeCurve=null;// current Bezier path (x/z plane), rebuilt with every course
    const courseCurve=()=>{
      const len=Math.hypot(pad2.x,pad2.z);
      const ux=pad2.x/len, uz=pad2.z/len;// unit vector along the chord
      const nx=-uz, nz=ux;// unit vector perpendicular to it
      const nSeg=(len>190&&Math.random()<0.7)?4:3;// 3 or 4 bows -> snake with 2-3 direction changes
      const L=len/nSeg;// chord length of one segment
      const h=L*0.3;// control point handle along the chord (tangent continuity)
      let side=(Math.random()<0.5)?-1:1;
      const path=new THREE.CurvePath();
      for(let k=0;k<nSeg;k++){
        const off=side*L*(0.35+Math.random()*0.35);// bow: 0.35..0.7 of a segment, never loops
        const x0=ux*L*k, z0=uz*L*k;
        const x1=ux*L*(k+1), z1=uz*L*(k+1);
        path.add(new THREE.CubicBezierCurve3(
          new THREE.Vector3(x0,0,z0),
          new THREE.Vector3(x0+ux*h+nx*off,0,z0+uz*h+nz*off),
          new THREE.Vector3(x1-ux*h+nx*off,0,z1-uz*h+nz*off),
          new THREE.Vector3(x1,0,z1)));
        side=-side;// next bow to the other side -> snake
      }
      routeCurve=path;
    };
    // build the red route line for the current course: samples the Bezier curve above and
    // hugs the terrain (height sampled from the floor grid), because the curved route also
    // crosses valleys where a line at a fixed height would hover in the air or sink.
    // Called again by resetScene(), the old geometry is disposed so repeated restarts do not
    // leak GPU memory. (MeshBasicMaterial -> the line stays fully red, whatever the light does)
    const buildRouteLine=()=>{
      const old=scene.getObjectByName('pathLine');
      if(old){ scene.remove(old); old.geometry.dispose(); }
      courseCurve();// roll a new Bezier curve for this course
      const len=Math.hypot(pad2.x,pad2.z);
      const nSeg=Math.max(64,Math.round(len/2));// the snake bends much more than the old S
      const linePts=[];
      for(let i=0;i<=nSeg;i++){
        const p=routeCurve.getPoint(i/nSeg);
        linePts.push(new THREE.Vector3(p.x, floorY(p.x,p.z)+0.35, p.z));
      }
      const lineCurve=new THREE.CatmullRomCurve3(linePts);
      const pathLine=new THREE.Mesh(new THREE.TubeGeometry(lineCurve, nSeg, 0.35, 6, false), mt3);
      pathLine.name="pathLine";
      scene.add(pathLine);
    };
    buildRouteLine();

    // three colored rings on posts of different heights, standing EXACTLY on the course:
    // every ring sits at 25% / 50% / 75% of the current Bezier snake (evenly along the arc),
    // its post rises from the terrain at that point and the ring plane is turned
    // perpendicular to the course direction, so the drone can fly straight through it.
    // Ring size: the inner opening is 150% of the drone (rotor span ~28 units) ->
    // centre radius 22.5 with a 1.5 thick tube = inner diameter 42 = 1.5 x 28.
    // Post heights are rolled again for every ring and every course; together with the new
    // curve that changes the whole slalom with each start (resetScene disposes the old
    // group, no GPU leak). Every ring and post is also entered in the global obstacle list
    // that renderLoop() checks for collisions.
    const ringMats=[
      // amber, green, pink - all three pop against the light blue sky and the dark ground
      new THREE.MeshStandardMaterial({color:0xfbbf24,roughness:0.35,metalness:0.05,emissive:0xfbbf24,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0x1c6136,roughness:0.35,metalness:0.05,emissive:0x4ade80,emissiveIntensity:0.25}),
      new THREE.MeshStandardMaterial({color:0xd03100,roughness:0.35,metalness:0.05,emissive:0xf472b6,emissiveIntensity:0.25})
    ];
    const postMat=new THREE.MeshStandardMaterial({color:0x334155,roughness:0.55,metalness:0.6});
    const buildRings=()=>{
      const old=scene.getObjectByName('ringGroup');
      if(old){ scene.remove(old); old.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
      obstacles=[];// fresh collision list for the new course (global, read by renderLoop)
      // training mode: plain flight from pad 1 to pad 2 - no rings, no posts. The empty
      // obstacle list already switches off renderLoop's collision check and pass counter
      // (both sit behind `if(obstacles.length)` / iterate the list).
      if(courseMode==='training'){ updateRingBadge(); return; }
      const g=new THREE.Group(); g.name='ringGroup';
      const R=22.5, TUBE=1.5;// inner opening 42 = 150% of the ~28 wide drone
      const tList=[0.25,0.5,0.75];
      for(let i=0;i<3;i++){
        const p=routeCurve.getPoint(tList[i]);
        const tan=routeCurve.getTangent(tList[i]);
        const fy=floorY(p.x,p.z);
        const postH=6+Math.random()*10;// 6..16, different for every ring and every course
        const post=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.2,postH,10),postMat);
        post.position.set(p.x, fy+postH/2, p.z);// stands on the terrain
        post.castShadow=true;
        const ring=new THREE.Mesh(new THREE.TorusGeometry(R,TUBE,12,64),ringMats[i]);
        ring.position.set(p.x, fy+postH+R, p.z);// the post reaches the lower edge of the ring
        // the torus lies in its XY plane (axis = local z) -> turn that axis onto the course
        ring.rotation.y=Math.atan2(tan.x,tan.z);
        ring.castShadow=true;
        g.add(post); g.add(ring);
        // collision shapes: the ring as its centreline circle, the post as a vertical segment
        obstacles.push({kind:'ring', x:p.x, y:fy+postH+R, z:p.z, R:R, tube:TUBE,
                        ax:tan.x, ay:0, az:tan.z});
        obstacles.push({kind:'post', x:p.x, z:p.z, y0:fy, y1:fy+postH, r:1.2});
      }
      scene.add(g);
    };
    buildRings();

    // corridor light: a wide, soft, non-shadowing spot over the middle of the course so the
    // whole stretch between pad 1 and pad 2 is evenly lit
    const pathLight=new THREE.SpotLight(0xffffff, 0.9, 4000, 0.5, 0.5, 0.8);
    pathLight.name="pathLight";// no shadows on purpose: it is a fill light for the route
    scene.add(pathLight);
    scene.add(pathLight.target);
    const aimPathLight=()=>{
      // aim at the middle of the CURVED course (not the chord) and open the cone wide
      // enough to reach the farthest point of the S-curve
      const mid=routeCurve.getPoint(0.5);
      let maxR=0;
      for(let i=0;i<=16;i++){// the snake bows out further than the old single S
        const p=routeCurve.getPoint(i/16);
        maxR=Math.max(maxR,Math.hypot(p.x,p.z));
      }
      const H=maxR*0.9+50;
      pathLight.position.set(mid.x, H, mid.z);
      pathLight.target.position.set(mid.x, 0, mid.z);
      pathLight.target.updateMatrixWorld();
      pathLight.angle=Math.atan((maxR+45)/H);// angle from the farthest course point -> everything lit
    };
    aimPathLight();
    

    // drone group
    drone=new THREE.Group;
    // rotation order: roll (Z) and pitch (X) about the drone's own axes, yaw (Y) about the
    // world up-axis. With the default 'XYZ' the pitch would be applied LAST, i.e. about the
    // world x axis: the nose would always tip the same way in space (e.g. tail down when
    // flying towards the camera, or a visible roll instead of a pitch when flying along x)
    // instead of dipping into the direction of flight.
    drone.rotation.order='YXZ';
    drone.castShadow=true;
    drone.receiveShadow=true;
    // ladybug fuselage: the body outline is traced from deckel.png instead of being a plain
    // cylinder. deckelOutline holds 90 radial distances (in image pixels, measured from the
    // alpha centroid of the 411x431 image, circularly smoothed over ~20 deg so the drawing
    // strokes do not ripple the contour): index i = angle i*4 deg, 0 deg = image right,
    // 90 deg = image bottom, 270 deg = image top = the head = the drone's nose (-z).
    const deckelOutline=[204.05,204.64,205.23,205.91,206.82,207.59,208.09,208.64,209.18,209.68,
      210.09,210.59,211,211.5,211.82,212.14,212.32,212.55,212.68,212.64,212.55,212.36,212.36,
      212.32,212.36,212.55,212.91,212.91,212.68,212.41,212.09,211.73,211.36,211.05,210.45,
      209.95,209.45,209,208.45,208,207.68,207.09,206.5,205.95,205.45,204.82,204.32,203.91,
      203.36,202.59,201.91,201.36,201,200.55,201,201.55,203.05,204.95,207.41,209.77,212.05,
      213.91,215.32,216.45,217.23,217.68,217.86,217.91,217.73,217.5,217.09,216.64,215.86,215,
      214,212.64,211.14,209.14,206.73,204.64,203,201.77,201.18,200.91,201.41,201.91,202.41,
      202.91,203.32,203.64];
    // image px -> world units: the longest radius (the head tip, 217.91 px) becomes 4.7,
    // so the flat top cap matches the old disc radius and the side wall (which the bevel
    // pushes 0.3 further out) reaches exactly 5.0 at its widest - same size as the old
    // rounded cylinder (radius 5, height 2).
    const dk=4.7/Math.max.apply(null,deckelOutline);
    const deckPts=deckelOutline.map(function(r,i){
      const a=i/deckelOutline.length*Math.PI*2;
      // image (x right, y down) -> shape (x, -y): after rotateX(-PI/2) the image top
      // (head) ends up at -z, i.e. the drone's nose
      return new THREE.Vector2(r*Math.cos(a)*dk, -r*Math.sin(a)*dk);
    });
    const deckShape=new THREE.Shape(deckPts);
    // extruded shell: depth 1.4 + 2 x bevelThickness 0.3 = height 2, bevelSize 0.3 rounds
    // the rim (top/bottom edges taper inward, the widest ring sits at mid height)
    const bodyGeo=new THREE.ExtrudeGeometry(deckShape,
      {depth:1.4,bevelEnabled:true,bevelThickness:0.3,bevelSize:0.3,bevelSegments:4,steps:1,curveSegments:1});
    bodyGeo.rotateX(-Math.PI/2);
    bodyGeo.translate(0,-0.7,0);// the bevel adds 0.3 top and bottom -> centre the body on y=0
    md0=new THREE.Mesh(bodyGeo,mt8);
    md0.castShadow=true;
    //md0.receiveShadow=true;
    md0.position.set(0,4,0);// spans y 3..5 like the old cylinder
    drone.add(md0);

    // smooth shading for the extruded shell: ExtrudeGeometry is non-indexed, so every copy
    // of a shared corner (wall, bevel, cap rim) carries its own normal. The wall and bevel
    // copies disagreed -> harsh vertical banding on the flanks. Recompute ONE area-weighted
    // normal per unique vertex position instead: the flanks shade evenly and the rim gets a
    // soft, rounded highlight (the caps keep 0,1,0 in their interior).
    (function(){
      const pa=bodyGeo.attributes.position, na=bodyGeo.attributes.normal;
      const acc={}, A=new THREE.Vector3(), B=new THREE.Vector3(), C=new THREE.Vector3(),
            e1=new THREE.Vector3(), e2=new THREE.Vector3(), fn=new THREE.Vector3();
      for(let t=0;t<pa.count;t+=3){// accumulate the face normal of every triangle
        A.fromBufferAttribute(pa,t); B.fromBufferAttribute(pa,t+1); C.fromBufferAttribute(pa,t+2);
        fn.crossVectors(e1.subVectors(B,A), e2.subVectors(C,A));
        for(let k=0;k<3;k++){
          const key=pa.getX(t+k).toFixed(4)+'|'+pa.getY(t+k).toFixed(4)+'|'+pa.getZ(t+k).toFixed(4);
          const v=acc[key]||(acc[key]=new THREE.Vector3());
          v.add(fn);
        }
      }
      const vkey=function(i){ return pa.getX(i).toFixed(4)+'|'+pa.getY(i).toFixed(4)+'|'+pa.getZ(i).toFixed(4); };
      for(let i=0;i<pa.count;i++){
        const v=acc[vkey(i)];
        if(v && v.lengthSq()>1e-12){ v.normalize(); na.setXYZ(i,v.x,v.y,v.z); }
      }
      na.needsUpdate=true;
    })();

    // deck surface of the fuselage: the same traced outline as a flat lid carrying
    // deckel.png, laid 0.01 above the body cap (y = 5.0) so the two never z-fight.
    // ShapeGeometry stores the raw shape coordinates as UVs, so they are rewritten here:
    // u = image x / 411, v = 1 - image y / 431 (v flipped -> image top = v 1 = nose side),
    // image px = centroid + shape coord / dk
    const deckGeo=new THREE.ShapeGeometry(deckShape);
    {
      const dp=deckGeo.attributes.position, duv=deckGeo.attributes.uv;
      for(let i=0;i<dp.count;i++){
        duv.setXY(i, (206.84+dp.getX(i)/dk)/411, 1-(218.75-dp.getY(i)/dk)/431);
      }
      duv.needsUpdate=true;
    }
    let md0deck=new THREE.Mesh(deckGeo, mt10);
    md0deck.rotation.x=-Math.PI/2;// lay it flat, the top of the image points to the nose (-z)
    md0deck.position.set(0,5.01,0);
    drone.add(md0deck);

    // create the rods supporting the rotors from box geometry
    md1=new THREE.Mesh(bg,mt8);
    md1.castShadow=true;
    //md1.receiveShadow=true;
    md1.scale.set(20,1,1);
    md1.position.set(0, 4.5, 0);
    md1.rotation.set(0,Math.PI*0.25,0);
    drone.add(md1);
    // create the rods supporting the rotors from box geometry
    md2=new THREE.Mesh(bg,mt8);
    md2.castShadow=true;
    //md2.receiveShadow=true;
    md2.scale.set(20,1,1);
    md2.position.set(0, 4.5, 0);
    md2.rotation.set(0,-Math.PI*0.25,0);
    drone.add(md2);

    });

        fpvAlignQ.multiply(fpvTiltQ.setFromAxisAngle(fpvAxisX, fpvTilt*Math.PI/180));

    };
    const setAlign=function(mode){

    const camBackOffset=new THREE.Vector3();

    const TILT_MIN=-30, TILT_MAX=90, TILT_SPAN=TILT_MAX-TILT_MIN;

    const knob=document.getElementById('tiltKnob');

  function renderLoop () {
    if(!fpv) controls.update();// in FPV the camera is placed below -> the orbit control must not fight it
    // rotate the propeller blades (rotors)
    drone1.rotation.y+=Math.PI/8;
    drone2.rotation.y+=Math.PI/8;
    drone3.rotation.y+=Math.PI/8;
    drone4.rotation.y+=Math.PI/8;

    // slow cloud drift (wraps while still far outside the camera view)
    for(let i=0;i<clouds.children.length;i++){
      let cl=clouds.children[i];
      cl.position.x+=1.5;
      if(cl.position.x>9000){cl.position.x=-9000;}
    }

    // blink the rear (red) and front (blue) marker boxes every 0.5 seconds
    let blinkOn=Math.floor((performance.now()-blinkStart)/500)%2===0;
    md3.visible=blinkOn;
    md4.visible=blinkOn;

    // wave animation: the normal map drifts over the sea surface, driven by the REAL
    // elapsed time (capped so a background tab cannot jump the waves ahead on focus)
    if(waterMesh){
      const nowT=performance.now();
      if(waterPrevT>0){
        waterMesh.material.uniforms.time.value+=Math.min((nowT-waterPrevT)/1000,0.1);
      }
      waterPrevT=nowT;
    }
    
    let limit=1.0;
    
    pos.vx *= 0.95;
    pos.vy *= 0.95;
    pos.vz *= 0.95;
    // every command that is currently held down acts in the SAME frame - independent ifs
    // instead of an else-if chain, so e.g. an arrow key and a WASD key fly together
    // (climb while accelerating, turn while moving). Opposite keys cancel out to net 0.
    if(held.has("up")){
      pos.vy+=0.1;
      if(pos.vy>limit){pos.vy=limit;}
    }
    if(held.has("dn")){
      pos.vy-=0.1;
      if(pos.vy<-limit){pos.vy=-limit;}
    }
    if(held.has("tl")){
      pos.turn += Math.PI/72;
    }
    if(held.has("tr")){
      pos.turn -= Math.PI/72;
    }
    if(held.has("mf")){
      pos.vz+=0.1;
      if(pos.vz>limit){pos.vz=limit;}
    }
    if(held.has("mb")){
      pos.vz-=0.1;
      if(pos.vz<-limit){pos.vz=-limit;}
    }
    if(held.has("ml")){
      pos.vx-=0.1;
      if(pos.vx<-limit){pos.vx=-limit;}
    }
    if(held.has("mr")){
      pos.vx+=0.1;
      if(pos.vx>limit){pos.vx=limit;}
    }

    pos.y += pos.vy;
    // ground: the drone may neither sink below the floor nor INTO the terrain - hills rise
    // above y=0, so the old flat y=0 test becomes a real terrain test (pads and the start
    // disc stay at 0 because of the max). Bounce behaviour is unchanged. Over the sea
    // groundY() reports the WATER SURFACE, so the drone lands on the water, not on the bed.
    const gy=groundY(pos.x,pos.z);
    if(pos.y<gy){
      pos.y -=pos.vy;
      pos.vy=-pos.vy*0.5;
      if(pos.y<gy) pos.y=gy;// safety net for large steps
    }
    // splash: one short red message when the drone touches down on the sea - exactly like
    // a ring impact (same showCrash, same click-to-dismiss). waterTouched limits it to one
    // message per dip, so floating on the waves does not re-trigger it every frame; the
    // beach strip never counts because the drone then rests ABOVE the waterline.
    if(isWater(pos.x,pos.z)&&pos.y<=WATER_LEVEL+0.05){
      if(!waterTouched){ waterTouched=true; showCrash('Drohne gewassert!'); }
    }else{
      waterTouched=false;
    }
    const preX=pos.x, preY=pos.y, preZ=pos.z;// start of this movement step (for the bounce-back)
    pos.x += Math.cos(-pos.turn-Math.PI/2)*pos.vz;
    pos.z += Math.sin(-pos.turn-Math.PI/2)*pos.vz;
    pos.x += Math.cos(-pos.turn)*pos.vx;
    pos.z += Math.sin(-pos.turn)*pos.vx;

    // ---- collision analysis: rings and posts of the current course. The drone is modelled
    // as a sphere around its centre (radius = half the rotor span, measured once from the
    // bounding box). A ring is its centreline circle, a post a vertical line segment.
    // On impact the drone is put back to the start of this movement step, its speed is
    // zeroed, a short red message appears (see showCrash) and an escape loop nudges the
    // drone CLEAR of every contact it is still in - without that nudge the start-of-step
    // position can still lie inside a contact shell (the low rim of a ring reaches through
    // the terrain when the post is short), the message would reappear on the very next
    // frame and the drone could never steer away (it was pinned). Flying exactly through
    // the middle of a ring stays collision-free: the opening (radius 21) is wider than the
    // drone sphere, so only the rim tube and the post below are dangerous.
    if(obstacles.length){
      if(droneColR<0){
        const b=new THREE.Box3().setFromObject(drone);
        droneColR=0.5*Math.max(b.max.x-b.min.x,b.max.z-b.min.z);
        droneColCY=0.5*(b.min.y+b.max.y)-drone.position.y;
      }
      const sx=pos.x, sy=pos.y+droneColCY, sz=pos.z;
      let hitKind='';//'ring' | 'post' - the first contact of this frame (it drives the message)
      for(let i=0;i<obstacles.length&&!hitKind;i++){
        const c=obstacleContact(obstacles[i], sx, sy, sz);
        if(c) hitKind=c.kind;
      }
      if(hitKind){
        pos.x=preX; pos.y=preY; pos.z=preZ;// back to the safe position of this frame's start
        pos.vx=0; pos.vy=0; pos.vz=0;// stop dead, the pilot has to steer around the obstacle
        // Escape: nudge the drone CLEAR of every contact it is still in. Without the nudge
        // the start-of-step position can lie inside a contact shell (the low rim of a ring
        // reaches down THROUGH the terrain when the post is short), the message would
        // reappear on the very next frame and every movement step would be reverted again -
        // the drone was pinned and could not be steered away. Each round pushes out of ONE
        // contact (surface normal to contact distance + ESC) and then re-checks, so chained
        // contacts (ring shell <-> the post below it) are cleared within the same frame
        // while collisionCount still advances only once. When the normal would drive the
        // drone INTO the terrain it slides out sideways instead - the terrain would
        // otherwise clamp it straight back into the shell on the next frame.
        const ESC=1.0;// extra clearance (world units) beyond the contact distance
        for(let round=0;round<6;round++){
          const gy=groundY(pos.x,pos.z);
          if(pos.y<gy) pos.y=gy;// never leave the escape below the terrain
          let c=null;// first contact at the current escape position
          for(let i=0;i<obstacles.length&&!c;i++){
            c=obstacleContact(obstacles[i], pos.x, pos.y+droneColCY, pos.z);
          }
          if(!c) break;// free - escape finished
          const o=c.o, need=c.need+ESC;
          if(c.kind==='ring'){
            // unit escape direction: from the nearest point of the centreline circle
            // through the drone centre; if the drone sits exactly ON the circle that
            // vector vanishes -> use the in-plane radial direction (leaves the tube too)
            let ux=c.dx, uy=c.dy, uz=c.dz, dl=c.d;
            if(c.rl>1e-6){
              ux-=o.R*c.rx/c.rl; uy-=o.R*c.ry/c.rl; uz-=o.R*c.rz/c.rl;
              dl=Math.sqrt(ux*ux+uy*uy+uz*uz);
            }
            if(dl<1e-6&&c.rl>1e-6){ux=c.rx/c.rl; uy=c.ry/c.rl; uz=c.rz/c.rl; dl=1;}
            let tx=pos.x, ty=pos.y+droneColCY, tz=pos.z;
            if(dl>1e-6){
              const k=(need-c.d)/dl;
              tx+=ux*k; ty+=uy*k; tz+=uz*k;
            }
            if(ty<groundY(tx,tz)){
              // normal push would end underground (drone under a low rim): slide out
              // sideways instead - away from the post column, or ALONG THE RING AXIS when
              // the drone sits exactly on the column (the gap grows linearly there, while
              // sideways across the axis it only grows quadratically). y is kept or lifted
              // onto rising terrain, so the terrain cannot clamp it back into the shell.
              let hx=pos.x-o.x, hz=pos.z-o.z;
              const hl=Math.hypot(hx,hz);
              if(hl>1e-6){hx/=hl; hz/=hl;}
              else {hx=o.ax; hz=o.az;}// along the axis (horizontal, unit length)
              let found=false;
              for(let t=0.5;t<=40;t+=0.5){
                const qx=pos.x+hx*t, qz=pos.z+hz*t;
                const cyy=Math.max(pos.y, groundY(qx,qz))+droneColCY;
                if(ringGap(o,qx,cyy,qz)>=need){tx=qx; tz=qz; ty=cyy; found=true; break;}
              }
              if(!found){tx=pos.x; ty=pos.y+droneColCY; tz=pos.z;}// keep, retry next round
            }
            pos.x=tx; pos.y=ty-droneColCY; pos.z=tz;
          }else{
            // post: the escape direction is horizontal or upward and can never end
            // underground, so the plain normal push is always safe here
            const dl=Math.sqrt(c.dx*c.dx+c.dy*c.dy+c.dz*c.dz);
            if(dl>1e-6){
              const k=(need-c.d)/dl;
              pos.x+=c.dx*k; pos.y+=c.dy*k; pos.z+=c.dz*k;
            }else{
              pos.x+=need;// degenerate: exactly on the post axis -> push sideways out
            }
          }
        }
        lastCollision=hitKind;
        collisionCount++;
        showCrash(hitKind==='ring'?'Kollision mit dem Ring!':'Kollision mit dem Pfosten!');
      }

      // ---- ring pass counter: signed distance of the drone centre from every ring plane.
      // When the sign CHANGES the plane was crossed; the in-plane distance at that moment
      // tells whether it happened inside the opening (counted) or outside the ring
      // (ignored, e.g. flying past/above the ring). Every ring counts at most once.
      // A frame that just ended in a collision is skipped - the drone was bounced back.
      const cx=pos.x, cy2=pos.y+droneColCY, cz=pos.z;
      let ringIdx=0;
      for(let i=0;i<obstacles.length;i++){
        const o=obstacles[i];
        if(o.kind!=='ring') continue;
        const dx=cx-o.x, dy=cy2-o.y, dz=cz-o.z;
        const a=dx*o.ax+dy*o.ay+dz*o.az;// signed distance from the ring plane
        const s=(a>=0)?1:-1;
        if(!hitKind && ringPrevSide[ringIdx]!==null && ringPrevSide[ringIdx]!==s && !passedRings[ringIdx]){
          const rx=dx-o.ax*a, ry=dy-o.ay*a, rz=dz-o.az*a;// component in the ring plane
          const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);
          if(rl<o.R-o.tube){// crossed inside the opening -> a real pass through the ring
            passedRings[ringIdx]=true;
            ringPassCount++;
            updateRingBadge();
          }
        }
        ringPrevSide[ringIdx]=s;
        ringIdx++;
      }
    }

    drone.position.set(pos.x,pos.y,pos.z);
    drone.rotation.set(-pos.vz*Math.PI/8, pos.turn, -pos.vx*Math.PI/8);

    // first person view: the camera sits on the nose of the drone. How its orientation is
    // derived depends on the alignment switch:
    //   starr  - rigid on the drone: every pitch/roll of the drone goes into the picture
    //   Gimbal - yaw follows the drone, pitch/roll are damped with inertia (slerp towards a
    //            level orientation, 18% of the drone's pitch/roll stays as residual coupling)
    //   Welt   - orientation locked to the world coordinates: only the yaw follows, the
    //            horizon always stays level
    // The tilt wheel is a LOCAL head tilt and is applied after the alignment in every mode.
    // Offset: just above deck height (deck top 5.01) and 0.35 PAST the nose rim (z ~ -4.7),
    // otherwise the own deck would fill the view as soon as the head tilts down. In front of
    // the nose a downward tilt sees the ground (and the landing pad) without obstruction.
    if(fpv){
      camera.position.set(0,5.5,-5.35).applyQuaternion(drone.quaternion).add(drone.position);
      if(fpvAlign==='welt'){
        // world aligned: yaw only (the drone's yaw is exactly pos.turn), pitch/roll = 0
        camera.quaternion.setFromEuler(fpvLevelE.set(0,pos.turn,0,'YXZ'));
      }else if(fpvAlign==='gimbal'){
        // desired orientation: level horizon, 18% of the drone's pitch/roll coupled back in
        fpvTargetQ.setFromEuler(fpvLevelE.set(0,pos.turn,0,'YXZ')).slerp(drone.quaternion,0.18);
        // exponential smoothing = gimbal inertia (~0.15 s time constant at 60 fps)
        fpvAlignQ.slerp(fpvTargetQ,0.14);
        camera.quaternion.copy(fpvAlignQ);
      }else{
        // rigid on the drone: full orientation, exactly as before
        camera.quaternion.copy(drone.quaternion);
      }
      if(fpvTilt!==0){
        // tilt the camera head locally: a POSITIVE X rotation raises the view, so a
        // downward tilt is applied as a negative rotation about the local X axis
        camera.quaternion.multiply(fpvTiltQ.setFromAxisAngle(fpvAxisX, -fpvTilt*Math.PI/180));
      }
    }

    // success message: fade in the first time the drone touches down near the 2nd landing site
    if(!successShown && pos.y<0.6 && Math.hypot(pos.x-pad2.x, pos.z-pad2.z)<14){
      successShown=true;
      document.getElementById("landedToast").classList.add("show");
    }

    renderer.render(scene, camera);

  }

  window.addEventListener('DOMContentLoaded', main, false);

  window.addEventListener('load',function(){
    // on-screen keycaps: pressing adds the cap's command to `held`, releasing removes
    // ONLY that command - two caps can be held at the same time (multi-touch on the
    // arrow and WASD pads) and letting go of one never cancels the other. Touch events
    // stay bound to the element where the touch started, so touchend/touchcancel per
    // element is exact. A mouse is a single pointer: the window-level mouseup releases
    // the cap last pressed with the mouse, which also catches a release OUTSIDE the
    // button (mouse down on the cap, drag away, let go). Command name == element id.
    let mouseCap=null;// command the mouse is currently holding down
    ["up","dn","tl","tr","mf","mb","ml","mr"].forEach(function(id){
      const el=document.getElementById(id);
      if(!el) return;
      el.addEventListener("mousedown",function(e){
        e.preventDefault();// no text selection / drag of the keycap
        mouseCap=id; held.add(id);
      });
      el.addEventListener("touchstart",function(e){
        e.preventDefault();// also suppresses the emulated mouse events of a touch
        held.add(id);
      });
      el.addEventListener("touchend",function(){ held.delete(id); });
      el.addEventListener("touchcancel",function(){ held.delete(id); });
    });
    window.addEventListener("mouseup",function(){
      if(mouseCap){ held.delete(mouseCap); mouseCap=null; }
    });
  });

</script>
